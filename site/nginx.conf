# Запросы с чужим Host (DNS rebinding: evil.example → 127.0.0.1) не доходят
# до runner: соединение закрывается без ответа.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1 [::1];
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://runner:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Бюджет запроса: ожидание слота (до 30 с), сборка (до 60 с), запуск
        # (10 с) и, у /api/pprof, разбор профилей — ещё до 40 с. Таймаут
        # nginx с запасом больше, чтобы ответ runner доходил до ученика.
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }
}
