name: content

on:
  push:
  pull_request:

jobs:
  lessonlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: Vet
        run: go vet ./tools/lessonlint ./runner/...
      - name: Lint and run lessons
        run: go run ./tools/lessonlint content

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build -f runner/Dockerfile -t go-tutor/runner:ci .
      # Под root в образе включаются смена uid, rlimit'ы, тесты памяти и fork-бомбы.
      - name: Sandbox and API tests
        run: >
          docker run --rm --init -v "$PWD:/repo" -w /repo/runner
          -e GOWORK=off -e GOPROXY=https://proxy.golang.org,direct
          go-tutor/runner:ci go test -count=1 ./...

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Адреса в lock-файле — корпоративный Artifactory; в CI ставим из публичного реестра.
      - run: >
          npm ci --registry=https://registry.npmjs.org/
          --replace-registry-host=https://artifactory.s.o3.ru/artifactory/api/npm/npm-all-virtual
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

  # Критерий этапа 3: пилотные уроки проходятся в браузере от начала до конца.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start tutorial
        run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: >
          npm ci --registry=https://registry.npmjs.org/
          --replace-registry-host=https://artifactory.s.o3.ru/artifactory/api/npm/npm-all-virtual
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npx playwright test
        working-directory: site
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: site/test-results/
