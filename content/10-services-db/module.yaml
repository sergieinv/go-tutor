title: "Сервисы и базы данных: практики"
summary: Как пишут Go-сервисы в продакшне и как они работают с БД — идиомы и ревью, раскладка проекта, пул соединений, транзакции и блокировки, миграции и sqlc, PostgreSQL через pgx и отличия MySQL на настоящих базах.
goals:
  - "Писать код, который проходит ревью: идиомы, ошибки и context через все слои, раскладка проекта, сборка зависимостей в main, graceful shutdown."
  - "Управлять пулом соединений, транзакциями и блокировками, не теряя обновлений и соединений."
  - "Вести схему миграциями, генерировать код запросов sqlc, избегать N+1 и публиковать события через outbox."
  - "Использовать сильные стороны PostgreSQL через pgx и учитывать отличия MySQL: изоляция, блокировки, повторы."
