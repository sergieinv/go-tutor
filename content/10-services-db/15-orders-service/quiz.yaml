questions:
  - id: rollback-after-commit
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"database/sql"
      	"errors"
      	"fmt"

      	_ "modernc.org/sqlite"
      )

      func main() {
      	db, _ := sql.Open("sqlite", ":memory:")
      	defer db.Close()
      	db.SetMaxOpenConns(1)
      	db.Exec(`CREATE TABLE t (x INTEGER)`)

      	tx, _ := db.Begin()
      	tx.Exec(`INSERT INTO t VALUES (1)`)
      	fmt.Println(tx.Commit() == nil, errors.Is(tx.Rollback(), sql.ErrTxDone))

      	var n int
      	db.QueryRow(`SELECT COUNT(*) FROM t`).Scan(&n)
      	fmt.Println(n, db.Stats().InUse)
      }
    options:
      - text: "true true\n1 0"
        correct: true
        explain: "`Rollback` после успешного `Commit` ничего не откатывает, а только возвращает `sql.ErrTxDone`. Поэтому `defer tx.Rollback()` сразу после `BeginTx` безопасен: на успешном пути он пустой, на любом раннем `return` или панике — откатывает и возвращает соединение."
      - text: "true true\n0 0"
        explain: "Строка уже зафиксирована `Commit` — откатить её `Rollback` не может."
      - text: "true false\n1 0"
        explain: "Повторное завершение транзакции возвращает именно `sql.ErrTxDone`."

  - id: background-context
    kind: single
    prompt: "Хендлер вызывает `s.store.Create(context.Background(), order)` с комментарием «чтобы запись не оборвалась, если клиент ушёл». Что из этого — главная проблема?"
    options:
      - text: "Ушедший клиент и истёкший дедлайн не останавливают работу: при перегрузке брошенные запросы продолжают занимать пул и базу"
        correct: true
        explain: "Отмена — механизм защиты от перегрузки. Атомарность записи обеспечивает транзакция: оборванный запрос откатит её целиком. Работа, которая должна пережить запрос, получает свой контекст — `context.WithoutCancel(ctx)` плюс таймаут — и понятного владельца."
      - text: "`context.Background()` нельзя передавать в `database/sql` — будет паника"
        explain: "Можно: это корневой контекст без отмены и дедлайна. Ошибка не в типе, а в том, что связь с запросом потеряна."
      - text: "Транзакция без отмены может зафиксироваться частично"
        explain: "Частичной фиксации транзакция не допускает ни с отменой, ни без. Проблема — в ресурсах, которые занимает никому не нужная работа."

  - id: reserve
    kind: single
    prompt: "Как зарезервировать `qty` единиц товара так, чтобы конкурентные заказы не увели остаток в минус и не продали больше, чем есть?"
    options:
      - text: "`UPDATE products SET available = available - ? WHERE id = ? AND available >= ?` в транзакции заказа; `RowsAffected() == 0` — товара не хватает"
        correct: true
        explain: "Проверка и изменение — один атомарный запрос: база сама сериализует конкурентные `UPDATE` одной строки. Второй путь — `SELECT … FOR UPDATE` в той же транзакции (урок 07)."
      - text: "Сначала `SELECT available` через `db`, затем, если хватает, — `UPDATE … SET available = available - ?` в транзакции"
        explain: "Между проверкой и списанием проходит время, и другие заказы успевают забрать тот же товар. Тот же сбой даёт и один заказ с двумя позициями одного товара."
      - text: "Прочитать остаток в транзакции и записать `SET available = ?` с вычисленным значением"
        explain: "Без блокировки строки это классическое потерянное обновление: две транзакции прочитают одно и то же и запишут одинаковый результат (урок 07)."
      - text: "Защитить резерв `sync.Mutex` в сервисе"
        explain: "Мьютекс работает в одном процессе. Реплик сервиса обычно несколько, а база у них общая, поэтому согласованность должна обеспечивать база."

  - id: wiring
    kind: multiple
    prompt: "Что в Go-сервисе делает функция `run(ctx, args, getenv, stdout) error`, вызываемая из `main`? Выберите всё верное."
    options:
      - text: "Собирает зависимости вручную: база → хранилище → сервис → обработчик → сервер"
        correct: true
        explain: "Это замена DI-контейнера: граф виден целиком, и компилятор проверяет, что все зависимости переданы."
      - text: "Читает конфигурацию через переданный `getenv` и падает при старте, если она невалидна"
        correct: true
        explain: "Fail fast: ошибка конфигурации видна сразу, а не на первом запросе. Переданный `getenv` позволяет тестировать `run` без настоящего окружения."
      - text: "Делает сервис тестируемым целиком: тест вызывает `run` со своими аргументами и окружением"
        correct: true
        explain: "`main` с `os.Exit` протестировать трудно, а `run`, возвращающий ошибку, — легко. Так устроен и `cmd/orders` в `labs/orders`."
      - text: "Регистрирует зависимости в глобальном контейнере, откуда их берут обработчики"
        explain: "Глобального контейнера в идиоматичном Go нет: зависимости передаются явно — полями структур и параметрами конструкторов."
