questions:
  - id: rr-second-read
    kind: single
    prompt: "Транзакция `a` на уровне Repeatable Read прочитала `balance = 100`. Затем транзакция `b` выполнила `UPDATE accounts SET balance = 50` и зафиксировалась. Что вернёт повторный `SELECT balance` в `a`?"
    options:
      - text: "100 — снимок `a` взят первым запросом и действует до конца транзакции"
        correct: true
        explain: "Repeatable Read в PostgreSQL — изоляция снимком: все запросы транзакции видят базу на момент её первого запроса. Новая версия строки от `b` для `a` невидима."
      - text: "50 — `b` уже зафиксировалась"
        explain: "Так было бы на Read Committed: там снимок берётся заново для каждого запроса. Это и есть неповторяемое чтение."
      - text: "`a` ждёт, пока `b` отпустит блокировку"
        explain: "В MVCC читатель не ждёт писателя: `SELECT` читает подходящую его снимку версию строки, блокировки строк для чтения не нужны."

  - id: rr-update-conflict
    kind: single
    prompt: "В той же ситуации `a` (Repeatable Read) выполняет `UPDATE accounts SET balance = balance - 10 WHERE id = 1` — строку, которую изменила и зафиксировала `b`. Что произойдёт и что делать приложению?"
    options:
      - text: "Ошибка `40001` (could not serialize access due to concurrent update) — откатить и повторить всю транзакцию"
        correct: true
        explain: "Обновить можно только последнюю версию строки, а она не видна снимку `a`. Read Committed перечитал бы строку и применил `UPDATE` к ней, а Repeatable Read обрывает транзакцию. Повторять надо целиком: всё прочитанное `a` устарело."
      - text: "UPDATE применится к версии из снимка `a`, и изменение `b` потеряется"
        explain: "Именно от такого потерянного обновления Repeatable Read и защищает — ценой ошибки сериализации."
      - text: "Повторить только этот UPDATE — после ошибки транзакция продолжится"
        explain: "После любой ошибки транзакция PostgreSQL в состоянии aborted: все команды до `ROLLBACK` отклоняются. Да и снимок остался старым — повторять нужно с `BEGIN`."

  - id: write-skew-level
    kind: single
    prompt: "Два врача одновременно снимают себя с дежурства, если дежурных не меньше двух (каждый проверяет `count(*)` и обновляет свою строку). На каком уровне изоляции PostgreSQL гарантирует, что хотя бы один останется?"
    options:
      - text: Только Serializable
        correct: true
        explain: "Транзакции меняют разные строки, поэтому конфликта записи нет — это write skew. Его ловит только SSI: Serializable отслеживает зависимости «прочитал то, что другой изменил» и обрывает одну транзакцию с `40001`."
      - text: Repeatable Read и выше
        explain: "Снимок защищает от неповторяемого чтения и (в PostgreSQL) от фантомов, но не от write skew: каждая транзакция честно видит «двоих» и пишет свою строку."
      - text: Read Committed достаточно, если проверка и обновление в одной транзакции
        explain: "Одна транзакция не делает проверку и запись атомарными относительно другой. Без Serializable нужна явная блокировка (`SELECT … FOR UPDATE` строк дежурных) или ограничение в схеме."

  - id: long-tx
    kind: multiple
    prompt: "Чем вредна транзакция, которая открыта долго (например, `idle in transaction` после забытого `Commit`)?"
    options:
      - text: VACUUM не может удалить мёртвые версии строк, которые ещё видны её снимку, — таблицы и индексы пухнут
        correct: true
        explain: "Горизонт очистки определяется самым старым снимком в базе. Пока транзакция жива, все версии, удалённые после её начала, остаются на диске."
      - text: Она держит взятые блокировки строк и таблиц до конца
        correct: true
        explain: "Блокировки отпускаются только при `COMMIT`/`ROLLBACK`; другие писатели этих строк ждут."
      - text: Она держит соединение пула
        correct: true
        explain: "Транзакция живёт на одном соединении, и пул не может отдать его другим запросам."
      - text: Пока она открыта, другие транзакции не могут читать изменённые ею строки
        explain: "Могут: читатели видят последнюю зафиксированную версию строки, MVCC не заставляет их ждать."

  - id: defer-in-loop
    kind: output
    prompt: "Повтор транзакции написан с `defer` прямо в цикле. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func run() {
      	for attempt := 1; attempt <= 3; attempt++ {
      		fmt.Println("begin", attempt)
      		defer fmt.Println("rollback", attempt)
      		if attempt < 3 {
      			continue // 40001 — пробуем ещё раз
      		}
      		fmt.Println("commit", attempt)
      	}
      }

      func main() {
      	run()
      }
    options:
      - text: |
          begin 1
          begin 2
          begin 3
          commit 3
          rollback 3
          rollback 2
          rollback 1
        correct: true
        explain: "`defer` срабатывает при выходе из функции, а не из итерации. Неудачные попытки не откатываются до конца `run` — их транзакции и соединения висят всё это время. Одну попытку выносят в отдельную функцию с `defer tx.Rollback(ctx)`."
      - text: |
          begin 1
          rollback 1
          begin 2
          rollback 2
          begin 3
          commit 3
          rollback 3
        explain: "Так вела бы себя функция на каждую попытку. Тело цикла — не функция, и отложенные вызовы копятся до выхода из `run`."
      - text: |
          begin 1
          begin 2
          begin 3
          commit 3
          rollback 1
          rollback 2
          rollback 3
        explain: "Отложенные вызовы выполняются в обратном порядке (LIFO): последний `defer` — первым."
