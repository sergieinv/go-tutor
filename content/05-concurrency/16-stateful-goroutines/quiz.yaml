questions:
  - id: closure-ops
    kind: output
    prompt: Владелец выполняет присланные ему функции. Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	ops := make(chan func(map[string]int))
      	done := make(chan struct{})
      	go func() {
      		state := map[string]int{}
      		for op := range ops {
      			op(state)
      		}
      		close(done)
      	}()

      	for i := range 3 {
      		ops <- func(m map[string]int) { m["x"] += i }
      	}
      	res := make(chan int)
      	ops <- func(m map[string]int) { res <- m["x"] }
      	fmt.Println(<-res)

      	close(ops)
      	<-done
      }
    options:
      - text: "3"
        correct: true
        explain: "Функции выполняются владельцем строго по очереди отправки: 0 + 1 + 2 = 3. С Go 1.22 у каждой итерации своя `i`, поэтому замыкания видят 0, 1 и 2."
      - text: "6"
        explain: "Так было бы, если бы все замыкания увидели последнее значение `i` = 2. С Go 1.22 переменная цикла своя на каждой итерации."
      - text: "0"
        explain: "Отправка в небуферизованный `ops` завершается, только когда владелец принял функцию, а читает он их по порядку — запрос на чтение выполнится после всех трёх добавлений."
      - text: Результат случаен — гонка данных
        explain: "К карте обращается только горутина-владелец, остальные лишь передают ей функции. Гонки нет."

  - id: send-only-resp
    kind: compile
    prompt: Скомпилируется ли программа?
    code: |
      package main

      import "fmt"

      type readOp struct {
      	key  string
      	resp chan<- int
      }

      func main() {
      	r := readOp{"a", make(chan int, 1)}
      	r.resp <- 1
      	fmt.Println(<-r.resp)
      }
    compiles: false
    explain: "Поле `resp` объявлено как `chan<- int` — только для отправки, читать из него нельзя: `invalid operation: cannot receive from send-only channel`. Такое направление удобно для владельца, но отправитель запроса должен сохранить у себя двунаправленный канал и читать ответ из него."

  - id: mutex-or-owner
    kind: single
    prompt: "Нужен потокобезопасный счётчик посещений страницы: `Inc()` и `Get()`. Что выбрать?"
    options:
      - text: Горутину-владельца с каналами запросов
        explain: Сработает, но каждая операция — две передачи по каналу и переключение горутин. Для простого состояния это лишнее.
      - text: "`sync.Mutex` или `atomic.Int64`"
        correct: true
        explain: "Состояние простое, операции короткие и независимые — мьютекс или атомик короче и быстрее. Владелец оправдан, когда операция над состоянием — сложная транзакция или состояние живёт вместе с другими событиями в одном `select`."
      - text: Обычную переменную — запись `int` атомарна
        explain: "В Go без синхронизации даже `n++` — гонка данных: `-race` её поймает, а инкременты будут теряться."

  - id: owner-facts
    kind: multiple
    prompt: Что верно для схемы «состоянием владеет одна горутина»? Выберите все верные утверждения.
    options:
      - text: Запросы к состоянию выполняются строго по одному
        correct: true
        explain: Владелец обрабатывает одно сообщение за раз — поэтому и не нужны блокировки.
      - text: Отправленная из владельца карта — это копия состояния
        explain: "Карта, срез и указатель — ссылочные значения. Отправка передаёт ссылку на то же состояние, нужна явная копия, например `maps.Clone`."
      - text: Медленная операция внутри владельца задерживает все остальные запросы
        correct: true
        explain: Владелец — однопоточная очередь. Всё медленное выносят за пределы его цикла.
      - text: Буферизованный канал ответа на одно значение позволяет отправителю не дожидаться ответа без утечки владельца
        correct: true
        explain: Владелец положит ответ в буфер и пойдёт дальше, даже если его никто не прочтёт.
