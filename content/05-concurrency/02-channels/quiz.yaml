questions:
  - id: fifo
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	ch := make(chan int)
      	go func() {
      		for i := range 3 {
      			ch <- i * 10
      		}
      	}()
      	a := <-ch
      	b := <-ch
      	fmt.Println(b, a)
      }
    options:
      - text: "10 0"
        correct: true
        explain: Канал отдаёт значения в порядке отправки. `a` получил 0, `b` — 10. Третья отправка так и не состоялась — `main` завершился раньше.
      - text: "0 10"
        explain: Значения пришли по порядку, но печатаются в обратном — сначала `b`.
      - text: "20 10"
        explain: Первое полученное значение — первое отправленное, то есть 0.
      - text: deadlock
        explain: Горутина-отправитель заблокируется на третьей отправке, но `main` не ждёт её и спокойно завершается. Deadlock — только когда спят все горутины.

  - id: happens-before
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	var data string
      	done := make(chan bool)
      	go func() {
      		data = "готово"
      		done <- true
      	}()
      	<-done
      	fmt.Println(data)
      }
    options:
      - text: готово
        correct: true
        explain: Модель памяти Go гарантирует, что отправка в канал происходит раньше завершения соответствующего получения. Всё, что горутина записала до `done <- true`, видно `main` после `<-done`. Гонки нет.
      - text: пустая строка
        explain: "`main` читает `data` только после получения из `done`, а горутина записала `data` до отправки."
      - text: Результат не определён — гонка данных
        explain: Гонки нет — канал упорядочивает запись и чтение. Без `<-done` она была бы.

  - id: self-deadlock
    kind: single
    prompt: Что произойдёт при запуске?
    code: |
      package main

      import "fmt"

      func main() {
      	ch := make(chan int)
      	ch <- 1
      	fmt.Println(<-ch)
      }
    options:
      - text: Выведет 1
        explain: Небуферизованный канал не хранит значение. Отправка ждёт получателя, а получатель — та же горутина, до которой выполнение не дойдёт.
      - text: "fatal error: all goroutines are asleep - deadlock!"
        correct: true
        explain: "`main` навсегда заблокирована на отправке, других горутин нет. Рантайм видит, что разбудить её некому, и аварийно завершает программу."
      - text: Зависнет навсегда без сообщений
        explain: Так было бы, если бы в программе жила ещё хоть одна горутина. Здесь спят все, и детектор deadlock срабатывает.
      - text: panic при отправке
        explain: Паникует отправка в закрытый канал. Здесь канал открыт, просто получателя нет.

  - id: nil-send-compiles
    kind: compile
    prompt: Скомпилируется ли программа?
    code: |
      package main

      func main() {
      	var ch chan int
      	ch <- 1
      }
    compiles: true
    explain: Компилятор не отслеживает, создан ли канал. Программа соберётся, но отправка в `nil`-канал заблокирует `main` навсегда — и рантайм завершит её с ошибкой deadlock.

  - id: send-returned
    kind: single
    prompt: Отправка `ch <- v` в небуферизованный канал вернула управление. Что это гарантирует отправителю?
    options:
      - text: Значение лежит в буфере канала
        explain: У небуферизованного канала нет буфера, значение передаётся из рук в руки.
      - text: Получатель забрал значение
        correct: true
        explain: Отправка и получение на небуферизованном канале завершаются вместе — это точка встречи.
      - text: Получатель обработал значение
        explain: Канал гарантирует только сам факт передачи. Что получатель сделает со значением дальше, отправитель не знает — для этого нужен ответный сигнал.
