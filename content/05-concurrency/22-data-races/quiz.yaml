questions:
  - id: racy-counter
    kind: single
    prompt: "Программу запустили с `go run -race`. Что произойдёт?"
    code: |
      package main

      import (
      	"fmt"
      	"sync"
      )

      func main() {
      	n := 0
      	var wg sync.WaitGroup
      	for range 1000 {
      		wg.Go(func() { n++ })
      	}
      	wg.Wait()
      	fmt.Println(n)
      }
    options:
      - text: "Детектор напечатает WARNING: DATA RACE, программа выведет число не больше 1000 и завершится с кодом 66"
        correct: true
        explain: "`n++` — чтение и запись без синхронизации из разных горутин. Детектор сообщает о гонке, но программу не останавливает; в конце код выхода 66 (по умолчанию, настраивается `GORACE=exitcode=…`). Часть инкрементов может потеряться."
      - text: "Всегда выведет 1000: `wg.Wait()` синхронизирует горутины"
        explain: "`Wait` упорядочивает доступы горутин относительно `main`, но не между собой: горутины по-прежнему одновременно читают и пишут `n`."
      - text: "Программа упадёт с panic: data race на первой же гонке"
        explain: "Детектор пишет отчёт в stderr и продолжает выполнение (если не задан `GORACE=halt_on_error=1`)."

  - id: channel-hb
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	var msg string
      	done := make(chan bool)
      	go func() {
      		msg = "привет"
      		done <- true
      	}()
      	<-done
      	fmt.Println(msg)
      }
    options:
      - text: привет
        correct: true
        explain: "Запись `msg` идёт до отправки, отправка happens-before завершения получения, получение — до печати. Гонки нет, результат гарантирован моделью памяти."
      - text: Пустая строка или «привет» — зависит от планировщика
        explain: "Канал упорядочивает доступы: `main` читает `msg` только после получения, а горутина пишет её до отправки."
      - text: "WARNING: DATA RACE"
        explain: Между записью и чтением есть happens-before через канал — детектору не о чем сообщать.

  - id: hb-sources
    kind: multiple
    prompt: Что создаёт отношение happens-before между горутинами?
    options:
      - text: Отправка в канал и соответствующее получение
        correct: true
        explain: "Отправка happens-before завершения получения; `close` — тоже, для получения, увидевшего закрытие."
      - text: "`mu.Unlock()` и следующий `mu.Lock()` того же мьютекса"
        correct: true
        explain: Всё, что сделано под мьютексом, видно следующему владельцу.
      - text: "`wg.Done()` и возврат из `wg.Wait()`"
        correct: true
        explain: После `Wait` видны все записи горутин, вызвавших `Done`.
      - text: "Операции `sync/atomic` с одной переменной"
        correct: true
        explain: "С Go 1.19 модель памяти явно говорит: атомарные операции последовательно согласованы и синхронизируют горутины."
      - text: "`time.Sleep(time.Second)` перед чтением"
        explain: "Пауза делает гонку маловероятной, но не устраняет: модель памяти не даёт никаких гарантий от времени, и детектор её всё равно найдёт."

  - id: map-recover
    kind: single
    prompt: "Несколько горутин пишут в общую map без мьютекса, а в `main` стоит `defer func() { recover() }()`. Чем это кончится, если рантайм заметит одновременную запись?"
    options:
      - text: "fatal error: concurrent map writes — процесс завершится, recover не поможет"
        correct: true
        explain: "Это не паника, а фатальная ошибка рантайма: её нельзя перехватить `recover`. Да и `recover` работает только в той горутине, где случилась паника."
      - text: "`recover` перехватит панику, и программа продолжит работу"
        explain: "Фатальные ошибки рантайма (`throw`) обходят механизм `panic`/`recover`."
      - text: Ничего не случится — map в Go потокобезопасна
        explain: "Обычная map не потокобезопасна. Для общего доступа нужен `sync.Mutex`/`RWMutex` или `sync.Map`."

  - id: race-clean
    kind: single
    prompt: "`go test -race ./...` прошёл без единого отчёта. Что это значит?"
    options:
      - text: В тех путях кода, что выполнились в тестах, гонок не случилось
        correct: true
        explain: "Детектор отслеживает реальные доступы к памяти во время выполнения. Код, который тесты не вызвали, и конкурентные сценарии, которые не запускались, он не проверит. Поэтому полезны тесты с настоящей конкуренцией и `-race` в CI."
      - text: В программе гарантированно нет гонок данных
        explain: Детектор не анализирует код статически — он видит только то, что произошло при запуске.
      - text: Тесты не запускали горутин, иначе отчёт был бы всегда
        explain: Корректно синхронизированные горутины отчётов не дают — это нормальный результат.
