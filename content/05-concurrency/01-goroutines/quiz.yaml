questions:
  - id: main-exits
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	go func() {
      		time.Sleep(100 * time.Millisecond)
      		fmt.Println("горутина")
      	}()
      	fmt.Println("main")
      }
    options:
      - text: main
        correct: true
        explain: "`main` печатает строку и возвращается — процесс завершается, не дожидаясь горутины. Она так и не проснётся."
      - text: |
          main
          горутина
        explain: Программа не ждёт запущенные горутины. Чтобы дождаться, нужен `sync.WaitGroup` или канал.
      - text: |
          горутина
          main
        explain: Даже если бы горутина успела, `main` напечатал бы своё раньше — горутина сначала спит 100 мс.

  - id: args-evaluated
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"sync"
      )

      func main() {
      	var wg sync.WaitGroup
      	x := 1
      	wg.Add(1)
      	go func(v int) {
      		defer wg.Done()
      		fmt.Println("v =", v)
      	}(x)
      	x = 2
      	wg.Wait()
      	fmt.Println("x =", x)
      }
    options:
      - text: |
          v = 1
          x = 2
        correct: true
        explain: Как и у `defer`, аргументы вызова в `go` вычисляются сразу, в запускающей горутине. В параметр `v` попала копия `x`, равная 1.
      - text: |
          v = 2
          x = 2
        explain: Так было бы, если бы горутина читала `x` через замыкание, — и это была бы гонка данных. Здесь значение передано параметром.
      - text: |
          x = 2
          v = 1
        explain: "`wg.Wait()` ждёт завершения горутины, поэтому её строка напечатана раньше строки `x`."

  - id: go-result
    kind: compile
    prompt: Скомпилируется ли программа?
    code: |
      package main

      import "fmt"

      func square(n int) int { return n * n }

      func main() {
      	r := go square(3)
      	fmt.Println(r)
      }
    compiles: false
    explain: "`go` — это оператор, а не выражение: значения у него нет, результат функции отбрасывается. Чтобы получить результат из горутины, его отправляют в канал или пишут в заранее выделенную память."

  - id: gomaxprocs
    kind: single
    prompt: Что ограничивает `GOMAXPROCS`?
    options:
      - text: Число горутин в программе
        explain: Горутин может быть сколько угодно — миллионы, если хватит памяти.
      - text: Число потоков ОС, которые одновременно выполняют Go-код
        correct: true
        explain: "`GOMAXPROCS` — число P. Поток выполняет Go-код, только держа P. Потоков в системных вызовах может быть больше: их P передаются другим потокам."
      - text: Общее число потоков ОС в процессе
        explain: Потоки, заблокированные в системных вызовах, в лимит не входят — рантайм создаёт новые. Общий предел потоков задаёт `debug.SetMaxThreads` (по умолчанию 10 000).
      - text: Число ядер, которые видит программа
        explain: "`runtime.NumCPU` от `GOMAXPROCS` не зависит. `GOMAXPROCS` лишь по умолчанию берётся из числа доступных ядер."

  - id: panic-in-goroutine
    kind: single
    prompt: Горутина паникует, `recover` в ней нет. В `main` стоит `defer` с `recover()`. Что произойдёт?
    options:
      - text: "`recover` в `main` перехватит панику, программа продолжит работу"
        explain: "`recover` работает только в той горутине, где идёт паника. У каждой горутины свой стек и свои отложенные вызовы."
      - text: Упадёт только горутина, остальная программа продолжит работу
        explain: Так ведёт себя исключение в `Task`, которую никто не ждёт. В Go паника без `recover` в своей горутине завершает процесс.
      - text: Упадёт весь процесс
        correct: true
        explain: Непойманная паника в любой горутине печатает стек и завершает программу с кодом 2. Если горутина может паниковать, `recover` нужен внутри неё.
