questions:
  - id: lifo-order
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"sync/atomic"
      )

      type node struct {
      	v    int
      	next *node
      }

      type Stack struct{ head atomic.Pointer[node] }

      func (s *Stack) Push(v int) {
      	n := &node{v: v}
      	for {
      		old := s.head.Load()
      		n.next = old
      		if s.head.CompareAndSwap(old, n) {
      			return
      		}
      	}
      }

      func main() {
      	var s Stack
      	for i := 1; i <= 3; i++ {
      		s.Push(i)
      	}
      	all := s.head.Swap(nil)
      	for n := all; n != nil; n = n.next {
      		fmt.Print(n.v, " ")
      	}
      	fmt.Println(s.head.Load() == nil)
      }
    options:
      - text: "3 2 1 true"
        correct: true
        explain: "Каждый `Push` ставит узел на вершину, поэтому цепочка от вершины — 3, 2, 1. `Swap(nil)` атомарно забирает её целиком и оставляет стек пустым."
      - text: "1 2 3 true"
        explain: "Это порядок вставки, а стек отдаёт значения от вершины — последний вставленный первым."
      - text: "3 2 1 false"
        explain: "`Swap(nil)` записал `nil` в вершину и вернул прежнее значение — стек пуст."

  - id: cas-fail-meaning
    kind: single
    prompt: "В `Push` стека Трайбера `CompareAndSwap(old, n)` вернул `false`. Что это значит?"
    options:
      - text: "Между `Load` и CAS вершину сменила другая горутина; нужно перечитать вершину, заново записать `n.next` и повторить"
        correct: true
        explain: "CAS ничего не изменил, узел `n` никто не видел. Неудача означает, что кто-то другой продвинулся, — так lock-free гарантирует прогресс системы."
      - text: "Стек переполнен"
        explain: "У связного стека нет ёмкости; CAS проверяет только, что вершина всё ещё `old`."
      - text: "Узел `n` уже частично опубликован, и его надо удалить"
        explain: "Неудачный CAS ничего не записывает: `n` остаётся невидимым для других горутин."
      - text: "Горутина заблокирована и должна ждать"
        explain: "В lock-free коде никто не ждёт: горутина сразу повторяет попытку."

  - id: aba-go
    kind: single
    prompt: "Почему стеку Трайбера на `atomic.Pointer` в Go не нужен счётчик версий против ABA?"
    options:
      - text: "Пока у горутины есть указатель на узел, GC не освободит его, и новый узел не получит тот же адрес"
        correct: true
        explain: "ABA требует, чтобы по старому адресу появился другой узел. Ссылка `old` держит объект живым — пока вы сами не начнёте переиспользовать узлы (`sync.Pool`, free-list)."
      - text: "`CompareAndSwap` в Go сравнивает содержимое узлов, а не адреса"
        explain: "`atomic.Pointer.CompareAndSwap` сравнивает именно указатели."
      - text: "Рантайм Go запрещает вытеснение горутины между `Load` и CAS"
        explain: "Горутину можно вытеснить в любой момент — асинхронное вытеснение работает с Go 1.14."
      - text: "Счётчик версий встроен в `atomic.Pointer`"
        explain: "`atomic.Pointer` хранит только указатель. Счётчик рядом с адресом использует рантайм в своём `lfstack`, узлы которого лежат вне кучи."

  - id: progress
    kind: multiple
    prompt: "Что верно о гарантиях прогресса?"
    options:
      - text: "Стек Трайбера — lock-free: хотя бы одна горутина всегда завершает операцию"
        correct: true
        explain: "Неудачный CAS одной горутины означает успешный CAS другой."
      - text: "Стек Трайбера — wait-free: каждая операция завершается за ограниченное число шагов"
        explain: "Отдельная горутина может проигрывать CAS сколько угодно раз — голодание возможно."
      - text: "Стек на `sync.Mutex` не lock-free: вытесненный владелец блокировки останавливает остальных"
        correct: true
        explain: "Пока владелец не отпустит мьютекс, никто не продвинется, как бы часто их ни запускали."
      - text: "Lock-free структура всегда быстрее структуры на мьютексе"
        explain: "Гарантия прогресса — не скорость. Общая вершина — горячая кеш-линия, неудачные CAS повторяются, а узлы выделяются в куче."

  - id: size-field
    kind: single
    prompt: "К стеку добавили поле `size atomic.Int64`: `Push` после успешного CAS делает `size.Add(1)`, `Pop` — `size.Add(-1)`. Что не так?"
    options:
      - text: "Вершина и длина меняются двумя отдельными атомарными операциями: между ними другие горутины видят несогласованную пару"
        correct: true
        explain: "Каждая операция атомарна, а пара — нет. `size` может кратковременно расходиться с реальным содержимым и даже стать отрицательной, если `Pop` успеет раньше `Add(1)`. Точную длину хранят в узле — она публикуется тем же CAS."
      - text: "Ничего, `atomic.Int64` гарантирует точную длину в любой момент"
        explain: "Счётчик точен сам по себе, но не согласован с вершиной: это две разные переменные."
      - text: "Это гонка данных, детектор её найдёт"
        explain: "Все обращения атомарные — гонки данных нет, есть логическое несоответствие, которое детектор не видит."
