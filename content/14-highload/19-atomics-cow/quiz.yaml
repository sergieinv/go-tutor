questions:
  - id: cas-max
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"sync"
      	"sync/atomic"
      )

      func storeMax(m *atomic.Int64, v int64) {
      	for {
      		cur := m.Load()
      		if v <= cur || m.CompareAndSwap(cur, v) {
      			return
      		}
      	}
      }

      func main() {
      	var m atomic.Int64
      	var wg sync.WaitGroup
      	for g := range 4 {
      		wg.Go(func() {
      			for i := range 100 {
      				storeMax(&m, int64(g*100+i))
      			}
      		})
      	}
      	wg.Wait()
      	fmt.Println(m.Load())
      }
    options:
      - text: "399"
        correct: true
        explain: "CAS-цикл не теряет обновлений: если значение изменили между `Load` и `CompareAndSwap`, CAS вернёт false, и горутина перечитает. Максимум из всех `g*100+i` — 3·100+99 = 399."
      - text: "Зависит от порядка горутин: какое-то число от 99 до 399"
        explain: "Порядок влияет только на число повторов, но не на результат: меньшее значение никогда не перезапишет большее."
      - text: "99"
        explain: "Каждая горутина пытается записать свои значения, и проверка `v <= cur` пропускает только меньшие."

  - id: load-store-lost
    kind: single
    prompt: "Два писателя одновременно выполняют `old := p.Load(); next := withKey(old, k); p.Store(next)` с разными ключами. Что может случиться?"
    options:
      - text: "Один из ключей пропадёт: оба писателя скопируют один и тот же `old`, и второй `Store` затрёт снимок первого"
        correct: true
        explain: "Каждая операция атомарна, но их сочетание — нет. С несколькими писателями нужен `CompareAndSwap` в цикле или мьютекс для писателей."
      - text: "Детектор гонок сообщит о гонке на `p`"
        explain: "Все обращения к `p` атомарные — гонки данных нет, есть логическая ошибка: потерянное обновление."
      - text: "Ничего: `Store` атомарен, поэтому оба ключа окажутся в снимке"
        explain: "Атомарен только сам `Store` — он целиком заменяет указатель на снимок, в котором нет ключа другого писателя."

  - id: shallow-copy
    kind: single
    prompt: "Писатель делает `next := *old; next.Limits[k] = v; p.Store(&next)`, где `Limits` — map. Что не так?"
    options:
      - text: "Копия структуры разделяет map со старым снимком: запись идёт в опубликованную map, которую сейчас читают"
        correct: true
        explain: "Присваивание структуры копирует заголовок map (указатель), а не содержимое. Это гонка данных с читателями; нужно `maps.Clone(old.Limits)`."
      - text: "`p.Store(&next)` публикует указатель на локальную переменную, которая исчезнет после выхода из функции"
        explain: "Escape analysis переместит `next` в кучу, и указатель останется действительным, — проблема не в этом."
      - text: "Ничего: снимок копируется целиком"
        explain: "Целиком копируется только сама структура; map, срезы и указатели внутри остаются общими."

  - id: atomic-order
    kind: multiple
    prompt: "Что верно для `sync/atomic` в Go?"
    options:
      - text: "Все атомарные операции программы выглядят выполненными в едином последовательном порядке"
        correct: true
        explain: "Так сказано в `go doc sync/atomic`: последовательная согласованность, как `seq_cst` в C++."
      - text: "Если атомарное чтение увидело значение атомарной записи, всё, что писатель записал до неё, видно читателю"
        correct: true
        explain: "Запись «synchronizes before» чтение, которое её увидело, — на этом держится публикация снимка через `atomic.Pointer`."
      - text: "Можно выбрать ослабленный режим, например acquire/release, ради скорости"
        explain: "В Go таких режимов нет — только последовательно согласованные операции."
      - text: "`atomic.Int64` можно копировать присваиванием, как обычный `int64`"
        explain: "Копия — новая переменная без связи с исходной, а копирование во время работы с ней — гонка. В типе есть `noCopy`, и `go vet` сообщит о копировании."

  - id: cas-vs-mutex
    kind: single
    prompt: "Конфигурация — map на 50 000 ключей, обновляется сотни раз в секунду из десятков горутин, читается редко. Что выбрать?"
    options:
      - text: "Мьютекс (или шардирование): copy-on-write копировал бы всю map на каждую попытку, а при частых конфликтах CAS попытки ещё и повторяются"
        correct: true
        explain: "Copy-on-write окупается, когда чтений на порядки больше, чем записей, и снимок небольшой. Здесь наоборот."
      - text: "Copy-on-write на `atomic.Pointer` — lock-free всегда быстрее"
        explain: "Lock-free гарантирует прогресс, а не скорость. Копирование 50 000 ключей на каждое обновление и выброшенная работа неудачных CAS обойдутся дороже мьютекса."
      - text: "`atomic.Value` с map внутри и прямой записью в эту map"
        explain: "Запись в общую map без синхронизации — гонка данных, `atomic.Value` защищает только саму замену значения."
