questions:
  - id: mask-index
    kind: output
    prompt: "Индексы кольца на 4 ячейки только растут. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	buf := make([]string, 4)
      	mask := uint64(len(buf) - 1)
      	var head, tail uint64
      	for _, s := range []string{"a", "b", "c", "d", "e", "f"} {
      		if tail-head == uint64(len(buf)) {
      			head++ // выбросить самый старый
      		}
      		buf[tail&mask] = s
      		tail++
      	}
      	for i := head; i < tail; i++ {
      		fmt.Print(buf[i&mask])
      	}
      	fmt.Println(" ", head, tail)
      }
    options:
      - text: "cdef  2 6"
        correct: true
        explain: "После четырёх записей кольцо полно, и каждая следующая сдвигает `head`. `e` и `f` легли в ячейки 0 и 1 (`4&3`, `5&3`), поверх `a` и `b`; чтение от `head = 2` до `tail = 6` даёт `c d e f`."
      - text: "efcd  2 6"
        explain: "Это порядок ячеек в массиве. Читаем же по индексам `head..tail`, и маска переводит их в позиции: 2, 3, 0, 1."
      - text: "abcd  0 4"
        explain: "Индексы не останавливаются на длине массива — они растут, а позицию даёт `& mask`."

  - id: spsc-order
    kind: single
    prompt: "В `TryPush` SPSC-кольца поменяли местами две строки: сначала `tail.Store(t+1)`, потом `buf[t&mask] = v`. Что произойдёт?"
    options:
      - text: "Потребитель может увидеть новый `tail` и прочитать ячейку до записи — получит старое значение; `-race` сообщит о гонке"
        correct: true
        explain: "Атомарная запись `tail` публикует только то, что было записано до неё. Ячейку, записанную после, ничто не упорядочивает с чтением потребителя."
      - text: "Ничего: `tail` атомарный, значит, и ячейка защищена"
        explain: "Атомик синхронизирует только записи, сделанные до него в программном порядке."
      - text: "Кольцо перестанет различать «полно» и «пусто»"
        explain: "Условия «полно» и «пусто» считаются по индексам и не зависят от порядка этих двух строк."

  - id: when-channel
    kind: multiple
    prompt: "В каких случаях буферизованный канал лучше кольца на атомиках?"
    options:
      - text: "Потребитель большую часть времени ждёт данных"
        correct: true
        explain: "Канал паркует горутину, а ожидание у кольца — активное (`TryPop` в цикле), оно жжёт ядро."
      - text: "Нужны `select`, таймаут или отмена через `context`"
        correct: true
        explain: "Кольцо умеет только «попробовать»; всё остальное пришлось бы строить поверх."
      - text: "Производителей несколько, а кольцо — SPSC"
        correct: true
        explain: "SPSC-кольцо с несколькими производителями теряет значения; канал работает с любым числом отправителей."
      - text: "Миллионы сообщений в секунду между двумя всегда занятыми горутинами, и профиль показывает, что узкое место — канал"
        explain: "Это как раз случай, когда кольцо может окупиться — после замера."

  - id: sync-map
    kind: single
    prompt: "Для какой задачи `sync.Map` подходит по документации?"
    options:
      - text: "Кеш, в который ключ записывается один раз, а читается много раз из разных горутин"
        correct: true
        explain: "Это первый из двух случаев в `go doc sync.Map`; второй — горутины работают с непересекающимися наборами ключей."
      - text: "Счётчики по ключу, которые все горутины постоянно увеличивают"
        explain: "Частые перезаписи общих ключей — не сценарий `sync.Map`; лучше map под мьютексом или шардированная map со счётчиками."
      - text: "Map, у которой нужно часто узнавать длину и обходить в согласованном виде"
        explain: "У `sync.Map` нет `len`, а `Range` не даёт согласованного снимка."
      - text: "Любая map, к которой обращаются больше одной горутины"
        explain: "Документация прямо советует для большинства случаев обычную map с блокировкой — ради типобезопасности и простоты."

  - id: retention
    kind: single
    prompt: "Кольцо `Ring[*Request]` после `TryPop` не обнуляет ячейку. Чем это плохо?"
    options:
      - text: "Выданный запрос остаётся достижимым через ячейку, и GC не соберёт его, пока ячейку не перезапишут"
        correct: true
        explain: "В долго недозаполненном кольце так копятся объекты, которые уже никому не нужны. `sync.Pool` в своём кольце обнуляет ячейки ровно поэтому."
      - text: "Следующий `TryPop` вернёт тот же запрос ещё раз"
        explain: "Нет: `head` уже сдвинут, повторно ячейку прочитают только на следующем круге, после новой записи."
      - text: "Это гонка данных"
        explain: "Ячейку после сдвига `head` трогает только производитель; гонки нет, есть удержание памяти."
