questions:
  - id: list-allocs
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"container/list"
      	"fmt"
      	"testing"
      )

      func main() {
      	var l list.List
      	s := make([]int64, 0, 1000)
      	fromList := testing.AllocsPerRun(100, func() { l.PushBack(int64(7)) })
      	fromSlice := testing.AllocsPerRun(100, func() { s = append(s, 7) })
      	fmt.Println(fromList, fromSlice)
      }
    options:
      - text: "1 0"
        correct: true
        explain: "`PushBack` создаёт `*list.Element` на каждый вызов. Значение 7 упаковывается в `any` без выделения — маленькие числа рантайм берёт из таблицы `staticuint64s`. `append` в пределах ёмкости пишет в готовый массив."
      - text: "2 0"
        explain: "Упаковка 7 в интерфейс не выделяет память: значения 0–255 берутся из готовой таблицы. Остаётся один узел на вызов."
      - text: "1 1"
        explain: "Ёмкости 1000 хватает на все 101 вызов `append` — массив уже выделен."
      - text: "0 0"
        explain: "Каждый элемент `container/list` — отдельный объект `Element` в куче."

  - id: loop-order
    kind: single
    prompt: "Матрица `m []float64` размером n×n хранится по строкам (элемент (i, j) — `m[i*n+j]`). Какой обход быстрее при большом n и почему?"
    options:
      - text: "Внешний цикл по i, внутренний по j: соседние итерации читают соседние адреса, каждая кеш-линия используется целиком"
        correct: true
        explain: "Последовательный обход — 8 (или 16 на Apple M) значений на одну загрузку линии, плюс аппаратная предвыборка. По столбцам каждый шаг — новая линия, которая вытесняется раньше, чем до её соседей дойдёт очередь."
      - text: "Внешний цикл по j, внутренний по i: так меньше умножений"
        explain: "Умножения дешёвые и компилятор их всё равно выносит; дорого ожидание памяти, а обход по столбцам прыгает на `n*8` байт."
      - text: "Без разницы: процессор всё равно читает память по байту"
        explain: "Процессор читает память кеш-линиями по 64 или 128 байт, поэтому порядок обхода решает, сколько из прочитанного пригодится."
      - text: "Без разницы, если матрица меньше оперативной памяти"
        explain: "Разница появляется, как только матрица не помещается в кеши процессора (мегабайты), а не в RAM."

  - id: pointer-chasing
    kind: single
    prompt: "Почему обход связного списка, узлы которого разбросаны по памяти, бывает в сотни раз медленнее обхода среза тех же значений?"
    options:
      - text: "Адрес следующего узла известен только после чтения текущего: загрузки идут строго по очереди, предвыборка бессильна, и каждый промах кеша — полное ожидание памяти"
        correct: true
        explain: "Это и называют pointer chasing. Срез процессор читает наперёд, а у списка следующая загрузка зависит от предыдущей."
      - text: "Каждое разыменование указателя в Go проверяется на nil, а это дорого"
        explain: "Проверка на nil почти бесплатна (часто это просто аппаратное исключение при обращении к нулевой странице). Дорого ожидание памяти."
      - text: "Сборщик мусора останавливает программу при каждом переходе по указателю"
        explain: "Чтение указателя не вызывает GC. Указатели нагружают GC при маркировке, но обход списка медленный по другой причине."
      - text: "Узлы списка всегда в 16 раз больше значений"
        explain: "Узел `{val int64; next *node}` — 16 байт, вдвое больше значения. Объём важен, но главная беда — зависимые загрузки вразнобой."

  - id: cache-line
    kind: multiple
    prompt: "Что верно про кеш-линию?"
    options:
      - text: "На x86-64 она 64 байта"
        correct: true
        explain: "Так у современных процессоров Intel и AMD."
      - text: "На Apple M1 и новее — 128 байт"
        correct: true
        explain: "Так сообщает `sysctl hw.cachelinesize` на Apple Silicon; поэтому `internal/cpu.CacheLinePadSize` для arm64 в Go — 128."
      - text: "Процессор может прочитать из памяти в кеш один байт, не трогая соседние"
        explain: "Обмен с памятью идёт целыми линиями: прочитать байт — значит загрузить всю линию."
      - text: "Размер линии можно узнать функцией стандартной библиотеки Go"
        explain: "Публичной функции нет: `internal/cpu` недоступен программам, а `golang.org/x/sys/cpu.CacheLinePad` — тип-заполнитель для выравнивания (структура нужного размера), а не измерение."
