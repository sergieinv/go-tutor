questions:
  - id: month-boundary
    kind: output
    prompt: "Партиции по месяцам UTC: `[1-е число, 1-е число следующего)`. Какую партицию выберет функция для заказа, созданного 1 марта в 05:00 по Токио?"
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	tokyo := time.FixedZone("UTC+9", 9*3600)
      	at := time.Date(2026, 3, 1, 5, 0, 0, 0, tokyo)
      	fmt.Println("orders_" + at.Format("2006_01"), "orders_"+at.UTC().Format("2006_01"))
      }
    options:
      - text: "orders_2026_03 orders_2026_02"
        correct: true
        explain: "`Format` печатает время в его собственном поясе — 1 марта. Тот же момент в UTC — 28 февраля, 20:00, и строка ляжет в февральскую партицию. Имя партиции считайте от `t.UTC()`, иначе приложение и база разойдутся на часы у каждой границы."
      - text: "orders_2026_03 orders_2026_03"
        explain: "В UTC это 28 февраля 20:00 — февраль."
      - text: "orders_2026_02 orders_2026_02"
        explain: "`at.Format` использует пояс самого значения — UTC+9, где уже 1 марта."

  - id: pruning
    kind: multiple
    prompt: "`orders` разбита `PARTITION BY RANGE (created_at)` по месяцам. Какие условия позволят планировщику прочитать только одну-две партиции?"
    options:
      - text: "`created_at >= $1 AND created_at < $2` (неделя)"
        correct: true
        explain: "Условие сравнивает саму колонку ключа — работает отсечение при планировании или, для обобщённого плана, при выполнении."
      - text: "`created_at BETWEEN '2026-02-10 00:00+00' AND '2026-02-11 00:00+00'`"
        correct: true
        explain: "`BETWEEN` — те же сравнения `>=` и `<=` на колонке ключа, отсечение работает."
      - text: "`date_trunc('day', created_at) = '2026-02-10'`"
        explain: "Функция над ключом прячет его от планировщика: читаются все партиции. Пишите полуинтервал."
      - text: "`customer_id = 42`"
        explain: "Это не ключ партиционирования: нужная строка может быть в любом месяце."

  - id: unique
    kind: single
    prompt: "Таблица `orders` разбита по `created_at`. Почему `ALTER TABLE orders ADD PRIMARY KEY (id)` даёт ошибку `0A000`?"
    options:
      - text: "Уникальный индекс проверяется внутри каждой партиции, и без ключа партиционирования база не может гарантировать уникальность `id` между партициями"
        correct: true
        explain: "Поэтому PostgreSQL требует включить колонки ключа: `PRIMARY KEY (id, created_at)`. Глобальную уникальность одного `id` обеспечивают последовательностью или UUID."
      - text: "На партиционированной таблице первичный ключ невозможен вообще"
        explain: "Возможен, если включает все колонки ключа партиционирования — в примере `PRIMARY KEY (id, created_at)` создаётся."
      - text: "`id` нужно сначала объявить `NOT NULL`"
        explain: "`PRIMARY KEY` сам делает колонки `NOT NULL`; ошибка о ключе партиционирования, а не о NULL."

  - id: partition-vs-shard
    kind: single
    prompt: "Основной сервер PostgreSQL упирается в запись: CPU 95% и диск на пределе. Поможет ли партиционирование таблицы заказов по месяцам?"
    options:
      - text: "Почти нет: партиции живут на том же сервере и не добавляют ни ядер, ни дисков — нужно шардирование (или разгрузка записи)"
        correct: true
        explain: "Партиционирование ускоряет запросы по ключу, делает индексы компактнее и удаление старых данных дешёвым, но запись идёт в тот же WAL на тот же диск."
      - text: "Да: каждая партиция пишется отдельным процессом PostgreSQL"
        explain: "Нет такого: строки пишут те же бэкенды в общий WAL."
      - text: "Да, если добавить DEFAULT-партицию"
        explain: "DEFAULT только ловит строки вне диапазонов; к производительности записи она отношения не имеет."
