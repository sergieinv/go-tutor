questions:
  - id: select-default-shed
    kind: output
    prompt: "Ограничитель на буферизованном канале: место — элемент в канале. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	slots := make(chan struct{}, 2)
      	accepted, shed := 0, 0
      	for range 5 {
      		select {
      		case slots <- struct{}{}: // заняли место и пока не отдали
      			accepted++
      		default:
      			shed++
      		}
      	}
      	<-slots // одна обработка закончилась
      	select {
      	case slots <- struct{}{}:
      		accepted++
      	default:
      		shed++
      	}
      	fmt.Println(accepted, shed)
      }
    options:
      - text: "3 3"
        correct: true
        explain: "Первые два запроса заняли оба места, следующие три получили `default` — отказ без ожидания. После того как одно место вернули, шестой запрос его получил: 3 принято, 3 отброшено."
      - text: "2 4"
        explain: "Перед шестым запросом одно место освободилось (`<-slots`), и он его занял."
      - text: "5 1"
        explain: "Ёмкость канала — 2: третья отправка не помещается, и `select` с `default` не ждёт, а сразу уходит в `default`."

  - id: littles-law
    kind: single
    prompt: "Сервис получает 300 запросов в секунду, обработка в среднем занимает 40 мс. Сколько запросов в среднем обрабатывается одновременно?"
    options:
      - text: "12"
        correct: true
        explain: "Закон Литтла: L = λ × W = 300 /с × 0,04 с = 12. Лимит параллелизма ставят с запасом на разброс — например, 25–40, — и уточняют нагрузочным тестом."
      - text: "300"
        explain: "Это запросы в секунду, а не одновременно: каждый занимает место всего 40 мс."
      - text: "7,5"
        explain: "Это 300 / 40 — единицы не сходятся. Нужно умножить интенсивность на время: 300 × 0,04."

  - id: acquire-canceled
    kind: output
    prompt: "Семафор пуст, но контекст уже отменён. Что выведет программа?"
    code: |
      package main

      import (
      	"context"
      	"fmt"

      	"golang.org/x/sync/semaphore"
      )

      func main() {
      	sem := semaphore.NewWeighted(1)
      	ctx, cancel := context.WithCancel(context.Background())
      	cancel()
      	err := sem.Acquire(ctx, 1)
      	fmt.Println(err, sem.TryAcquire(1))
      }
    options:
      - text: "context canceled true"
        correct: true
        explain: "`Acquire` сначала проверяет контекст и при отменённом возвращает `ctx.Err()`, даже если место свободно, — семафор не меняется. Поэтому следующий `TryAcquire` место получает. Запрос, чей клиент уже ушёл, не должен занимать слот."
      - text: "<nil> false"
        explain: "Отмена «случилась раньше» вызова: `Acquire` предпочитает отказать, даже если мог бы взять место без ожидания."
      - text: "<nil> true"
        explain: "Ёмкость семафора 1: если бы `Acquire` взял место, `TryAcquire` вернул бы `false`."

  - id: overload-practices
    kind: multiple
    prompt: "Что правильно для сервиса под перегрузкой?"
    options:
      - text: "Отвечать `503` с `Retry-After`, когда очередь полна"
        correct: true
        explain: "Клиент сразу узнаёт об отказе и получает подсказку, когда повторить, — вместо мгновенного повтора, который раздувает шторм."
      - text: "Ставить ограничитель первым на дорогом маршруте, до разбора тела и запросов в базу"
        correct: true
        explain: "Отказ должен стоить микросекунды. Если перед ним успели прочитать тело и сходить в базу, отказ не экономит ресурсы."
      - text: "Ограничивать ожидание в очереди контекстом с родителем `r.Context()`"
        correct: true
        explain: "Таймаут очереди — свой, а отмена клиента приходит через родителя: ушедший клиент не держит место в очереди."
      - text: "Пропускать `/healthz` через тот же ограничитель, чтобы проба честно показывала перегрузку"
        explain: "Liveness-проба упадёт, под перезапустят, нагрузка перельётся на соседей — каскадный отказ. Служебные маршруты — мимо ограничителя."
      - text: "Сделать очередь неограниченной, чтобы не терять запросы"
        explain: "Запросы всё равно потеряются — по таймауту клиента, но уже после того, как сервер потратил на них память и время. Неограниченная очередь — отложенный отказ."

  - id: lifo-why
    kind: single
    prompt: "Сервис перегружен: в очереди всегда есть ждущие, клиенты ждут 1 с. Чем LIFO-очередь лучше FIFO?"
    options:
      - text: "Место получает самый свежий запрос — у него почти весь бюджет, и он успеет; старые уходят по таймауту очереди"
        correct: true
        explain: "FIFO при постоянной очереди обслуживает тех, кто ждал дольше всех и чаще всего уже не успеет. LIFO превращает «все медленно» в «большинство быстро, часть — отказ»."
      - text: "LIFO обрабатывает запросы быстрее: меньше операций с очередью"
        explain: "Стоимость операций с очередью ничтожна. Выигрыш — в том, кому достаётся место, а не в скорости очереди."
      - text: "LIFO гарантирует, что ни один запрос не получит отказ"
        explain: "При перегрузке отказы неизбежны — вопрос в том, кто их получит. В LIFO это самые старые запросы."
