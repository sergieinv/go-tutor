questions:
  - id: reorder
    kind: output
    prompt: Что выведет программа на 64-битной платформе?
    code: |
      package main

      import (
      	"fmt"
      	"unsafe"
      )

      type a struct {
      	ok    bool
      	id    int64
      	ready bool
      }

      type b struct {
      	id    int64
      	ok    bool
      	ready bool
      }

      func main() {
      	fmt.Println(unsafe.Sizeof(a{}), unsafe.Sizeof(b{}))
      }
    options:
      - text: "24 16"
        correct: true
        explain: "В `a` после `ok` семь пустых байт, чтобы `id` начался со смещения 8, и ещё семь в хвосте после `ready`. В `b` оба `bool` идут подряд за `int64`, хвост — 6 байт до кратного 8."
      - text: "10 10"
        explain: "10 байт — сумма размеров полей. Компилятор выравнивает `int64` по 8 и добивает размер структуры до кратного её выравниванию."
      - text: "16 16"
        explain: "Компилятор Go не переставляет поля: в `a` дыры остаются там, где их создал порядок объявления."
      - text: "24 24"
        explain: "В `b` два однобайтовых поля стоят рядом в одном восьмибайтовом хвосте — 16 байт."

  - id: small-fields
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"unsafe"
      )

      type x struct {
      	n    int32
      	flag bool
      	code int16
      }

      type y struct {
      	flag bool
      	n    int32
      	code int16
      }

      func main() {
      	var v y
      	fmt.Println(unsafe.Sizeof(x{}), unsafe.Sizeof(y{}), unsafe.Offsetof(v.code))
      }
    options:
      - text: "8 12 8"
        correct: true
        explain: "В `x`: `n` 0–3, `flag` 4, один пустой байт, `code` 6–7 — 8 байт. В `y`: `flag` 0, три пустых, `n` 4–7, `code` 8–9, хвост до кратного 4 — 12."
      - text: "7 7 5"
        explain: "Это сумма размеров без выравнивания. `int16` начинается с чётного смещения, `int32` — с кратного 4."
      - text: "8 8 6"
        explain: "Порядок полей в `y` создаёт дыру после `flag`: `n` должен начаться со смещения 4."
      - text: "12 12 8"
        explain: "В `x` `flag` и `code` помещаются в одно четырёхбайтовое слово после `n`."

  - id: zero-size-tail
    kind: output
    prompt: Что выведет программа на 64-битной платформе?
    code: |
      package main

      import (
      	"fmt"
      	"unsafe"
      )

      type tail struct {
      	n    int64
      	done struct{}
      }

      type head struct {
      	done struct{}
      	n    int64
      }

      func main() {
      	fmt.Println(unsafe.Sizeof(tail{}), unsafe.Sizeof(head{}))
      }
    options:
      - text: "16 8"
        correct: true
        explain: "Поле нулевого размера в конце получает байт: иначе `&t.done` указывал бы за конец объекта, на соседний объект, и держал бы его живым для GC. С выравниванием это 8 лишних байт. В начале структуры такое поле ничего не стоит."
      - text: "8 8"
        explain: "`struct{}` занимает 0 байт, но последнее поле структуры компилятор добивает до байта — и выравнивание превращает его в 8."
      - text: "16 16"
        explain: "В начале структуры `struct{}` делит адрес со следующим полем и места не занимает."
      - text: "9 9"
        explain: "Размер структуры всегда кратен её выравниванию — здесь 8."

  - id: slice-of-values
    kind: single
    prompt: "Кеш держит миллион заказов. Чем `[]Order` (структура без указателей внутри) лучше `[]*Order`?"
    options:
      - text: "Один непрерывный блок: одно выделение, последовательное чтение для кеша процессора и ни одного указателя для GC"
        correct: true
        explain: "`[]*Order` — массив указателей плюс миллион отдельных объектов: миллион выделений, обход прыгает по куче, а GC на каждом цикле проверяет миллион указателей. Блок без указателей GC вообще не сканирует."
      - text: "`[]Order` занимает меньше памяти, потому что Go сжимает структуры в срезе"
        explain: "Ничего не сжимается: элемент среза занимает `unsafe.Sizeof(Order{})` с тем же padding. Экономия — на указателях и заголовках отдельных объектов."
      - text: "Разницы нет: компилятор сам превращает `[]*Order` в `[]Order`"
        explain: "Компилятор не меняет представление данных: указатель остаётся указателем, объекты — в куче."
      - text: "`[]*Order` нельзя сортировать"
        explain: "Сортировать можно оба; срез указателей даже меняет местами 8 байт вместо целой структуры. Цена — в выделениях, локальности и работе GC."

  - id: has-pointers
    kind: multiple
    prompt: "В каких типах есть указатели, которые сборщик мусора должен сканировать?"
    options:
      - text: "`string`"
        correct: true
        explain: "Заголовок строки — указатель на байты и длина."
      - text: "`time.Time`"
        correct: true
        explain: "Внутри `loc *time.Location` — поэтому миллионы `time.Time` в памяти — миллионы указателей для GC, даже если все они в UTC."
      - text: "`[16]byte`"
        explain: "Массив байт — просто 16 байт значений."
      - text: "`struct{ id int64; price float64 }`"
        explain: "Только числа: такие объекты аллокатор кладёт в noscan-спаны, GC их не просматривает."
      - text: "`[]int64`"
        correct: true
        explain: "Заголовок среза содержит указатель на массив. Сам массив `int64` указателей не содержит и не сканируется — но на него указывают."
