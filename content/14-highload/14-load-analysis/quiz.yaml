questions:
  - id: counter-reset
    kind: output
    prompt: "Два снимка счётчика по рядам; между ними один процесс перезапустился. Слева — прирост по правилам `rate` (каждый ряд отдельно, сброс — счёт от нуля), справа — разность сумм с отсечкой нуля. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	before := map[string]float64{"a": 100, "b": 50}
      	after := map[string]float64{"a": 20, "b": 70, "c": 5}

      	perSeries, sumBefore, sumAfter := 0.0, 0.0, 0.0
      	for k, v := range after {
      		sumAfter += v
      		b, ok := before[k]
      		if !ok || v < b {
      			perSeries += v // новый ряд или сброс
      		} else {
      			perSeries += v - b
      		}
      	}
      	for _, v := range before {
      		sumBefore += v
      	}
      	fmt.Println(perSeries, max(0, sumAfter-sumBefore))
      }
    options:
      - text: "45 0"
        correct: true
        explain: "Ряд `a` сбросился (100 → 20): после рестарта счёт с нуля, прирост 20. `b` вырос на 20, `c` появился — 5. Итого 45. Разность сумм 95 − 150 отрицательна, отсечка даёт 0: сброс одного ряда «съел» прирост всех остальных. Поэтому `rate` и задача урока считают каждый ряд отдельно."
      - text: "45 -55"
        explain: "Справа стоит `max(0, …)`: отрицательная разность превращается в 0."
      - text: "-55 0"
        explain: "Слева прирост считается по рядам, и сброс не даёт отрицательного вклада: 20 + 20 + 5."
      - text: "25 0"
        explain: "Новый ряд `c` тоже считается: до шага его не было, значит, счётчик начался с нуля и вырос до 5."

  - id: cache-step-db
    kind: single
    prompt: "Шаг «2 +кеш»: TTL записи о товаре — 5 минут, кеш прогрет, а «БД кат. в сек» — около 5, не 0. В отчёте шага: попаданий 1502, «нет такого» из кеша 3, промахов 70, ошибок Valkey 0, у `catalog.get` 73 ответа 404. Откуда запросы в базу?"
    options:
      - text: "Почти все — промахи по несуществующим товарам: генератор каждый раз берёт новый id из тысячи, а отрицательный кеш помогает только при повторе того же id."
        correct: true
        explain: "Промахов 70 при 73 ответах 404: товары 1–4 давно в кеше и попадают, а 5% запросов идут к случайным id 100000–100999, которые за 15 секунд почти не повторяются. Отрицательный кеш защищает от повторов (бот долбит один id), но не от потока разных несуществующих ключей."
      - text: "Записи истекают одновременно: TTL без джиттера."
        explain: "Джиттер ±10% в labs есть, и за 15-секундный шаг пятиминутный TTL истекает разве что у единиц записей — промахов было бы около нуля, а не 70."
      - text: "Valkey отвечает дольше 100 мс, и кеш деградирует в базу."
        explain: "Тогда росли бы «ошибки Valkey» (`result=\"error\"`), а их 0."
      - text: "Без singleflight каждый промах по товару 1 идёт в базу отдельно."
        explain: "Singleflight в labs есть; к тому же товары 1–4 в этом шаге вообще не промахиваются — они в кеше."

  - id: replica-share
    kind: single
    prompt: "Шаг «3 +реплика»: «реплика доля» 81%, «не видно без/с ток.» 215/0, «реплика отставала от токена: 215». Что за 19% чтений с основной базы?"
    options:
      - text: "Проверки read-your-writes с токеном: их делают сразу после создания заказа, реплика (отставание 200 мс) ещё не проиграла этот LSN, и чтение ушло на основную."
        correct: true
        explain: "Каждый из 215 заказов проверяется дважды: без токена (на реплику, заказа там ещё нет — 215 «не видно») и с токеном (реплика отстаёт → `primary`, `reason=\"lagging\"`). 912 чтений с реплики против 215 с основной — это и есть 81/19."
      - text: "Реплика падала, и часть чтений деградировала на основную."
        explain: "Тогда в отчёте шага была бы строка «реплика недоступна» (`reason=\"replica_error\"`), а «отставала от токена» считает именно `lagging`."
      - text: "История покупателей шарда 1: у него нет реплики."
        explain: "Шардирование по умолчанию выключено (`docker-compose.shards.yml` не подключён), все покупатели на шарде 0."
      - text: "GetOrder всегда читает с основной."
        explain: "Так и есть, но GetOrder не входит в `orders_history_reads_total` — это метрика ListOrders."

  - id: overload-429
    kind: multiple
    prompt: "Шаг «4 перегрузка»: 1500 заказов в секунду, у части ответ 429. Что верно?"
    options:
      - text: "Ограничитель отвечает gRPC-кодом `RESOURCE_EXHAUSTED` с `RetryInfo`, а grpc-gateway по стандартной таблице превращает его в HTTP 429 и заголовок `Retry-After`."
        correct: true
        explain: "Интерцептор `shed` работает на уровне gRPC; HTTP-код выбирает `runtime.HTTPStatusFromCode`: `ResourceExhausted` → 429, `Unavailable` → 503."
      - text: "Запрос, получивший 429, не выполнялся: склад и база его не видели, повторить его безопасно."
        correct: true
        explain: "Отказ — до обработчика: интерцептор не дал места. Поэтому `RetryInfo` честен — дублей при повторе не будет."
      - text: "Отказ быстрее принятого заказа: он ждёт не дольше таймаута очереди (50 мс в compose), а не дедлайна клиента."
        correct: true
        explain: "Это видно в сводке: «p99 отказов (429)» заметно меньше «p99 принятых (200)». В задержку отказа входит ещё и опоздание по расписанию — генератор мерит от запланированного момента."
      - text: "429 значит, что этот покупатель превысил свою квоту."
        explain: "Лимит в labs общий на CreateOrder, а не на клиента: 429 здесь — «сервис перегружен», так уж отображается `RESOURCE_EXHAUSTED`. Квоты по клиентам (rate limiting) — другой механизм."
      - text: "Клиент склада внутри «Заказов» сам повторяет такие ответы, поэтому до клиента доходит меньше отказов."
        explain: "429 отдают сами «Заказы» своему клиенту, склад здесь ни при чём. Клиент склада повторяет только `UNAVAILABLE`."

  - id: shard-in-id
    kind: output
    prompt: "В labs номер шарда хранится в старших битах номера заказа: `id = shard<<48 | seq`. Что выведет программа?"
    code: |
      package main

      import "fmt"

      const bits = 48

      func main() {
      	id := int64(1)<<bits | 7
      	fmt.Println(id>>bits, id&(1<<bits-1), id)
      }
    options:
      - text: "1 7 281474976710663"
        correct: true
        explain: "2⁴⁸ = 281474976710656, плюс 7. Сдвиг вправо возвращает номер шарда, маска `1<<48 - 1` — номер в последовательности шарда. GetOrder по такому номеру сразу знает, в какую базу идти."
      - text: "0 281474976710663 281474976710663"
        explain: "`id >> 48` отбрасывает младшие 48 бит, и остаётся 1 — номер шарда."
      - text: "1 7 7"
        explain: "Номер заказа целиком — 2⁴⁸ + 7, а не 7: у шарда 0 номера не меняются (1, 2, 3…), у шарда 1 они начинаются с 281474976710657."
