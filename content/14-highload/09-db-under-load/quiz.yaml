questions:
  - id: cursor-by-time-only
    kind: output
    prompt: "Лента отсортирована по времени по убыванию, курсор хранит только время последней строки страницы. Сколько строк увидит клиент, пролистав ленту страницами по 2?"
    code: |
      package main

      import "fmt"

      type row struct{ at, id int }

      func main() {
      	// Уже отсортировано: at по убыванию, при равном at — id по убыванию.
      	feed := []row{{30, 6}, {20, 5}, {20, 4}, {20, 3}, {10, 2}, {10, 1}}
      	seen, cursor := 0, 1<<30
      	for {
      		page := []row{}
      		for _, r := range feed {
      			if r.at < cursor && len(page) < 2 { // WHERE at < $1 LIMIT 2
      				page = append(page, r)
      			}
      		}
      		if len(page) == 0 {
      			break
      		}
      		seen += len(page)
      		cursor = page[len(page)-1].at
      	}
      	fmt.Println(seen)
      }
    options:
      - text: "4"
        correct: true
        explain: "Первая страница — `30/6` и `20/5`, курсор `20`. Условие `at < 20` отбрасывает и `20/4`, и `20/3`: вторая страница — `10/2`, `10/1`, третья пустая. Две строки с тем же временем, что у последней строки страницы, потеряны молча. Курсор должен однозначно задавать позицию — пара `(at, id)`."
      - text: "6"
        explain: "Все шесть строк увидел бы курсор по паре `(at, id)`: условие `(at, id) < (20, 5)` оставляет `20/4` и `20/3`. Здесь же курсор — только время."
      - text: "8"
        explain: "Повторы дал бы курсор с нестрогим сравнением `at <= $1` (и он мог бы зациклиться на ничьих). Со строгим `<` строки не повторяются, а теряются."

  - id: pgx-context-timeout
    kind: single
    prompt: "Пул `pgxpool` с настройками по умолчанию. Запрос `SELECT pg_sleep(5)` выполняется с контекстом, у которого дедлайн 100 мс. Что произойдёт?"
    options:
      - text: "Через ~100 мс вернётся ошибка, для которой `errors.Is(err, context.DeadlineExceeded)`; соединение закрыто, серверу отправлен CancelRequest, следующий запрос откроет новое соединение"
        correct: true
        explain: "По умолчанию `pgx` использует `DeadlineContextWatcherHandler`: дедлайн сокета, разрыв соединения, асинхронный `CancelRequest`. Под массовыми таймаутами это шторм переподключений."
      - text: "Сервер отменит запрос с ошибкой 57014, соединение вернётся в пул"
        explain: "Так ведёт себя `statement_timeout` или `CancelRequestContextWatcherHandler`, включённый явно через `ConnConfig.BuildContextWatcherHandler`. Тогда, кстати, ошибка — `*pgconn.PgError`, а не `DeadlineExceeded`."
      - text: "Запрос доработает 5 секунд: контекст проверяется только при получении соединения из пула"
        explain: "Контекст действует на всё время запроса: `pgx` следит за ним, пока ждёт ответа сервера."

  - id: pgbouncer-transaction
    kind: multiple
    prompt: "Сервис ходит в PostgreSQL через PgBouncer с `pool_mode = transaction` (без `max_prepared_statements`). Что сломается или поведёт себя неожиданно?"
    options:
      - text: "`SET statement_timeout = '1s'` отдельным запросом перед основным"
        correct: true
        explain: "`SET` меняет серверное соединение, а следующий запрос может попасть на другое; настройка же достанется чужому клиенту. Внутри транзакции пишите `SET LOCAL`."
      - text: "`SELECT pg_advisory_lock(42)` и снятие блокировки отдельным запросом позже"
        correct: true
        explain: "Сессионная advisory-блокировка принадлежит серверному соединению, которое после запроса ушло другому клиенту. Используйте `pg_advisory_xact_lock` внутри транзакции."
      - text: "Подготовленные выражения `pgx` в режиме по умолчанию (`QueryExecModeCacheStatement`)"
        correct: true
        explain: "Выражение подготовлено на одном серверном соединении, а выполнить его по имени `pgx` попытается на другом. Варианты — `QueryExecModeExec`/`CacheDescribe` или PgBouncer 1.21+ с `max_prepared_statements`."
      - text: "`SET LOCAL lock_timeout = '2s'` внутри транзакции"
        explain: "Транзакция целиком идёт по одному серверному соединению, и `SET LOCAL` действует до её конца — в режиме transaction это правильный способ."

  - id: little-law
    kind: single
    prompt: "Обработчик делает 3 запроса к базе, каждый держит соединение 4 мс; под пиком приходит 1000 запросов к обработчику в секунду на под. Сколько соединений пула занято в среднем?"
    options:
      - text: "12"
        correct: true
        explain: "Закон Литтла: 3000 запросов к базе в секунду × 0,004 с = 12 соединений в среднем. Пул ставят с запасом на пики (и проверяют бюджет `max_connections` на все поды), а уменьшают эту цифру, сокращая число запросов и время каждого."
      - text: "4"
        explain: "Это для одного запроса на обработчик. Здесь их три, и каждый занимает соединение своё время."
      - text: "1000"
        explain: "Столько обработчиков приходит в секунду, но каждый держит соединения миллисекунды: занятость — частота × время."
