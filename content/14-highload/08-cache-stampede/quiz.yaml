questions:
  - id: not-a-cache
    kind: output
    prompt: "Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"

      	"golang.org/x/sync/singleflight"
      )

      func main() {
      	var g singleflight.Group
      	loads := 0
      	for range 3 {
      		g.Do("apple", func() (any, error) {
      			loads++
      			return "карточка", nil
      		})
      	}
      	fmt.Println(loads)
      }
    options:
      - text: "3"
        correct: true
        explain: "`singleflight` склеивает только одновременные вызовы. Каждый `Do` здесь начинается после того, как предыдущий закончился, и группа уже забыла ключ — функция выполняется снова. Кешировать результат — отдельная работа."
      - text: "1"
        explain: "Группа помнит ключ только пока функция выполняется. После возврата ключ удаляется, и следующий `Do` запускает функцию заново."
      - text: "0"
        explain: "Первый же `Do` с незанятым ключом выполняет функцию в вызывающей горутине."

  - id: dochan-join
    kind: output
    prompt: "Первая загрузка ещё идёт, когда приходит второй вызов. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"

      	"golang.org/x/sync/singleflight"
      )

      func main() {
      	var g singleflight.Group
      	gate := make(chan struct{})
      	loads := 0
      	ch1 := g.DoChan("apple", func() (any, error) {
      		loads++
      		<-gate // база отвечает не сразу
      		return "из базы", nil
      	})
      	ch2 := g.DoChan("apple", func() (any, error) {
      		loads++
      		return "вторая загрузка", nil
      	})
      	close(gate)
      	r1, r2 := <-ch1, <-ch2
      	fmt.Println(r1.Val, r2.Val, r2.Shared, loads)
      }
    options:
      - text: "из базы из базы true 1"
        correct: true
        explain: "Второй `DoChan` пришёл, пока первая функция ждала на `gate`, поэтому своя функция не запустилась: он присоединился и получил тот же результат, `Shared == true`. Загрузка одна."
      - text: "из базы вторая загрузка false 2"
        explain: "Так было бы без `singleflight`. Пока вызов с ключом `apple` в полёте, функции новых вызовов с этим ключом не выполняются."
      - text: "из базы из базы false 1"
        explain: "`Shared` — достался ли результат больше чем одному вызову. Здесь его получили двое."

  - id: forget
    kind: output
    prompt: "Ключ забыли, пока загрузка шла. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"

      	"golang.org/x/sync/singleflight"
      )

      func main() {
      	var g singleflight.Group
      	gate := make(chan struct{})
      	ch1 := g.DoChan("price", func() (any, error) {
      		<-gate
      		return "старая цена", nil
      	})
      	g.Forget("price") // цену только что обновили
      	ch2 := g.DoChan("price", func() (any, error) {
      		return "новая цена", nil
      	})
      	fmt.Println((<-ch2).Val)
      	close(gate)
      	fmt.Println((<-ch1).Val)
      }
    options:
      - text: "новая цена\nстарая цена"
        correct: true
        explain: "После `Forget` следующий вызов не присоединяется к идущей загрузке, а запускает свою — и получает свежий результат сразу. Первая загрузка доходит до конца и отдаёт свой результат тем, кто к ней присоединился до `Forget`."
      - text: "старая цена\nстарая цена"
        explain: "Это было бы без `Forget`: второй вызов присоединился бы к первому. `Forget` для того и нужен — не раздавать заведомо устаревший результат."
      - text: "новая цена\nновая цена"
        explain: "`Forget` не отменяет первую функцию и не меняет её результат: те, кто ждёт её, получат то, что она вернёт."

  - id: leader-context
    kind: single
    prompt: "Загрузка внутри `g.Do` выполняется с `ctx` того запроса, который её начал. Клиент этого запроса закрыл вкладку. Что произойдёт?"
    options:
      - text: "Загрузка оборвётся, и все ждущие запросы получат `context.Canceled`, хотя их клиенты ждут"
        correct: true
        explain: "Функция одна на всех, а контекст у неё — чужой. Загрузку запускают с `context.WithoutCancel(ctx)` и собственным таймаутом, а уйти по своей отмене ждущий может через `DoChan`."
      - text: "Только первый запрос получит ошибку, остальные — значение"
        explain: "Результат `Do` общий: у всех ждущих одна и та же ошибка загрузки."
      - text: "`singleflight` сам перезапустит загрузку для оставшихся"
        explain: "Никаких повторов `singleflight` не делает: ошибка функции раздаётся всем, кто её ждал."

  - id: valkey-lock
    kind: multiple
    prompt: "Блокировка в Valkey, чтобы из десяти подов дорогой отчёт пересчитывал один. Что нужно?"
    options:
      - text: "`SET lock:key <случайный токен> NX PX <мс>`"
        correct: true
        explain: "`NX` — взять, только если никто не держит; `PX` — блокировка сама истечёт, если владелец упал."
      - text: "Снимать блокировку Lua-скриптом: удалить, только если значение — ваш токен"
        correct: true
        explain: "Если загрузка длилась дольше `PX`, блокировку уже мог взять другой — простой `DEL` снимет чужую."
      - text: "Считать блокировку гарантией: пока она взята, второй пересчёт невозможен"
        explain: "Истечение `PX` во время долгой загрузки или паузы GC — и блокировку возьмёт второй. Это оптимизация против толпы, а не взаимное исключение для денег и остатков."
      - text: "`SET lock:key 1` без срока, чтобы блокировка не истекла посреди загрузки"
        explain: "Упадёт владелец — блокировка останется навсегда, и отчёт не пересчитает никто."
