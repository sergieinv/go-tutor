title: Высокие нагрузки и масштабирование
summary: Как измерять и разгонять Go-сервис — нагрузочные тесты и перцентили, профилирование под нагрузкой, лимиты и load shedding, кеши и cache stampede, БД под нагрузкой, реплики и шардирование, а затем данные в памяти, кеш-линии и lock-free.
goals:
  - "Измерять правильно: открытая и закрытая модель нагрузки, перцентили, coordinated omission, профиль под нагрузкой."
  - "Защищать сервис от перегрузки: ограничение параллелизма, очереди, backpressure и отбрасывание лишнего."
  - "Кешировать без сюрпризов: in-process и Valkey, TTL, инвалидация, stampede и singleflight."
  - "Разгружать базу: индексы и планы, пул соединений, реплики с учётом задержки, партиционирование и шардирование."
  - "Раскладывать данные под кеш процессора и GC: размер структур, локальность, структуры без указателей."
  - "Понимать, когда нужен lock-free, писать его на атомиках и проверять стресс-тестами и бенчмарками."
