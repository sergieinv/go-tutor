questions:
  - id: mod-moves
    kind: output
    prompt: "Ключи — числа 0…11, «хеш» — само число. Сколько ключей сменят шард при переходе с 3 на 4 шарда по остатку от деления?"
    code: |
      package main

      import "fmt"

      func main() {
      	moved := 0
      	for k := range 12 {
      		if k%3 != k%4 {
      			moved++
      		}
      	}
      	fmt.Println(moved)
      }
    options:
      - text: "9"
        correct: true
        explain: "Остатки по 3 и по 4 совпадают только у 0, 1 и 2 (на каждые 12 ключей). Остальные 9 из 12 переезжают — 3/4, то есть `N/(N+1)` при `N = 3`."
      - text: "3"
        explain: "3 ключа — это сколько должен получить новый шард (12/4). Остаток от деления двигает гораздо больше: совпадают только 0, 1 и 2."
      - text: "4"
        explain: "Это размер доли одного шарда из четырёх, а не число переездов."
      - text: "0"
        explain: "Номер шарда `k % N` зависит от `N`, поэтому при смене `N` ключи переезжают."

  - id: ring-add
    kind: single
    prompt: "На кольце consistent hashing с виртуальными узлами было N шардов, добавили ещё один. Что происходит с ключами?"
    options:
      - text: "Меняют шард в среднем K/(N+1) ключей, и все они переходят на новый шард"
        correct: true
        explain: "Новые точки забирают дуги перед собой; ключ с такой дуги раньше принадлежал следующей точке, теперь — новому шарду. Остальные ключи не трогаются."
      - text: "Ключи перераспределяются между всеми шардами, чтобы снова стало поровну"
        explain: "Ключи между старыми шардами не перетекают — именно в этом смысл consistent hashing."
      - text: "Ключи переходят к одному соседнему шарду"
        explain: "Наоборот: с виртуальными узлами новый шард забирает по кусочку у многих шардов. К одному соседу всё уходит, когда точка на шард одна."
      - text: "Переезжает около N/(N+1) ключей"
        explain: "Так ведёт себя `hash % N`. Кольцо двигает только долю нового шарда."

  - id: scatter-limit
    kind: single
    prompt: "Запрос «20 самых новых заказов» по 4 шардам. Сколько заказов нужно запросить у каждого шарда, чтобы ответ был верным?"
    options:
      - text: "По 20 с каждого: все 20 самых новых могут оказаться на одном шарде"
        correct: true
        explain: "После слияния отбрасывается лишнее. Меньший лимит на шард даёт неверный ответ, если данные распределены неравномерно — а по времени они почти всегда неравномерны."
      - text: "По 5 — 20 делится на 4 шарда поровну"
        explain: "Это работало бы, только если самые новые заказы разложены по шардам ровно поровну. Шард, на котором 20 самых новых, отдаст лишь 5."
      - text: "По 6 — с запасом в 20%"
        explain: "Запас не спасает от перекоса: гарантия есть только при полном `limit` с каждого шарда."
      - text: "Все заказы шарда, а сортировать в приложении"
        explain: "Ответ будет верным, но на больших таблицах это перекачка всей базы ради 20 строк. Достаточно `ORDER BY created_at DESC LIMIT 20` на каждом шарде."

  - id: stable-hash
    kind: multiple
    prompt: "Какие хеши годятся, чтобы выбирать шард по покупателю в нескольких экземплярах сервиса?"
    options:
      - text: "`crc32.ChecksumIEEE([]byte(key))`"
        correct: true
        explain: "CRC-32 определён стандартом и одинаков везде. Для кольца его биты стоит перемешать финализатором, но для выбора шарда он стабилен."
      - text: "FNV-1a из `hash/fnv` с финализатором `fmix64`"
        correct: true
        explain: "Стабильный алгоритм без сида, финализатор даёт хороший лавинный эффект — как в примере урока."
      - text: "`maphash.String(maphash.MakeSeed(), key)`"
        explain: "`MakeSeed` возвращает случайный сид: в другом процессе тот же ключ получит другой хеш и уйдёт в другой шард."
      - text: "Первые 8 байт `sha256.Sum256([]byte(key))`"
        correct: true
        explain: "Медленнее некриптографических хешей, но стабилен и отлично перемешан — годится."
      - text: "`string.GetHashCode()` в сервисе на .NET, который пишет в те же шарды"
        explain: "В .NET Core хеш строки рандомизирован на каждый процесс — та же ловушка, что с `maphash`."
