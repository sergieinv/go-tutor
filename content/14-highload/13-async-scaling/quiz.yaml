questions:
  - id: set-vs-add
    kind: output
    prompt: "Событие «заказ оплачен» доставлено дважды. Два обработчика: один ставит статус, другой прибавляет оплаченную сумму к выручке. Что выведет программа?"
    code: |
      package main

      import "fmt"

      type paid struct {
      	order  string
      	amount int
      }

      func main() {
      	status := map[string]string{}
      	revenue := 0
      	deliveries := []paid{{"o1", 100}, {"o2", 50}, {"o1", 100}} // o1 — повтор
      	for _, e := range deliveries {
      		status[e.order] = "paid"
      		revenue += e.amount
      	}
      	fmt.Println(len(status), revenue)
      }
    options:
      - text: "2 250"
        correct: true
        explain: "Установка статуса идемпотентна — повтор ничего не меняет, заказов со статусом два. Прибавление — нет: выручка 250 вместо 150. Такие операции защищают ключом идемпотентности (таблица обработанных в той же транзакции) или номером версии."
      - text: "2 150"
        explain: "`revenue += e.amount` выполнился трижды, в том числе для повтора `o1`."
      - text: "3 250"
        explain: "Ключ map — заказ: повторная запись `status[\"o1\"]` перезаписывает то же значение, заказов два."

  - id: at-least-once-source
    kind: multiple
    prompt: "Откуда в группе потребителей Kafka берутся повторные доставки одного сообщения?"
    options:
      - text: "Потребитель обработал сообщение и упал, не закоммитив offset"
        correct: true
        explain: "После перезапуска (или другому члену группы после перебалансировки) сообщения от последнего закоммиченного offset приходят снова."
      - text: "Перебалансировка группы: партиция переехала к другому экземпляру раньше, чем первый закоммитил обработанное"
        correct: true
        explain: "Новый владелец начинает с закоммиченного offset — и повторяет то, что старый уже сделал. Поэтому дедупликация в памяти экземпляра не спасает."
      - text: "Производитель не дождался подтверждения брокера и отправил сообщение ещё раз"
        correct: true
        explain: "Повтор отправки создаёт вторую запись в топике. Идемпотентный продюсер (`enable.idempotence`) отсекает только ретраи самого клиента внутри его сессии (идентификатор продюсера + номер последовательности); повторный вызов отправки из кода приложения брокер не распознает."
      - text: "Два экземпляра одной группы читают одну партицию одновременно"
        explain: "В группе каждую партицию в каждый момент читает ровно один член — так Kafka и сохраняет порядок внутри партиции."

  - id: sticky
    kind: single
    prompt: "Сервис хранит корзины в памяти пода, а балансировщик настроен на sticky-сессии. Что сломается первым при автомасштабировании?"
    options:
      - text: "Уменьшение числа подов: удалённый под забирает с собой корзины своих пользователей"
        correct: true
        explain: "Sticky-сессии привязывают состояние к поду: scale-in, перезапуск, деплой — и состояние пропадает. Плюс нагрузка ложится неровно: «тяжёлые» пользователи сидят на одних подах. Состояние, которое переживает запрос, хранят в базе или Valkey."
      - text: "Ничего: sticky-сессии и есть способ масштабировать stateful-сервис"
        explain: "Они маскируют состояние в памяти, пока поды не начнут появляться и исчезать — а автомасштабирование именно это и делает."
      - text: "Увеличение числа подов: новые поды не получат трафика вовсе"
        explain: "Новые клиенты на новые поды придут; ломается удаление подов и равномерность нагрузки."

  - id: cqrs-when
    kind: single
    prompt: "Когда отдельная модель чтения (CQRS) скорее оправдана?"
    options:
      - text: "Экран «сводка покупателя» собирает данные из пяти таблиц агрегатами, а читают его в сто раз чаще, чем пишут"
        correct: true
        explain: "Денормализованная проекция под экран снимает тяжёлые `JOIN` и `GROUP BY` с горячего пути. Цена — eventual consistency и умение перестраивать проекцию."
      - text: "CRUD-админка справочника товаров, где чтение и запись — одни и те же поля"
        explain: "Модель чтения совпадает с моделью записи: вторая система только добавит задержку согласования и точки отказа."
      - text: "Любой сервис, где больше одного экземпляра"
        explain: "Горизонтальное масштабирование требует stateless-сервисов, а не CQRS."
