questions:
  - id: padded-size
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"sync/atomic"
      	"unsafe"
      )

      type stats struct {
      	hits   atomic.Int64
      	_      [56]byte
      	misses atomic.Int64
      }

      func main() {
      	var s stats
      	fmt.Println(unsafe.Sizeof(s), unsafe.Offsetof(s.misses))
      }
    options:
      - text: "72 64"
        correct: true
        explain: "`hits` — 8 байт, заполнитель — 56, итого `misses` начинается со смещения 64 и занимает ещё 8. Хвоста после `misses` нет, поэтому размер 72."
      - text: "128 64"
        explain: "Компилятор не добивает структуру до размера линии: выравнивание `atomic.Int64` — 8 байт, а 72 делится на 8."
      - text: "16 8"
        explain: "Безымянное поле `_` занимает место, как обычное: его нельзя прочитать, но размер в нём учитывается."
      - text: "72 8"
        explain: "Смещение считается с начала структуры: перед `misses` лежат 8 байт `hits` и 56 байт заполнителя."

  - id: correct-but-slow
    kind: output
    prompt: "Четыре горутины увеличивают каждая свой элемент массива `[4]atomic.Int64`, все элементы лежат в одной кеш-линии. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"sync"
      	"sync/atomic"
      )

      func main() {
      	var counters [4]atomic.Int64
      	var wg sync.WaitGroup
      	for g := range 4 {
      		wg.Go(func() {
      			for range 1000 {
      				counters[g].Add(1)
      			}
      		})
      	}
      	wg.Wait()
      	var sum int64
      	for i := range counters {
      		sum += counters[i].Load()
      	}
      	fmt.Println(sum)
      }
    options:
      - text: "4000"
        correct: true
        explain: "False sharing — проблема скорости, а не корректности. Протокол когерентности гарантирует, что каждая запись дойдёт; линия просто ездит между ядрами, и каждая операция дороже."
      - text: "Меньше 4000: часть инкрементов потеряется"
        explain: "Атомарные операции не теряются, даже если переменные делят линию: когерентность кешей поддерживает процессор."
      - text: "Детектор гонок сообщит о гонке"
        explain: "Каждая горутина пишет в свой элемент атомарно — гонки данных нет. Детектор не видит кеш-линий."

  - id: what-helps
    kind: multiple
    prompt: "Восемь воркеров считают обработанные сообщения, профиль показывает, что горячая точка — `stats[workerID].Add(1)` по срезу `[]atomic.Int64`. Что поможет?"
    options:
      - text: "Копить счёт в локальной переменной воркера и прибавлять к общему счётчику пачкой, например раз в 1000 сообщений"
        correct: true
        explain: "Лучшее лекарство — не писать в общую память на каждом шаге. Локальная переменная живёт в регистре или на стеке горутины."
      - text: "Сделать элемент среза структурой с заполнителем до 128 байт"
        correct: true
        explain: "Тогда счётчики соседних воркеров не делят линию, и каждый пишет в свою копию."
      - text: "Заменить срез одним общим `atomic.Int64`"
        explain: "Это хуже: теперь все пишут в одну переменную — настоящее разделение (true sharing), линия ездит так же."
      - text: "Защитить срез `sync.RWMutex` и увеличивать под `RLock`"
        explain: "Атомарному `Add` блокировка не нужна вовсе, а `RLock` и `RUnlock` сами пишут в общий `readerCount` — к горячей линии добавится ещё одна, общая для всех воркеров."

  - id: rwmutex-readers
    kind: single
    prompt: "Почему `RWMutex` плохо масштабирует короткие чтения на многих ядрах, хотя читатели не ждут друг друга?"
    options:
      - text: "`RLock` и `RUnlock` атомарно изменяют общий счётчик читателей — каждое чтение пишет в одну и ту же кеш-линию"
        correct: true
        explain: "В `sync/rwmutex.go` `RLock` — это `readerCount.Add(1)`, `RUnlock` — `Add(-1)`. Пока секция короткая, стоимость определяется переездами этой линии."
      - text: "Читатели выстраиваются в очередь, как у `Mutex`"
        explain: "Нет, читатели входят одновременно; блокирует их только ожидающий писатель."
      - text: "`RWMutex` выключает асинхронное вытеснение горутин"
        explain: "К вытеснению блокировка не имеет отношения."
      - text: "На каждом `RLock` планировщик переключает горутину"
        explain: "Быстрый путь `RLock` — одна атомарная операция без участия планировщика."

  - id: pad-64
    kind: single
    prompt: "Слот счётчика — `struct { n atomic.Int64; _ [56]byte }`, срез таких слотов, по слоту на ядро. На каком процессоре соседние слоты всё ещё могут делить кеш-линию?"
    options:
      - text: "На Apple M (линия 128 байт)"
        correct: true
        explain: "Шаг слотов — 64 байта, а линия вдвое больше: в неё попадают два слота. Поэтому рантайм Go для arm64 и `sync.Pool` выравнивают до 128."
      - text: "На x86-64 с линией 64 байта"
        explain: "Шаг 64 байта равен линии: два счётчика на расстоянии 64 байт в одну 64-байтную линию не попадут (хотя предвыборка парной линии на x86 тоже может мешать — поэтому часто берут 128)."
      - text: "Ни на каком: компилятор выравнивает структуры по линии"
        explain: "Компилятор выравнивает по требованию полей (8 байт для `atomic.Int64`), про кеш-линии он не знает."
