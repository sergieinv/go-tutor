questions:
  - id: lsn-string-compare
    kind: output
    prompt: "Роутер сравнивает LSN реплики с токеном клиента. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"strconv"
      	"strings"
      )

      func parse(s string) uint64 {
      	hi, lo, _ := strings.Cut(s, "/")
      	h, _ := strconv.ParseUint(hi, 16, 32)
      	l, _ := strconv.ParseUint(lo, 16, 32)
      	return h<<32 | l
      }

      func main() {
      	replay, token := "0/9F", "0/1A0"
      	fmt.Println(replay >= token, parse(replay) >= parse(token))
      }
    options:
      - text: "true false"
        correct: true
        explain: "Строки сравниваются посимвольно: `'9' > '1'`, и строковое сравнение считает реплику догнавшей. Числом 0x9F = 159 меньше 0x1A0 = 416 — реплика отстаёт, и чтение с неё не увидит запись клиента."
      - text: "false false"
        explain: "Числовое сравнение даёт `false`, но строковое — `true`: `\"0/9F\" >= \"0/1A0\"`, потому что третий символ `'9'` больше `'1'`."
      - text: "true true"
        explain: "0x9F меньше 0x1A0, поэтому числовое сравнение — `false`. Совпасть они могут случайно, когда у обоих LSN одинаковое число цифр."

  - id: token-timing
    kind: single
    prompt: "Когда брать LSN-токен для read-your-writes?"
    options:
      - text: "Отдельным запросом `SELECT pg_current_wal_lsn()` после успешного `COMMIT`"
        correct: true
        explain: "Позиция записи WAL после коммита не меньше позиции записи о коммите — реплика, проигравшая WAL до неё, видит транзакцию."
      - text: "`RETURNING pg_current_wal_lsn()` в том же `INSERT` — это экономит запрос"
        explain: "Внутри транзакции позиция ещё до записи о коммите. Реплика может проиграть WAL до токена и остановиться перед `COMMIT` — строка не видна, хотя `replay_lsn >= token`."
      - text: "`pg_last_wal_replay_lsn()` на реплике перед записью"
        explain: "Это позиция реплики, а не основного, и она ничего не говорит о будущей записи. Токен — позиция основного после коммита."

  - id: sync-levels
    kind: single
    prompt: "Какой `synchronous_commit` (при настроенной синхронной реплике) гарантирует, что после `COMMIT` на основном запись сразу видна в запросах к этой реплике?"
    options:
      - text: "`remote_apply`"
        correct: true
        explain: "Коммит ждёт, пока реплика проиграет WAL, — и транзакция видна на ней. Цена — задержка каждого коммита и зависимость основного от реплики."
      - text: "`on`"
        explain: "С синхронной репликой `on` ждёт, пока реплика запишет WAL на диск (`flush`), но не проиграет: прочитать с неё запись можно чуть позже."
      - text: "`remote_write`"
        explain: "Ждёт только, что реплика получила WAL и отдала его ОС; ни записи на диск, ни проигрывания."
      - text: "`local`"
        explain: "Ждёт только локальной записи на основном, реплику не ждёт вовсе."

  - id: monotonic
    kind: single
    prompt: "Пользователь обновил страницу истории дважды: в первый раз заказ был, во второй пропал, в третий снова появился. Записей между обновлениями не было. Что происходит?"
    options:
      - text: "Запросы попадали на разные реплики с разной задержкой — нарушены монотонные чтения"
        correct: true
        explain: "Свежая реплика показала заказ, отстающая — нет. Лечат токеном с наибольшим виденным LSN или привязкой пользователя к одной реплике."
      - text: "Заказ откатился на основном и закоммитился снова"
        explain: "Записей не было — дело в том, откуда читали."
      - text: "Кеш подготовленных выражений pgx вернул старый результат"
        explain: "Кеш выражений хранит план и описание запроса, а не строки результата."
