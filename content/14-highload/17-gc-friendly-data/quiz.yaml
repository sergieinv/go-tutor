questions:
  - id: noscan
    kind: single
    prompt: "В процессе живут два среза по миллиону элементов: `[]int64` и `[]*int64`. Что делает с ними сборщик мусора на каждом цикле?"
    options:
      - text: "Массив `[]int64` помечает живым и не читает; массив `[]*int64` просматривает целиком и проходит по миллиону указателей"
        correct: true
        explain: "Объекты без указателей аллокатор кладёт в noscan-спаны, и маркировка отправляет их сразу в чёрные (`greyobject` в `runtime/mgcmark.go`). Массив указателей — 8 МБ, которые надо прочитать, и миллион объектов, которые надо пометить."
      - text: "Оба просматривает одинаково — GC не знает, что внутри"
        explain: "Знает: у каждого типа есть сведения об указателях (`PtrBytes`, битовая карта), и объекты без указателей вообще не сканируются."
      - text: "Ни один не трогает — GC Go поколенческий, старые данные он не сканирует"
        explain: "В Go GC без поколений: каждый цикл заново размечает всю живую кучу с указателями."
      - text: "Копирует `[]int64` в новое место, чтобы уплотнить кучу"
        explain: "GC Go не перемещает объекты — ни компактификации, ни копирования."

  - id: map-delete
    kind: single
    prompt: "Из map на миллион записей удалили 990 000. Что с памятью?"
    options:
      - text: "Таблицы map остаются прежнего размера: удалённые слоты становятся пустыми или «надгробиями», память не возвращается"
        correct: true
        explain: "Swiss table в Go не уменьшается при удалении (в `internal/runtime/maps` даже стоит TODO про сжатие каталога). Чтобы вернуть память, переложите живые записи в новую map и отпустите старую."
      - text: "Map сжимается в 100 раз, как только записей становится мало"
        explain: "Автоматического сжатия нет — ни при `delete`, ни при `clear`."
      - text: "Память вернётся при следующей сборке мусора"
        explain: "GC освобождает недостижимые объекты. Сама map достижима, и её таблицы — тоже."
      - text: "Map преобразуется в срез"
        explain: "Представление map не меняется."

  - id: unique-handle
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"strings"
      	"unique"
      )

      func main() {
      	a := unique.Make(strings.Repeat("go", 2))
      	b := unique.Make("go" + strings.ToLower("GO"))
      	c := unique.Make("Gogo")
      	fmt.Println(a == b, a == c, b.Value())
      }
    options:
      - text: "true false gogo"
        correct: true
        explain: "`Make` возвращает один и тот же `Handle` для равных значений, как бы они ни были получены. Сравнение `Handle` — сравнение указателей на каноническую копию."
      - text: "false false gogo"
        explain: "Строки собраны по-разному, но равны — `unique.Make` даёт для них равные `Handle`."
      - text: "true true gogo"
        explain: "`\"Gogo\"` и `\"gogo\"` — разные строки, и `Handle` у них разные."
      - text: "Программа не скомпилируется: Handle нельзя сравнивать"
        explain: "`Handle[T]` сравним, ради этого он и нужен."

  - id: bloom
    kind: multiple
    prompt: "Что верно про фильтр Блума?"
    options:
      - text: "Если `MayContain` вернул false, ключ точно не добавляли"
        correct: true
        explain: "Каждый добавленный ключ выставил все свои k бит, и сбросить их нечему — ложных отказов нет."
      - text: "Если `MayContain` вернул true, ключ точно добавляли"
        explain: "Все k бит могли выставить другие ключи — это ложное срабатывание с вероятностью около p."
      - text: "Обычный фильтр Блума не умеет удалять ключи"
        correct: true
        explain: "Сброс бита испортил бы другие ключи, которые на него указывают. Удаление умеют варианты со счётчиками (counting Bloom) или cuckoo filter."
      - text: "Фильтр хранит сами ключи, поэтому его размер растёт с их длиной"
        explain: "Хранятся только биты: около 9,6 бита на ключ при p = 1%, независимо от длины ключа."
      - text: "Битовый массив фильтра в `[]uint64` не добавляет работы сборщику мусора"
        correct: true
        explain: "В массиве нет указателей — это один noscan-объект, сколько бы мегабайт он ни занимал."
