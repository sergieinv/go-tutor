questions:
  - id: lru-order
    kind: output
    prompt: "LRU на `container/list`, ёмкость 2. Что выведет программа?"
    code: |
      package main

      import (
      	"container/list"
      	"fmt"
      )

      func main() {
      	ll := list.New() // от свежих к старым
      	m := map[string]*list.Element{}
      	set := func(k string) {
      		m[k] = ll.PushFront(k)
      		if ll.Len() > 2 {
      			old := ll.Remove(ll.Back()).(string)
      			delete(m, old)
      		}
      	}
      	get := func(k string) {
      		if el, ok := m[k]; ok {
      			ll.MoveToFront(el)
      		}
      	}
      	set("a")
      	set("b")
      	get("a")
      	set("c")
      	for el := ll.Front(); el != nil; el = el.Next() {
      		fmt.Print(el.Value, " ")
      	}
      	fmt.Println()
      }
    options:
      - text: "c a "
        correct: true
        explain: "После `get(\"a\")` порядок — a, b: b самый давно использованный. `set(\"c\")` кладёт c в начало, длина 3 > 2, хвост b удаляется. Остаётся c, a."
      - text: "c b "
        explain: "Так было бы без `MoveToFront` в `get` — это FIFO, а не LRU. Чтение a сделало его свежим."
      - text: "a c "
        explain: "Новая запись всегда кладётся в начало (`PushFront`), поэтому c — первым."

  - id: copy-shares-slice
    kind: output
    prompt: "Кеш хранит значения, а не указатели. Что выведет программа?"
    code: |
      package main

      import "fmt"

      type Product struct {
      	Price int
      	Tags  []string
      }

      func main() {
      	cache := map[string]Product{"apple": {Price: 100, Tags: []string{"fruit"}}}
      	p := cache["apple"] // копия структуры
      	p.Price = 90
      	p.Tags[0] = "sale"
      	fmt.Println(cache["apple"].Price, cache["apple"].Tags[0])
      }
    options:
      - text: "100 sale"
        correct: true
        explain: "Структура скопировалась, поэтому `Price` в кеше не изменился. Но копия среза — это копия заголовка: оба указывают на один массив, и `Tags[0]` поменялся и в кеше. Значения в кеше защищают только плоские поля — срезы и map внутри надо копировать или не менять."
      - text: "100 fruit"
        explain: "Копирование структуры не копирует массив под срезом: `p.Tags` и `cache[\"apple\"].Tags` — один и тот же массив."
      - text: "90 sale"
        explain: "`p` — копия структуры из map; запись в `p.Price` не меняет значение в map."

  - id: rwmutex-lru
    kind: single
    prompt: "Почему LRU-кеш не ускорить, заменив `sync.Mutex` на `sync.RWMutex` и взяв в `Get` только `RLock`?"
    options:
      - text: "`Get` переносит запись в начало списка — это запись, и под `RLock` она стала бы гонкой"
        correct: true
        explain: "В LRU чтение меняет порядок: `MoveToFront` переставляет указатели списка. Несколько читателей под `RLock` сделали бы это одновременно и испортили список. Поэтому LRU либо под полным мьютексом (и шардируется), либо использует приближённые политики, где чтение пишет в буфер."
      - text: "`RWMutex` медленнее `Mutex` при любом соотношении чтений и записей"
        explain: "При редких записях и действительно только читающих читателях `RWMutex` бывает выгоднее. Дело не в скорости, а в том, что LRU-чтение — не чтение."
      - text: "`container/list` нельзя использовать с `RWMutex`"
        explain: "Ограничения такого нет; проблема в том, что `Get` меняет список."

  - id: what-to-cache
    kind: multiple
    prompt: "Что разумно держать в кеше в памяти процесса с TTL в минуту?"
    options:
      - text: "Карточки товаров для витрины"
        correct: true
        explain: "Читаются постоянно, меняются редко, минута устаревания для витрины допустима."
      - text: "Конфигурацию и справочники (страны, валюты)"
        correct: true
        explain: "Почти не меняются и нужны каждому запросу — идеальный кандидат."
      - text: "Остаток товара, по которому резервируют заказ"
        explain: "Решение о резерве должно приниматься по базе (атомарный `UPDATE … WHERE qty >= $1`). По устаревшему остатку продадут то, чего уже нет. Показывать остаток на витрине из кеша — можно, решать по нему — нет."
      - text: "Результаты поиска по произвольной строке пользователя без предела размера"
        explain: "Ключей неограниченно много, повторов мало: память растёт, попаданий почти нет. Нужен хотя бы предел (LRU) — а лучше кешировать нормализованные популярные запросы."

  - id: gc-pointers
    kind: single
    prompt: "Сервис держит в памяти кеш на 5 млн записей `map[string]*Product`. После его появления выросла доля CPU у GC, хотя кеш почти не меняется. Почему?"
    options:
      - text: "Каждый цикл GC размечает всю живую кучу с указателями — миллионы ключей, указателей и строк внутри записей"
        correct: true
        explain: "У GC Go нет поколений: «старый» кеш не пропускается, его указатели обходятся на каждом цикле. Помогают значения без указателей (ключи-числа, плоские структуры) или сериализованные записи в больших `[]byte` — такие объекты GC не сканирует."
      - text: "GC перемещает записи кеша при каждом цикле, чтобы уплотнить кучу"
        explain: "GC Go не перемещает объекты (нет компактификации). Стоимость — в разметке, а не в копировании."
      - text: "map сама вызывает `runtime.GC()` при росте"
        explain: "map не запускает сборку. Сборку запускает рост кучи до цели по GOGC, а стоимость каждого цикла растёт с числом указателей в живой куче."
