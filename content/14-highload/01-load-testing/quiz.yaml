questions:
  - id: mean-vs-tail
    kind: output
    prompt: "Что выведет программа? (Перцентиль — методом ближайшего ранга, как в примере.)"
    code: |
      package main

      import (
      	"fmt"
      	"math"
      	"slices"
      )

      func percentile(sorted []float64, p float64) float64 {
      	k := int(math.Ceil(p / 100 * float64(len(sorted))))
      	return sorted[max(k, 1)-1]
      }

      func main() {
      	ms := []float64{5, 1, 3, 2, 4, 100, 6, 7, 8, 9}
      	slices.Sort(ms)
      	var sum float64
      	for _, v := range ms {
      		sum += v
      	}
      	fmt.Println(sum/float64(len(ms)), percentile(ms, 50), percentile(ms, 90), percentile(ms, 99))
      }
    options:
      - text: "14.5 5 9 100"
        correct: true
        explain: "Один медленный запрос тянет среднее до 14.5 — почти в три раза выше медианы (5). p90 — девятое значение из десяти (9), а p99 — ранг ⌈9.9⌉ = 10, то есть сам выброс. На десяти замерах p99 и максимум совпадают: для хвоста нужны тысячи замеров."
      - text: "14.5 5.5 9.1 99.1"
        explain: "Так считали бы перцентили с линейной интерполяцией между соседними значениями. Метод ближайшего ранга всегда возвращает одно из измеренных значений."
      - text: "5.5 5 9 100"
        explain: "Это медиана с интерполяцией, а не среднее. Среднее — сумма 145, делённая на 10."

  - id: closed-overload
    kind: single
    prompt: "Сервер начал отвечать в 10 раз медленнее. Что покажет нагрузочный тест в закрытой модели (100 виртуальных пользователей без пауз)?"
    options:
      - text: "Частота запросов упадёт примерно в 10 раз, а задержки вырастут меньше, чем выросли бы при реальном потоке пользователей"
        correct: true
        explain: "В закрытой модели в полёте не больше 100 запросов: пока сервер медлит, пользователи генератора ждут и ничего не шлют. Очередь не растёт, перегрузка «самоустраняется». Настоящие пользователи продолжали бы приходить, и очередь росла бы."
      - text: "Частота запросов не изменится, а задержки вырастут в 10 раз"
        explain: "Неизменную частоту держит открытая модель. Закрытая шлёт следующий запрос только после ответа."
      - text: "Генератор начнёт получать ошибки соединения"
        explain: "Число соединений в закрытой модели ограничено числом пользователей; само замедление сервера ошибок не вызывает."

  - id: co-correction
    kind: output
    prompt: "Что выведет программа? (Поправка на coordinated omission, как в HdrHistogram.)"
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func corrected(d, expected time.Duration) []time.Duration {
      	out := []time.Duration{d}
      	for m := d - expected; m >= expected; m -= expected {
      		out = append(out, m)
      	}
      	return out
      }

      func main() {
      	fmt.Println(corrected(35*time.Millisecond, 10*time.Millisecond))
      	fmt.Println(corrected(8*time.Millisecond, 10*time.Millisecond))
      }
    options:
      - text: "[35ms 25ms 15ms]\n[8ms]"
        correct: true
        explain: "Генератор хотел слать запрос каждые 10 мс, а ответ шёл 35 мс: запросы, которые должны были уйти через 10, 20 и 30 мс, ждали бы 25, 15 и 5 мс. Последний меньше интервала — его HdrHistogram не добавляет. Быстрый ответ (8 мс) ничего не задержал."
      - text: "[35ms 25ms 15ms 5ms]\n[8ms]"
        explain: "Цикл идёт, пока `m >= expected`: 5 мс меньше 10, такой замер не добавляется."
      - text: "[35ms]\n[8ms]"
        explain: "Это запись без поправки — ровно то, что делает закрытый генератор с coordinated omission."

  - id: open-tools
    kind: multiple
    prompt: "Какие генераторы по умолчанию работают в открытой модели (держат заданную частоту независимо от скорости ответов)?"
    options:
      - text: "`vegeta attack -rate=500/s`"
        correct: true
        explain: "Vegeta отправляет запросы по расписанию с заданной частотой — открытая модель."
      - text: "k6 с исполнителем `constant-arrival-rate`"
        correct: true
        explain: "Arrival-rate исполнители k6 запускают итерации с заданной частотой и при нехватке виртуальных пользователей сообщают об этом, а не замедляются молча."
      - text: "`wrk -c 100`"
        explain: "wrk держит 100 соединений, и каждое шлёт следующий запрос после ответа — закрытая модель. Постоянную частоту добавил форк `wrk2`."
      - text: "`hey -c 50 -q 10`"
        explain: "`-q` ограничивает частоту каждого из 50 воркеров сверху, но воркер всё равно ждёт ответа перед следующим запросом — модель закрытая."

  - id: merge-p99
    kind: single
    prompt: "Как получить p99 сервиса, работающего на трёх узлах?"
    options:
      - text: "Сложить гистограммы узлов (одинаковые бакеты) и посчитать перцентиль по сумме"
        correct: true
        explain: "Счётчики бакетов складываются, а перцентили — нет. Так работает `histogram_quantile(0.99, sum by (le) (rate(..._bucket[5m])))` в Prometheus."
      - text: "Взять среднее p99 трёх узлов"
        explain: "Если узел с половиной трафика медленный, среднее p99 ничего не говорит о том, сколько пользователей ждёт дольше. Перцентили не усредняются."
      - text: "Взять максимум из p99 узлов"
        explain: "Это оценка сверху, а не p99: узел с одним запросом в минуту может задать «p99 сервиса» в одиночку."
