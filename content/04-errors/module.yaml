title: Ошибки
summary: Ошибка — обычное значение, а не исключение; обёртки, errors.Is/As, defer вместо finally и panic только для багов.
goals:
  - Возвращать и проверять ошибки как значения, добавляя контекст и не теряя исходную причину.
  - Различать sentinel-ошибки и свои типы ошибок, проверять их через errors.Is и errors.As.
  - Освобождать ресурсы через defer и превращать панику в ошибку на границе компонента.
