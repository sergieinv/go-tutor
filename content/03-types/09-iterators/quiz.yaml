questions:
  - id: lazy-filter
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"iter"
      )

      func Nums() iter.Seq[int] {
      	return func(yield func(int) bool) {
      		for i := 1; i <= 5; i++ {
      			fmt.Print("gen", i, " ")
      			if !yield(i) {
      				return
      			}
      		}
      	}
      }

      func main() {
      	for n := range Nums() {
      		if n%2 == 0 {
      			fmt.Println("found", n)
      			break
      		}
      	}
      }
    options:
      - text: gen1 gen2 found 2
        correct: true
        explain: "Итератор отдаёт элементы по одному прямо в тело цикла. После `break` вызов `yield(2)` возвращает `false`, и итератор выходит — `gen3` не печатается."
      - text: gen1 gen2 gen3 gen4 gen5 found 2
        explain: Так было бы, если бы итератор сначала собирал всё в срез. `range` по функции ленивый.
      - text: found 2
        explain: "Тело итератора выполняется по мере обхода, и его `fmt.Print` срабатывает перед каждым `yield`."

  - id: ignore-yield
    kind: single
    prompt: Итератор вызывает `yield(i)` в цикле, не проверяя результат. Что произойдёт, если потребитель сделает `break` на первом элементе?
    options:
      - text: Паника во время выполнения при следующем вызове `yield`
        correct: true
        explain: "Рантайм следит за этим: `range function continued iteration after function for loop body returned false`."
      - text: Итератор досчитает до конца, но тело цикла больше не будет вызываться
        explain: Go не прячет ошибку — повторный вызов `yield` после `false` считается нарушением протокола и паникует.
      - text: Ошибка компиляции
        explain: Компилятор не анализирует, проверяет ли итератор результат `yield`. Ошибка проявится только во время выполнения.

  - id: sorted-keys
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"maps"
      	"slices"
      )

      func main() {
      	m := map[string]int{"b": 2, "c": 3, "a": 1}
      	keys := slices.Sorted(maps.Keys(m))
      	vals := slices.Collect(maps.Values(m))
      	slices.Sort(vals)
      	fmt.Println(keys, vals, len(slices.Collect(slices.Values(keys))))
      }
    options:
      - text: "[a b c] [1 2 3] 3"
        correct: true
        explain: "`maps.Keys` и `maps.Values` — итераторы со случайным порядком; `slices.Sorted` и `slices.Sort` делают вывод детерминированным. `slices.Values` обходит срез, `slices.Collect` собирает обратно."
      - text: "[b c a] [2 3 1] 3"
        explain: "Порядок литерала map не сохраняется, а `slices.Sorted` в любом случае сортирует."
      - text: Не скомпилируется
        explain: "`maps.Keys` возвращает `iter.Seq[string]`, а не срез, — и `slices.Sorted` принимает именно итератор."

  - id: seq-one-value
    kind: compile
    prompt: Скомпилируется ли программа?
    code: |
      package main

      import (
      	"fmt"
      	"slices"
      )

      func main() {
      	for i, v := range slices.Values([]string{"a", "b"}) {
      		fmt.Println(i, v)
      	}
      }
    compiles: false
    explain: "`slices.Values` возвращает `iter.Seq[string]` — итератор с одним значением, индекса в нём нет: `range over slices.Values(...) permits only one iteration variable`. Для пар индекс-значение есть `slices.All`, он возвращает `iter.Seq2[int, string]`."

  - id: pull-model
    kind: single
    prompt: Чем итератор Go (`iter.Seq`) отличается от `IEnumerable<T>` с `yield return`?
    options:
      - text: Итератор Go сам вызывает тело цикла через `yield` (push), а `IEnumerable` отдаёт элементы по запросу `MoveNext` (pull)
        correct: true
        explain: "Поэтому итератору Go не нужен конечный автомат — это обычная функция. Pull-модель доступна через `iter.Pull`."
      - text: Итератор Go всегда сначала собирает все элементы в срез
        explain: Итераторы ленивые — элементы появляются по мере вызовов `yield`.
      - text: Ничем, `yield` в Go — то же ключевое слово, что и в C#
        explain: "В Go `yield` — просто имя параметра-функции. Его можно назвать как угодно."
