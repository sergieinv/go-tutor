title: Типы и абстракции
summary: Структуры, методы, неявные интерфейсы, перечисления на iota, встраивание, generics и итераторы — как Go обходится без классов и наследования.
goals:
  - Проектировать типы на структурах и методах, осознанно выбирая value или pointer receiver.
  - Пользоваться неявными интерфейсами и композицией вместо наследования и понимать, как устроено интерфейсное значение.
  - Писать обобщённый код на generics и итераторах там, где он проще интерфейсов.
