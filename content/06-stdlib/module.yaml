title: Стандартная библиотека
summary: Сортировка, форматирование, шаблоны, regexp, JSON и XML, время, разбор чисел и URL, хеши, файлы, флаги, slog, процессы и сигналы — то, за чем в .NET идут в NuGet или BCL.
goals:
  - Решать повседневные задачи стандартной библиотекой Go без сторонних пакетов — от сортировки и regexp до JSON, времени и хешей.
  - Описывать сериализацию struct tags вместо атрибутов и понимать правила encoding/json и encoding/xml.
  - Писать утилиты командной строки, работающие с файлами, флагами, окружением, логами, процессами и сигналами.
