questions:
  - id: csharp-layout
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	t := time.Date(2024, 3, 5, 15, 4, 0, 0, time.UTC)
      	fmt.Println(t.Format("yyyy-MM-dd"))
      	fmt.Println(t.Format("2006-01-02 03:04"))
      }
    options:
      - text: "yyyy-MM-dd\n2024-03-05 03:04"
        correct: true
        explain: "В `yyyy-MM-dd` нет ни одного куска эталонной даты — строка копируется как есть. `03` в раскладке — час в 12-часовом формате: 15 часов → `03`. Для 24-часового нужен `15`."
      - text: "2024-03-05\n2024-03-05 15:04"
        explain: "Go не понимает буквенные спецификаторы `yyyy`, `MM`, `dd`. А `03` — это 12-часовой час."
      - text: "ошибка формата\n2024-03-05 15:04"
        explain: "`Format` не возвращает ошибку и не проверяет раскладку — непонятные символы просто копируются."

  - id: day-month
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	t := time.Date(2024, time.March, 5, 0, 0, 0, 0, time.UTC)
      	fmt.Println(t.Format("02/01"), t.Format("01/02"), t.Format("Jan _2"))
      }
    options:
      - text: "05/03 03/05 Mar  5"
        correct: true
        explain: "В эталоне `01` — месяц (январь), `02` — день. `_2` — день, дополненный пробелом, а не нулём."
      - text: "03/05 05/03 Mar 05"
        explain: "`02` в эталоне — день (2 января), `01` — месяц. `_2` дополняет пробелом."
      - text: "05/03 03/05 March 5"
        explain: "`Jan` — короткое имя месяца, полное — `January`; `_2` оставляет место под вторую цифру."

  - id: parse-utc
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	msk := time.FixedZone("MSK", 3*3600)
      	a, _ := time.Parse("2006-01-02 15:04", "2024-03-05 10:00")
      	b, _ := time.ParseInLocation("2006-01-02 15:04", "2024-03-05 10:00", msk)
      	fmt.Println(a.UTC().Hour(), b.UTC().Hour(), b.Sub(a))
      }
    options:
      - text: "10 7 -3h0m0s"
        correct: true
        explain: "Без смещения в строке `Parse` берёт UTC: 10:00 UTC. `ParseInLocation` трактует ту же строку как 10:00 MSK — это 07:00 UTC, на 3 часа раньше."
      - text: "7 7 0s"
        explain: "`Parse` не использует ни локальный, ни какой-либо другой пояс — только UTC, если смещения нет в строке."
      - text: "10 10 0s"
        explain: "`ParseInLocation` разбирает показания часов в заданном поясе, поэтому момент получается другим."

  - id: unix-ms
    kind: single
    prompt: "API вернуло `1709640249123` (миллисекунды). Как получить `time.Time`?"
    options:
      - text: "`time.UnixMilli(ms)`"
        correct: true
        explain: "`UnixMilli` (Go 1.17+) принимает миллисекунды от 1970-01-01 UTC. Обратно — `t.UnixMilli()`."
      - text: "`time.Unix(ms, 0)`"
        explain: "`time.Unix` ждёт секунды: получится дата через 50 с лишним тысяч лет, без всякой ошибки."
      - text: "`time.Unix(0, ms)`"
        explain: "Второй аргумент — наносекунды: получится момент в первые полчаса 1970 года."
      - text: "`time.Parse(time.UnixDate, ms)`"
        explain: "`time.UnixDate` — раскладка текстового формата `Mon Jan _2 15:04:05 MST 2006`, к числам она отношения не имеет."
