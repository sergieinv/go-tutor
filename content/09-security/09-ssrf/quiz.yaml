questions:
  - id: userinfo-host
    kind: output
    prompt: "Сервис проверяет, что URL начинается с `http://good.example`. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"net/url"
      	"strings"
      )

      func main() {
      	raw := "http://good.example@127.0.0.1:8080/admin"
      	u, err := url.Parse(raw)
      	fmt.Println(strings.HasPrefix(raw, "http://good.example"), u.Hostname(), err)
      }
    options:
      - text: "true 127.0.0.1 <nil>"
        correct: true
        explain: "Всё до `@` — это userinfo (имя пользователя), а хост — `127.0.0.1`. Строковая проверка видит «наш» домен, клиент идёт во внутреннюю сеть. Проверка URL строкой обходится десятком таких трюков; надёжна только проверка адреса сокета."
      - text: "true good.example <nil>"
        explain: "`good.example` стоит перед `@`, а значит, это имя пользователя, а не хост. `Hostname()` вернёт то, что после `@`."
      - text: "false 127.0.0.1 <nil>"
        explain: "Префикс строки буквально совпадает — `HasPrefix` про структуру URL ничего не знает. В этом и проблема."

  - id: mapped-addr
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"net/netip"
      )

      func main() {
      	a := netip.MustParseAddr("::ffff:127.0.0.1")
      	b := netip.MustParseAddr("127.0.0.1")
      	fmt.Println(a.Is4(), a.IsLoopback(), a == b, a.Unmap() == b)
      }
    options:
      - text: "false true false true"
        correct: true
        explain: "IPv4-mapped IPv6 — это IPv6-адрес (`Is4` ложно, `Is4In6` истинно). Методы-классификаторы `netip.Addr` учитывают отображённые адреса, а сравнение `==` — нет: для него это разные значения. Поэтому перед сравнением со списками и префиксами делайте `Unmap()`. Сокет к такому адресу Go откроет как IPv4 к 127.0.0.1."
      - text: "false false false true"
        explain: "`IsLoopback` у `netip.Addr` распознаёт `::ffff:127.0.0.0/104` как loopback. А вот самописная проверка вида `a.Is4() && a.As4()[0] == 127` его пропустит."
      - text: "true true true true"
        explain: "`ParseAddr` сохраняет форму: адрес записан как IPv6, значит, `Is4()` ложно, и с IPv4-значением он по `==` не совпадает."

  - id: rebinding
    kind: single
    prompt: "Хендлер делает `net.DefaultResolver.LookupNetIP`, убеждается, что все адреса публичные, и вызывает `client.Get(url)` обычным клиентом. Чем это плохо?"
    options:
      - text: "`client.Get` резолвит имя заново, и DNS атакующего с TTL 0 во второй раз отдаёт 127.0.0.1 (DNS rebinding)"
        correct: true
        explain: "Проверка и использование разнесены во времени, а имя между ними может поменять значение. Проверять нужно тот адрес, к которому реально подключаемся: `Dialer.ControlContext` получает уже разрешённый IP, или же резолвите сами и подключайтесь к проверенному IP."
      - text: "Ничем: если резолв вернул публичные адреса, запрос уйдёт на них"
        explain: "Резолвов будет два — ваш и клиента, — и ничто не обязывает DNS отвечать одинаково. Атакующий контролирует свою зону и её ответы."
      - text: "`LookupNetIP` не умеет IPv6, поэтому ::1 проскочит"
        explain: "Умеет: с сетью `ip` он возвращает и A, и AAAA записи. Проблема в повторном резолве, а не в семействе адресов."
      - text: "Нужно было использовать `net.LookupHost` — он кеширует ответ"
        explain: "В Go нет встроенного DNS-кеша, который гарантировал бы тот же ответ при подключении. Да и кеш с коротким TTL не помог бы."

  - id: where-to-check
    kind: single
    prompt: "Где проверка адреса учтёт сразу редиректы, DNS и все формы записи IP (`0.0.0.0`, `[::ffff:127.0.0.1]`, имена)?"
    options:
      - text: "В `net.Dialer.ControlContext` клиента — по фактическому адресу сокета перед `connect`"
        correct: true
        explain: "Каждое соединение транспорта проходит через Dialer, и `ControlContext` получает IP:порт, к которому идёт подключение, — уже после DNS. Редирект — это новое соединение, и оно тоже пройдёт проверку."
      - text: "В `CheckRedirect` клиента"
        explain: "`CheckRedirect` видит URL следующего запроса, а не IP, и не вызывается для первого запроса. Он нужен для лимита редиректов и проверки схемы, а не адреса."
      - text: "В middleware, которое валидирует URL из тела запроса"
        explain: "Это строковая проверка URL: она не знает, куда резолвится имя и куда поведёт редирект."
      - text: "В `Transport.Proxy` — вернуть ошибку для внутренних хостов"
        explain: "`Proxy` выбирает прокси для запроса и видит только URL — до резолва имени и без фактического адреса. Ошибка из него остановит запрос, но проверка останется строковой."
