title: Безопасность
summary: Те же классы уязвимостей, что в ASP.NET, но без защит конвейера «из коробки» — инъекции, XSS, CSRF, SSRF, пароли и криптография, лимиты, секреты и зависимости в Go.
goals:
  - "Видеть границы доверия и проверять ввод: размеры, строгий JSON, переполнения."
  - "Закрывать инъекции, XSS, path traversal, CSRF и SSRF средствами стандартной библиотеки."
  - "Хранить пароли и секреты, выбирать криптопримитивы и настройки TLS без самодеятельности."
  - "Ставить лимиты против DoS, не раскрывать детали в ошибках и логах, проверять зависимости govulncheck."
