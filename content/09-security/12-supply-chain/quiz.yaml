questions:
  - id: string-compare
    kind: output
    prompt: "Уязвимость исправлена в `v0.10.0`. Что выведет наивная проверка?"
    code: |
      package main

      import "fmt"

      func main() {
      	fixed := "v0.10.0"
      	for _, v := range []string{"v0.9.5", "v0.10.1"} {
      		fmt.Println(v, v < fixed)
      	}
      }
    options:
      - text: |
          v0.9.5 false
          v0.10.1 false
        correct: true
        explain: "Строки сравниваются побайтово: `'9' > '1'`, поэтому `\"v0.9.5\" > \"v0.10.0\"` — уязвимая версия не попала в отчёт. Версии сравнивают по semver: `golang.org/x/mod/semver.Compare`."
      - text: |
          v0.9.5 true
          v0.10.1 false
        explain: "Так было бы при сравнении чисел. Оператор `<` для строк лексикографический."
      - text: |
          v0.9.5 true
          v0.10.1 true
        explain: "`\"v0.10.1\" > \"v0.10.0\"` и как строки, и как версии."

  - id: symbol-analysis
    kind: single
    prompt: "govulncheck сообщил: «Your code is affected by 0 vulnerabilities… also found 2 vulnerabilities in modules you require, but your code doesn't appear to call these vulnerabilities». Что это значит?"
    options:
      - text: "Версии модулей уязвимы, но в графе вызовов нет пути от вашего кода к уязвимым функциям — срочного риска нет, обновить стоит планово"
        correct: true
        explain: "Символьный анализ отделяет «модуль уязвим» от «уязвимость достижима». Достижимые идут в `Symbol Results` с трассами; остальные — повод обновиться, пока новый код их не вызвал."
      - text: Проект защищён, обновлять ничего не нужно
        explain: "Анализ не видит вызовов через рефлексию и код под другими тегами сборки, а завтрашний код может вызвать уязвимую функцию."
      - text: govulncheck не смог проверить эти модули
        explain: "Ошибка анализа выглядит иначе и даёт ненулевой код выхода, отличный от 3. Здесь проверка прошла."

  - id: mvs
    kind: single
    prompt: "Ваш модуль требует `example.com/a v1.2.0` и `example.com/b v1.0.0`, а `b v1.0.0` в своём go.mod требует `a v1.4.0`. Опубликована `a v1.9.0`. Какая версия `a` попадёт в сборку?"
    options:
      - text: v1.4.0
        correct: true
        explain: "MVS берёт максимальную из минимально требуемых версий: `max(v1.2.0, v1.4.0)`. Новые версии сами в сборку не попадают — только через `go get` и изменение `go.mod`."
      - text: v1.9.0
        explain: "Go не обновляет зависимости до последней версии автоматически — в отличие от плавающих версий NuGet."
      - text: v1.2.0
        explain: "`b` не соберётся со старой `a`: требование `v1.4.0` — это нижняя граница, и MVS её учитывает."

  - id: go-sum
    kind: multiple
    prompt: Что верно про `go.sum`?
    options:
      - text: "Хранит хеши архива модуля и его `go.mod` для каждой версии, нужной сборке"
        correct: true
        explain: "Строки `h1:` — хеш дерева файлов модуля; строка с `/go.mod` — хеш только `go.mod` (его хватает для построения графа)."
      - text: "При первой загрузке хеш сверяется с `sum.golang.org`, если модуль не в `GOPRIVATE`/`GONOSUMDB`"
        correct: true
        explain: "База сумм — журнал прозрачности: у версии навсегда один хеш, подмену тега или прокси увидят все."
      - text: "Это lock-файл: он выбирает, какие версии собирать"
        explain: "Версии выбирает MVS по `go.mod`. `go.sum` лишь проверяет, что скачано именно то."
      - text: "Модуль из `replace` на локальный каталог тоже проверяется по `go.sum`"
        explain: "Для каталога хеш не пишется и не проверяется — поэтому `replace` надо держать на ревью."
