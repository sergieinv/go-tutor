questions:
  - id: bn-calls
    kind: output
    prompt: "Флаг `-test.benchtime=100x` задаёт ровно 100 итераций. Что выведет программа?"
    code: |
      package main

      import (
      	"flag"
      	"fmt"
      	"testing"
      )

      func main() {
      	testing.Init()
      	flag.Set("test.benchtime", "100x")

      	setup, iters := 0, 0
      	r := testing.Benchmark(func(b *testing.B) {
      		setup++
      		for i := 0; i < b.N; i++ {
      			iters++
      		}
      	})
      	fmt.Println(setup, iters, r.N)
      }
    options:
      - text: "2 101 100"
        correct: true
        explain: "Бенчмарк на `b.N` сначала вызывается с `b.N = 1` (пробный запуск), затем с целевым `b.N = 100`. Функция — а с ней и подготовка — выполняется дважды, итераций всего 101, в результат идёт последний запуск."
      - text: "1 100 100"
        explain: "Так было бы с `for b.Loop()`: он вызывает функцию бенчмарка один раз. Цикл по `b.N` требует нескольких вызовов функции."
      - text: "100 100 100"
        explain: "Функция бенчмарка вызывается не на каждую итерацию — итерации крутятся внутри неё, в цикле по `b.N`."

  - id: loop-calls
    kind: output
    prompt: "Тот же замер, но с `b.Loop`. Что выведет программа?"
    code: |
      package main

      import (
      	"flag"
      	"fmt"
      	"testing"
      )

      func main() {
      	testing.Init()
      	flag.Set("test.benchtime", "100x")

      	setup, iters := 0, 0
      	r := testing.Benchmark(func(b *testing.B) {
      		setup++
      		for b.Loop() {
      			iters++
      		}
      	})
      	fmt.Println(setup, iters, r.N)
      }
    options:
      - text: "1 100 100"
        correct: true
        explain: "`b.Loop` сам наращивает число итераций внутри одного вызова функции, поэтому подготовка до цикла выполняется один раз. После цикла `b.N` равен числу выполненных итераций."
      - text: "2 101 100"
        explain: "Так ведёт себя цикл по `b.N`. Одно из главных преимуществ `b.Loop` — функция бенчмарка вызывается один раз."
      - text: "1 100 0"
        explain: "После завершения `b.Loop` поле `b.N` содержит общее число итераций, и результат его сохраняет."

  - id: allocs-escape
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"testing"
      )

      var sink []byte

      func main() {
      	escapes := testing.AllocsPerRun(100, func() {
      		sink = make([]byte, 64)
      	})
      	local := testing.AllocsPerRun(100, func() {
      		buf := make([]byte, 64)
      		buf[0] = 1
      	})
      	big := testing.AllocsPerRun(100, func() {
      		buf := make([]byte, 1<<20)
      		buf[0] = 1
      	})
      	fmt.Println(escapes, local, big)
      }
    options:
      - text: "1 0 1"
        correct: true
        explain: "Срез, сохранённый в глобальную переменную, «убегает» и живёт в куче. Маленький локальный буфер компилятор размещает на стеке — аллокаций нет. Мегабайт на стек не кладётся (большие и неизвестного размера объекты всегда в куче), поэтому снова одна аллокация."
      - text: "1 1 1"
        explain: "`make` не означает аллокацию в куче: escape-анализ кладёт небольшие локальные объекты фиксированного размера на стек."
      - text: "1 0 0"
        explain: "Стек горутины маленький и растёт копированием, поэтому крупные объекты (здесь 1 МБ) компилятор на нём не размещает."
      - text: "64 0 1048576"
        explain: "`AllocsPerRun` считает число аллокаций, а не байты. Байты на операцию показывает колонка `B/op` у бенчмарка."

  - id: read-line
    kind: single
    prompt: "Что означает `-12` в строке `BenchmarkJoin/builder/n=100-12  419793  572.3 ns/op  704 B/op  1 allocs/op`?"
    options:
      - text: "Значение `GOMAXPROCS`, с которым шёл замер"
        correct: true
        explain: "К имени добавляется `-N`, где N — `GOMAXPROCS`. Флаг `-cpu=1,4` прогоняет бенчмарк с разными значениями, и суффиксы будут `-1` и `-4`."
      - text: "Номер прогона при `-count`"
        explain: "Повторы `-count` печатаются отдельными строками с тем же именем, без номера."
      - text: "Число итераций в тысячах"
        explain: "Число итераций — вторая колонка (`419793`)."
      - text: "Номер под-бенчмарка"
        explain: "Под-бенчмарки различаются по имени после `/` — здесь `builder/n=100`."

  - id: compare
    kind: multiple
    prompt: "Вы ускорили функцию и хотите доказать это коллегам. Что из этого действительно помогает?"
    options:
      - text: "Прогнать бенчмарк до и после с `-count=10` и сравнить `benchstat`"
        correct: true
        explain: "benchstat считает медианы, разброс и p-value и помечает незначимые изменения `~`."
      - text: "Тест с `testing.AllocsPerRun`, закрепляющий новое число аллокаций"
        correct: true
        explain: "Число аллокаций не зависит от шума, а тест не даст случайно вернуть их обратно."
      - text: "Один запуск до и один после — если стало на 5% быстрее, этого достаточно"
        explain: "Разброс между запусками без изменений часто больше 5%. Одиночный замер ничего не доказывает."
      - text: "Сравнить `ns/op` с ноутбука коллеги и CI-сервера"
        explain: "Абсолютные числа на разных машинах несравнимы — сравнивают только «до» и «после» на одной машине."
