questions:
  - id: parallel-order
    kind: single
    prompt: "В каком порядке появятся строки лога этого теста?"
    code: |
      func TestOrder(t *testing.T) {
      	t.Cleanup(func() { t.Log("cleanup") })
      	defer t.Log("defer")
      	t.Run("p", func(t *testing.T) {
      		t.Parallel()
      		t.Log("parallel")
      	})
      	t.Run("s", func(t *testing.T) {
      		t.Log("sequential")
      	})
      }
    options:
      - text: "sequential, defer, parallel, cleanup"
        correct: true
        explain: "Параллельный подтест ставится на паузу и продолжается только после возврата из функции родителя — то есть после его `defer`. `t.Cleanup` родителя ждёт завершения всех подтестов."
      - text: "parallel, sequential, defer, cleanup"
        explain: "`t.Parallel()` не запускает подтест сразу: он ждёт, пока родитель вернётся. Последовательный `s` успевает выполниться раньше."
      - text: "sequential, parallel, defer, cleanup"
        explain: "Параллельные подтесты стартуют после возврата из функции родителя, поэтому `defer` срабатывает раньше них."
      - text: "sequential, defer, cleanup, parallel"
        explain: "Cleanup-функции родителя выполняются после завершения всех его подтестов, включая параллельные."

  - id: durably-blocked
    kind: multiple
    prompt: "Горутина внутри `synctest.Test` заблокирована. В каких случаях это «прочная» блокировка (durably blocked), при которой фейковые часы могут идти вперёд?"
    options:
      - text: "`time.Sleep(time.Minute)`"
        correct: true
        explain: "Сон в пузыре — прочная блокировка: разбудить его может только фейковое время."
      - text: "Приём из канала, созданного внутри пузыря"
        correct: true
        explain: "Отправить в такой канал может только горутина пузыря."
      - text: "`mu.Lock()` на занятом `sync.Mutex`"
        explain: "Мьютекс может отпустить кто угодно, в том числе код вне пузыря, — эта блокировка не прочная."
      - text: "`conn.Read` на TCP-соединении"
        explain: "Сетевой ввод-вывод разбудит событие извне пузыря, поэтому часы стоят. Для сети в пузыре используют `net.Pipe` или фейк."
      - text: "`select` по `ctx.Done()` и таймеру, если контекст и таймер созданы в пузыре"
        correct: true
        explain: "`select`, где все каналы из пузыря, — прочная блокировка. Так фоновые горутины с тикером и контекстом и проверяют."

  - id: bubble-time
    kind: single
    prompt: "Что напечатает `t.Log(time.Now().UTC())` в начале функции, переданной в `synctest.Test`?"
    options:
      - text: "`2000-01-01 00:00:00 +0000 UTC`"
        correct: true
        explain: "Часы каждого пузыря стартуют с полуночи 1 января 2000 года UTC — поэтому время в таких тестах воспроизводимо."
      - text: "Текущее время запуска теста"
        explain: "Внутри пузыря `time.Now` возвращает фейковое время, а не системное."
      - text: "`0001-01-01 00:00:00 +0000 UTC` — нулевое `time.Time`"
        explain: "Фейковые часы стартуют не с нулевого значения, а с 2000-01-01."

  - id: leaked-goroutine
    kind: single
    prompt: "Функция в `synctest.Test` запускает `go func() { <-ch }()` и возвращается, так и не отправив ничего в `ch` (канал создан в пузыре). Что будет?"
    options:
      - text: "Тест упадёт с паникой `deadlock: main bubble goroutine has exited but blocked goroutines remain`"
        correct: true
        explain: "`synctest.Test` ждёт завершения всех горутин пузыря. Горутина навсегда заблокирована на канале пузыря — это взаимоблокировка, и тест падает. Так `synctest` заодно ловит утечки горутин."
      - text: "Тест пройдёт, горутина останется висеть до конца процесса"
        explain: "Вне пузыря так и было бы. Но `synctest.Test` не возвращается, пока в пузыре есть горутины."
      - text: "Тест зависнет до таймаута `go test`"
        explain: "Зависание было бы при непрочной блокировке (сеть, mutex). Прочно заблокированная горутина распознаётся сразу как взаимоблокировка."

  - id: same-sleep
    kind: single
    prompt: "Внутри пузыря код заводит `time.AfterFunc(time.Second, f)`, а тест делает `time.Sleep(time.Second)` и сразу проверяет, что `f` выполнилась. Что не так?"
    options:
      - text: "Тест и таймер просыпаются в один момент, их порядок не определён — после `Sleep` нужен `synctest.Wait()`"
        correct: true
        explain: "Часы прыгают сразу на момент, где ждут обе горутины. `synctest.Wait()` дождётся, пока горутина `f` закончит работу или прочно заблокируется."
      - text: "Ничего: таймеры в пузыре всегда срабатывают раньше `Sleep`"
        explain: "Такой гарантии нет — это частая причина нестабильных synctest-тестов."
      - text: "`time.AfterFunc` в пузыре не работает"
        explain: "Работает: таймеры, созданные в пузыре, идут по его фейковым часам, а колбэк выполняется в горутине пузыря."
