title: Тестирование и качество
summary: Пакет testing и go test — табличные тесты, хелперы и фикстуры, параллельность и synctest, бенчмарки, fuzzing, примеры, покрытие, линтеры, моки и httptest без фреймворков.
goals:
  - Писать тесты рядом с кодом на одном пакете testing — табличные, с подтестами, хелперами и golden-файлами — и управлять ими флагами go test.
  - Проверять конкурентный и зависящий от времени код детерминированно — t.Parallel, -race и testing/synctest — и измерять производительность бенчмарками.
  - Проектировать тестопригодный код — маленькие интерфейсы, фейки и httptest вместо DI-контейнера и mock-фреймворков — и держать качество fuzzing'ом, покрытием и линтерами.
