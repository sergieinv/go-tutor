questions:
  - id: shared-counter
    kind: output
    prompt: "Генератор ID для тестов написан с пакетным счётчиком. Что выведет программа?"
    code: |
      package main

      import "fmt"

      var seq int

      func seqIDs(prefix string) func() string {
      	return func() string {
      		seq++
      		return fmt.Sprintf("%s-%d", prefix, seq)
      	}
      }

      func main() {
      	a := seqIDs("a") // генератор теста A
      	b := seqIDs("b") // генератор теста B
      	fmt.Println(a(), b(), a())
      }
    options:
      - text: "a-1 b-2 a-3"
        correct: true
        explain: "Оба замыкания меняют одну пакетную переменную `seq`. Значит, ID в тесте B зависят от того, сколько ID выдал тест A, — и меняются при другом порядке тестов, `-shuffle=on` или `-run`. Под `t.Parallel` это ещё и гонка. Счётчик должен жить внутри `seqIDs`: `n := 0` перед `return func()`."
      - text: "a-1 b-1 a-2"
        explain: "Так было бы, если бы у каждого генератора был свой счётчик, объявленный внутри `seqIDs`. Здесь счётчик пакетный и общий."
      - text: "a-1 b-1 a-1"
        explain: "Счётчик не сбрасывается между вызовами: `seq++` меняет пакетную переменную, и значение копится."

  - id: sleep-flaky
    kind: single
    prompt: "Тест запускает `go worker.Process(job)`, затем `time.Sleep(10 * time.Millisecond)` и проверяет `job.Done()`. Локально он всегда зелёный, а в CI иногда падает. Почему?"
    options:
      - text: "Планировщик не обещает, что горутина выполнится за 10 мс: под `-race`, на загруженном агенте или с малым GOMAXPROCS обработка занимает дольше, и проверка срабатывает раньше"
        correct: true
        explain: "`Sleep` — догадка о времени, а не синхронизация. Тест должен дождаться события: канала `done`, `WaitGroup` или результата из функции, а код с таймерами — проверяться в `synctest.Test`."
      - text: "В CI `time.Sleep` игнорируется ради скорости"
        explain: "`go test` не трогает `time.Sleep` — он спит честно. Фейковое время бывает только внутри `synctest.Test`."
      - text: "Тест надо исправить, увеличив паузу до секунды"
        explain: "Флак станет реже, но не исчезнет, а набор тестов замедлится на секунду на каждый такой тест. Нужна явная синхронизация."
      - text: "`go test` в CI запускает тесты параллельно, и `Sleep` прерывается"
        explain: "Тесты одного пакета идут последовательно, пока не вызван `t.Parallel`, и `Sleep` ничем не прерывается. Дело в планировании горутины, а не в параллельности тестов."

  - id: setenv-parallel
    kind: single
    prompt: "Что произойдёт при запуске теста?"
    code: |
      func TestConfig(t *testing.T) {
      	t.Parallel()
      	t.Setenv("APP_MODE", "test")
      	if Mode() != "test" {
      		t.Fatal("ожидался режим test")
      	}
      }
    options:
      - text: "Тест упадёт с паникой: `t.Setenv` нельзя вызывать в параллельном тесте"
        correct: true
        explain: "Окружение общее на весь процесс, и параллельный тест увидел бы чужие значения. Поэтому `testing` паникует: `test using t.Setenv or t.Chdir can not use t.Parallel`. Настройку передают параметром (`LoadConfig(getenv func(string) string)`) — тогда тест и параллельный, и изолированный."
      - text: "Тест пройдёт: `t.Setenv` меняет окружение только для этой горутины"
        explain: "Переменные окружения — свойство процесса, а не горутины. Именно поэтому `t.Setenv` и запрещён с `t.Parallel`."
      - text: "Тест пройдёт, но переменная останется установленной после теста"
        explain: "`t.Setenv` сам вернул бы старое значение через Cleanup — но до этого не дойдёт: вызов в параллельном тесте паникует."

  - id: shuffle-finds
    kind: single
    prompt: "Набор тестов пакета зелёный при `go test`, но с `go test -shuffle=on` иногда краснеет. О чём это говорит?"
    options:
      - text: "Тесты зависят от порядка запуска — обычно через общее состояние: пакетные переменные, файлы, БД, которые один тест меняет, а другой читает"
        correct: true
        explain: "`-shuffle=on` перемешивает тесты (и бенчмарки) и печатает seed — `-test.shuffle 1731...`; с `-shuffle=1731...` тот же порядок повторяется, и падение можно воспроизвести. Лечится изоляцией: состояние в экземпляре, `t.TempDir`, своя схема БД на тест."
      - text: "`-shuffle` запускает тесты параллельно, и всплывают гонки"
        explain: "Перемешивание не делает тесты параллельными — они по-прежнему идут по одному, если не вызван `t.Parallel`. Гонки ищет `-race`."
      - text: "`-shuffle` подаёт тестам случайные входные данные"
        explain: "Случайные входы — это fuzzing (`-fuzz`). `-shuffle` меняет только порядок тестов, но не их данные."

  - id: test-cache
    kind: single
    prompt: "Второй запуск `go test ./...` без изменений в коде печатает `ok  example.com/orders  (cached)` и ничего не выполняет. Как заставить CI реально прогонять тесты?"
    options:
      - text: "Добавить `-count=1`: с ним результат не берётся из кеша"
        correct: true
        explain: "`go test` кеширует успешный результат пакета, пока не изменились тестовый бинарник, флаги, прочитанные тестом файлы и переменные окружения. `-count=1` — идиоматичный способ отключить кеш; `go clean -testcache` чистит его целиком. `-count=N` с большим N ещё и прогоняет тест N раз — так ищут флаки."
      - text: "Ничего не нужно: в CI кеш всегда пуст"
        explain: "Многие CI сохраняют `GOCACHE` между сборками ради скорости — и тогда тесты, читающие внешнее состояние (сеть, БД, файлы вне модуля), могут «пройти» из кеша."
      - text: "Добавить `-v`: подробный режим отключает кеш"
        explain: "С `-v` результат тоже берётся из кеша — просто печатается сохранённый подробный вывод с пометкой `(cached)`."
