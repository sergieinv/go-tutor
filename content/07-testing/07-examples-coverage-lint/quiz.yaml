questions:
  - id: negative-cents
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	a := -5
      	fmt.Printf("%d.%02d\n", a/100, a%100)
      }
    options:
      - text: "0.-5"
        correct: true
        explain: "Деление в Go усекает к нулю: `-5 / 100 == 0`, а остаток берёт знак делимого: `-5 % 100 == -5`. `%02d` для `-5` даёт `-5` — ширина 2 уже заполнена. Знак нужно выводить отдельно, а делить модуль."
      - text: "-0.05"
        explain: "Так должно быть, но знак теряется в целой части (`0`) и уезжает в остаток."
      - text: "-1.95"
        explain: "Так было бы при делении с округлением вниз (как `Math.floor` или `%` в Python). В Go, как и в C#, деление целых усекает к нулю."
      - text: "0.05"
        explain: "Остаток от деления отрицательного числа в Go отрицателен: `-5 % 100 == -5`."

  - id: rune-width
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"fmt"
      	"unicode/utf8"
      )

      func main() {
      	fmt.Printf("[%-6s]\n", "Сыр")
      	fmt.Println(len("Сыр"), utf8.RuneCountInString("Сыр"))
      }
    options:
      - text: "[Сыр   ]\n6 3"
        correct: true
        explain: "`fmt` считает ширину в рунах: к трём буквам добавлено три пробела. А `len` строки — это байты: кириллица в UTF-8 занимает по два байта. Ширину колонки поэтому считают через `utf8.RuneCountInString`."
      - text: "[Сыр]\n6 3"
        explain: "Ширина `%-6s` считается в рунах, а не в байтах: «Сыр» — 3 руны, значит, добавятся 3 пробела."
      - text: "[Сыр   ]\n3 3"
        explain: "`len` возвращает длину в байтах, а каждая из букв «Сыр» занимает два байта."

  - id: which-run
    kind: multiple
    prompt: "Какие из этих Example-функций `go test` запустит и проверит?"
    options:
      - text: "Функция с последним комментарием `// Output: 12.34`"
        correct: true
        explain: "Вывод сравнивается с текстом после `Output:`."
      - text: "Функция с последним комментарием `// Unordered output:` и строками ниже"
        correct: true
        explain: "Запускается, строки сравниваются без учёта порядка."
      - text: "Функция без комментария с выводом"
        explain: "Она только компилируется — годится для примеров, которым нужны сеть или файлы."
      - text: "Функция с последним комментарием `// Вывод: 12.34`"
        explain: "Это не ключевое слово `Output:`, поэтому пример не запускается: `go test -v` не покажет для него даже `=== RUN`."

  - id: coverage-means
    kind: single
    prompt: "`go test -cover` показывает `coverage: 100.0% of statements`. Что это гарантирует?"
    options:
      - text: "Каждый оператор пакета хотя бы раз выполнился во время тестов"
        correct: true
        explain: "Только это. Проверялся ли результат — покрытие не знает: строка, выполненная без единого ассерта, тоже покрыта."
      - text: "В пакете нет ошибок, которые могли бы найти тесты"
        explain: "Покрытие не измеряет качество проверок. Тест без сравнений даёт те же 100%."
      - text: "Все ветки всех условий проверены с обоими исходами"
        explain: "Go считает покрытие операторов, а не ветвей: `if a || b` целиком покрыт, даже если `b` ни разу не вычислялось."
      - text: "Покрыт и код других пакетов, который вызывают тесты"
        explain: "По умолчанию считается только тестируемый пакет; другие пакеты добавляет `-coverpkg`."

  - id: example-name
    kind: single
    prompt: "В пакете есть тип `Amount` с методом `String`. Какое имя примера `go test` отвергнет ещё до запуска?"
    options:
      - text: "`ExampleAmount_String_Negative`"
        correct: true
        explain: "Суффикс должен начинаться со строчной буквы. `go vet`, который запускает `go test`, сообщит: `has malformed example suffix: Negative`."
      - text: "`ExampleAmount_String_negative`"
        explain: "Это правильный способ дать методу несколько примеров."
      - text: "`ExampleAmount`"
        explain: "Пример к типу `Amount` — корректное имя."
      - text: "`Example`"
        explain: "Пример ко всему пакету — корректное имя."
