title: Старт и инструменты
summary: Первая программа, значения, переменные и константы, модули и пакеты, go vet и gofmt — как устроен Go-проект без классов и namespace.
goals:
  - Писать и запускать программы на Go, понимать пакет main и функцию main.
  - Работать с базовыми типами, переменными и константами без неявных преобразований и null.
  - Раскладывать код по модулям и пакетам и пользоваться go build, go vet, go test и gofmt.
