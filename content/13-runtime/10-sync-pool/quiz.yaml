questions:
  - id: victim
    kind: output
    prompt: "Что выведет программа? (`GOMAXPROCS(1)` — чтобы горутина не переехала на другой P между вызовами.)"
    code: |
      package main

      import (
      	"fmt"
      	"runtime"
      	"sync"
      )

      func main() {
      	runtime.GOMAXPROCS(1)
      	var p sync.Pool
      	x := new(int)

      	p.Put(x)
      	runtime.GC()
      	fmt.Println(p.Get() == x)

      	p.Put(x)
      	runtime.GC()
      	runtime.GC()
      	fmt.Println(p.Get())
      }
    options:
      - text: "true\n<nil>"
        correct: true
        explain: "Первая сборка переносит основной кеш пула в victim-кеш, и `Get` достаёт объект оттуда. Во второй половине программы первая сборка снова переносит объект в victim-кеш, вторая выбрасывает его, и пул пуст, а `New` не задан — `Get` возвращает `nil`."
      - text: "false\n<nil>"
        explain: "Так вёл себя пул до Go 1.13: каждая сборка очищала его целиком. С victim-кешем объект переживает одну сборку."
      - text: "true\n0xc000012345"
        explain: "Две сборки подряд выбрасывают объект: первая переносит его в victim-кеш, вторая — удаляет victim-кеш."

  - id: no-reset
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"bytes"
      	"fmt"
      	"runtime"
      	"sync"
      )

      var pool = sync.Pool{New: func() any { return new(bytes.Buffer) }}

      func greet(name string) string {
      	buf := pool.Get().(*bytes.Buffer)
      	buf.WriteString("привет, " + name + "; ")
      	s := buf.String()
      	pool.Put(buf)
      	return s
      }

      func main() {
      	runtime.GOMAXPROCS(1)
      	greet("Аня")
      	fmt.Println(greet("Боря"))
      }
    options:
      - text: "привет, Аня; привет, Боря; "
        correct: true
        explain: "Буфер вернулся в пул с данными первого вызова, а `greet` не вызывает `buf.Reset()`. Второй вызов получил тот же буфер и дописал к старому содержимому. Под нагрузкой это превращается в чужие данные в чужом ответе."
      - text: "привет, Боря; "
        explain: "Пул не очищает объекты — он возвращает их такими, какими их положили. Сброс — обязанность кода, который берёт или возвращает объект."
      - text: Программа паникует
        explain: "Утверждение типа `.(*bytes.Buffer)` верно: `New` создаёт именно `*bytes.Buffer`, и `Put` кладёт его же."

  - id: pointer-to-slice
    kind: single
    prompt: "Почему пул байтовых срезов хранит `*[]byte`, а не `[]byte`?"
    options:
      - text: "`Put` принимает `any`; заголовок среза (три слова) упаковывается в интерфейс с аллокацией, а указатель помещается в интерфейс без неё"
        correct: true
        explain: "Иначе пул экономит большой массив, но выделяет 24 байта на каждый `Put`. `testing.AllocsPerRun` в примере показывает 1 против 0."
      - text: "`sync.Pool` не умеет хранить срезы — только указатели"
        explain: "Хранить можно что угодно: тип параметра — `any`. Вопрос только в цене упаковки."
      - text: Срез в пуле может быть собран GC, а указатель — нет
        explain: "GC одинаково обходится с любыми объектами пула: основной кеш переезжает в victim, victim выбрасывается."
      - text: Так быстрее копировать срез при Get
        explain: "Копирования данных нет ни в одном варианте; разница — в аллокации при упаковке в интерфейс."

  - id: when-pool
    kind: multiple
    prompt: "Где `sync.Pool` уместен?"
    options:
      - text: Буферы для сериализации ответов в горячем HTTP-обработчике
        correct: true
        explain: "Классика: объекты одного типа и похожего размера, живут один запрос, создаются тысячами в секунду. Так делают `fmt` и `encoding/json`."
      - text: Пул соединений с базой данных
        explain: "Пул может выбросить объект в любой момент без уведомления — соединение не закроется и утечёт. Соединениям нужен пул с явным владением (`*sql.DB`)."
      - text: "Маленькая структура из двух полей, которая не убегает из функции"
        explain: "Она и так живёт на стеке — аллокации нет, экономить нечего, а `Get`/`Put` добавят работы."
      - text: Временные структуры-черновики кодировщика, которые создаёт каждый вызов `Encode`
        correct: true
        explain: "Так `encoding/json` хранит кодировщики `jsontext.Encoder` (`jsontext/pools.go`): пул снимает аллокацию с каждого вызова и масштабируется на много ядер."
      - text: Кеш результатов запросов, которые должны жить минуту
        explain: "Пул не обещает хранить объекты: две сборки мусора — и кеш пуст. Для кеша нужна map с вытеснением."

  - id: race-drop
    kind: single
    prompt: "Тест проверяет, что после `Put(x)` вызов `Get()` возвращает `x`. Без флагов он проходит, а с `-race` иногда падает. Почему?"
    options:
      - text: "Под `-race` `Put` нарочно выбрасывает примерно каждый четвёртый объект"
        correct: true
        explain: "Так рантайм ловит код, который полагается на сохранность объектов в пуле. Пул ничего не обещает — тест проверяет то, чего нет в контракте."
      - text: "Детектор нашёл гонку внутри `sync.Pool`"
        explain: "Пул потокобезопасен; отчёт детектора выглядел бы как `WARNING: DATA RACE`, а не как другой объект из `Get`."
      - text: "С `-race` GOMAXPROCS всегда равен 1"
        explain: "Детектор не меняет `GOMAXPROCS`. Объект выбрасывается в самом `Put`."
