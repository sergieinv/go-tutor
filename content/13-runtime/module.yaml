title: Механизмы рантайма
summary: Что происходит под капотом Go-программы — планировщик GMP, стеки горутин, escape analysis, сборщик мусора и его настройка, устройство срезов, map, интерфейсов и каналов, memory model, sync.Pool, reflection и unsafe, pprof, inlining и PGO.
goals:
  - "Понимать, как планировщик раскладывает горутины по потокам и почему горутина дешевле потока ОС."
  - "Читать вывод -gcflags=-m и gctrace, знать, что попадает в кучу и сколько это стоит GC."
  - "Настраивать GOGC и GOMEMLIMIT под задержки и память контейнера, а не наугад."
  - "Объяснять устройство срезов, map, интерфейсов и каналов и предсказывать их стоимость."
  - "Писать корректный конкурентный код по memory model, а не по удаче."
  - "Профилировать pprof и trace и проверять оптимизации измерением, а не верой."
