questions:
  - id: index-panic
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func at(s []int, i int) (v int, err error) {
      	defer func() {
      		if r := recover(); r != nil {
      			err = fmt.Errorf("%v", r)
      		}
      	}()
      	return s[i], nil
      }

      func main() {
      	_, err := at([]int{1, 2, 3}, 5)
      	fmt.Println(err)
      }
    options:
      - text: "runtime error: index out of range [5] with length 3"
        correct: true
        explain: "Проверка границ — это не только цена, но и безопасность: вместо чтения чужой памяти программа паникует с понятным сообщением. BCE убирает проверку, только когда компилятор доказал, что выхода за границы быть не может."
      - text: "0 — компилятор убрал проверку, и прочиталась память за срезом"
        explain: "Компилятор удаляет только доказуемо лишние проверки. Здесь `i` приходит снаружи, ничего не доказано — проверка остаётся."
      - text: "<nil>"
        explain: "Индекс 5 при длине 3 — паника `runtime error`, её перехватил `recover` и превратил в ошибку."

  - id: two-calls
    kind: single
    prompt: "`g` помечена `//go:noinline`. Встроит ли компилятор `f` (бюджет 80) в место вызова?"
    code: |
      //go:noinline
      func g(x int) int { return x * 2 }

      func f(x int) int { return g(x) + g(x+1) }
    options:
      - text: "Нет: каждый вызов невстраиваемой функции добавляет 57, два вызова — больше 80"
        correct: true
        explain: "`-gcflags=-m=2` скажет `cannot inline f: function too complex: cost … exceeds budget 80`. С одним вызовом `g` функция `f` уложилась бы в бюджет."
      - text: "Да: тело `f` — одна строка"
        explain: "Бюджет считается не в строках, а в узлах, и вызов стоит дорого: 57 за каждый вызов, который нельзя встроить."
      - text: "Нет: функции, вызывающие `//go:noinline`, не встраиваются никогда"
        explain: "Встраиваются, если укладываются в бюджет: функция с одним таким вызовом обычно встроится. Здесь мешает только стоимость двух вызовов."
      - text: "Да, но только при сборке с PGO"
        explain: "PGO поднимает бюджет до 2000 только для горячих мест вызова из профиля. Без профиля решение — по обычному бюджету 80."

  - id: hint-checks
    kind: single
    prompt: "Сколько проверок границ останется в функции (её смотрят отдельно, без встраивания)?"
    code: |
      func le32(b []byte) uint32 {
      	_ = b[3]
      	return uint32(b[0]) | uint32(b[1])<<8 | uint32(b[2])<<16 | uint32(b[3])<<24
      }
    options:
      - text: Одна — в строке `_ = b[3]`
        correct: true
        explain: "Если `b[3]` в границах, то `len(b) >= 4`, и `b[0]`…`b[3]` доказаны. `-d=ssa/check_bce/debug=1` покажет одну строку `Found IsInBounds`. Без подсказки их было бы четыре."
      - text: Ноль — компилятор видит все индексы константами
        explain: "Константный индекс ничего не говорит о длине среза, пришедшего снаружи. Одна проверка нужна, вопрос только — одна или четыре."
      - text: Пять — подсказка добавляет свою проверку к четырём
        explain: "Подсказка и есть та единственная проверка: остальные после неё доказаны и удалены."

  - id: no-inline-ops
    kind: multiple
    prompt: "Что в теле функции само по себе не даёт её встроить (Go 1.27)?"
    options:
      - text: "`defer`"
        correct: true
        explain: "`-m=2` скажет `cannot inline f: unhandled op DEFER`. Поэтому хелпер с `mu.Lock(); defer mu.Unlock()` не встраивается, а его вызов стоит полноценного вызова."
      - text: "`go func() { ... }()`"
        correct: true
        explain: "Запуск горутины — `unhandled op GO`."
      - text: "`recover()`"
        correct: true
        explain: "`cannot inline f: call to recover`."
      - text: Цикл `for … range`
        explain: "Циклы встраиванию не мешают, если функция укладывается в бюджет."
      - text: Чтение из map
        explain: "`m[k]` — обычный узел с небольшой стоимостью; функция-геттер над map встраивается."

  - id: pgo-where
    kind: single
    prompt: "Как включить PGO для сервиса `cmd/api` при обычном `go build ./cmd/api`?"
    options:
      - text: "Положить CPU-профиль из продакшна в `cmd/api/default.pgo`: с Go 1.21 по умолчанию действует `-pgo=auto`"
        correct: true
        explain: "Компилятор применит профиль ко всему бинарнику: горячие вызовы встроятся с бюджетом до 2000, частые вызовы через интерфейс девиртуализуются. `go version -m` покажет `-pgo=…` в настройках сборки."
      - text: "Добавить `//go:pgo` над горячими функциями"
        explain: "Такой директивы нет. Горячесть определяет профиль, а не разметка в коде."
      - text: "Ничего: Go, как .NET 8, собирает профиль сам во время работы"
        explain: "Это Dynamic PGO в JIT-рантайме. В Go JIT нет: профиль снимают отдельно и передают компилятору при сборке."
      - text: "Положить профиль в корень модуля рядом с `go.mod`"
        explain: "`-pgo=auto` ищет `default.pgo` в каталоге каждого пакета `main`, а не в корне модуля."
