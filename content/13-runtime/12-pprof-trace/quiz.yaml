questions:
  - id: block-off
    kind: output
    prompt: "`main` дважды ждёт на канале по 20 мс: до и после `SetBlockProfileRate(1)`. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"runtime"
      	"runtime/pprof"
      	"time"
      )

      func wait() {
      	ch := make(chan int)
      	go func() {
      		time.Sleep(20 * time.Millisecond)
      		ch <- 1
      	}()
      	<-ch
      }

      func main() {
      	block := pprof.Lookup("block")
      	wait()
      	before := block.Count()
      	runtime.SetBlockProfileRate(1)
      	wait()
      	fmt.Println(before, block.Count() > 0)
      }
    options:
      - text: "0 true"
        correct: true
        explain: "Профиль блокировок по умолчанию выключен: первое ожидание не записано. После `SetBlockProfileRate(1)` записывается каждое событие блокировки, и второе ожидание на канале попадает в профиль."
      - text: "1 true"
        explain: "Чтобы первое ожидание попало в профиль, его нужно было включить до `wait()`. По умолчанию `block` и `mutex` выключены — они не бесплатны."
      - text: "0 false"
        explain: "Ставка 1 означает «записывать все события», а ожидание длилось 20 мс — оно точно попадёт в профиль."

  - id: leaked-count
    kind: output
    prompt: "Функция `fetch` возвращается, не дождавшись горутин. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"runtime/pprof"
      	"sync"
      )

      func fetch(started *sync.WaitGroup) {
      	ch := make(chan int) // никто не читает
      	for i := range 3 {
      		started.Add(1)
      		go func() {
      			started.Done()
      			ch <- i
      		}()
      	}
      }

      func main() {
      	var started sync.WaitGroup
      	fetch(&started)
      	started.Wait()
      	fmt.Println(pprof.Lookup("goroutine").Count())
      }
    options:
      - text: "4"
        correct: true
        explain: "Профиль горутин считает все пользовательские горутины, включая `main`: три застряли на отправке в канал, который никто не читает, плюс сама `main`. Текст `WriteTo(w, 1)` показал бы их стек — строку `ch <- i`. Именно так ищут утечки горутин."
      - text: "3"
        explain: "Горутина `main` тоже в профиле — её стек ведёт в `pprof.(*Profile).Count` и выше."
      - text: "1"
        explain: "Горутины не завершаются вместе с функцией, которая их запустила. Они живут, пока не выйдут сами, а эти навсегда заблокированы на отправке."

  - id: heap-index
    kind: single
    prompt: "Память процесса растёт часами и не освобождается. Какой индекс heap-профиля открыть первым?"
    options:
      - text: "`inuse_space` — сколько байт живых объектов держит каждая точка выделения"
        correct: true
        explain: "Утечка — это живые объекты, которые никто не освобождает. `inuse_space` показывает, кто держит память сейчас, а `-diff_base` двух снимков с интервалом в час — что выросло."
      - text: "`alloc_space` — сколько всего выделено с начала работы"
        explain: "Это вопрос «кто мусорит» — полезно для нагрузки на GC, но память, выделенная и уже собранная, к утечке отношения не имеет."
      - text: "CPU-профиль: утечка всегда видна по времени в `mallocgc`"
        explain: "CPU-профиль покажет, сколько времени ушло на выделения, но не то, кто держит память."
      - text: "`goroutine` — утечки памяти бывают только из-за горутин"
        explain: "Застрявшие горутины действительно держат свои стеки и всё, на что ссылаются, и профиль горутин стоит проверить. Но чаще память держат кеши, map и срезы, и это видно в `inuse_space`."

  - id: pprof-exposure
    kind: single
    prompt: "Какой способ подключить `net/http/pprof` в сервисе безопасен по умолчанию?"
    options:
      - text: "Отдельный `http.ServeMux` с явно зарегистрированными `pprof.Index`, `pprof.Profile` и т.д. на сервере, слушающем `127.0.0.1:6060`"
        correct: true
        explain: "Профили доступны только с той же машины (или через проброс порта), публичный сервер их не видит. Отдельный сервер не мешает и таймаутам публичного: CPU-профиль на 30 секунд не упрётся в `WriteTimeout`."
      - text: "`import _ \"net/http/pprof\"` и публичный сервер с `Handler: nil`"
        explain: "Пустой импорт регистрирует обработчики в `DefaultServeMux`, и публичный сервер с `Handler: nil` отдаёт их всем: стеки, аргументы запуска, CPU-профиль по запросу."
      - text: "Обработчики на публичном mux по пути с длинным случайным префиксом"
        explain: "Секретный путь — не контроль доступа: он утекает в логи, историю и конфиги. Профили — на внутреннем адресе."
      - text: "Публичный сервер, но только метод GET"
        explain: "С Go 1.22 пустой импорт и так регистрирует их в `DefaultServeMux` с шаблонами `GET /debug/pprof/…` (сами функции метод не проверяют). Ограничение метода не ограничивает, кто может их вызвать."

  - id: flight-recorder
    kind: single
    prompt: "Задача: в продакшне раз в несколько часов запрос зависает на секунду, и нужна трасса планировщика именно этого момента. Что подходит лучше всего?"
    options:
      - text: "`trace.FlightRecorder` (Go 1.25): трасса постоянно пишется в кольцевой буфер в памяти, а `WriteTo` сохраняет последние секунды, когда медленный запрос замечен"
        correct: true
        explain: "На диск попадает только интересное окно, а держать трассировку включённой постоянно дёшево по памяти — буфер ограничен `MinAge`/`MaxBytes`."
      - text: "`trace.Start` при старте процесса и `trace.Stop` при выключении"
        explain: "Многочасовая трасса — гигабайты событий, которые придётся хранить и разбирать ради одной секунды."
      - text: "CPU-профиль за 30 секунд по `/debug/pprof/profile`"
        explain: "Профиль показывает, где тратится процессор, но не ожидания и не порядок событий во времени. И снять его в нужные 30 секунд из нескольких часов — удача."
      - text: "`GODEBUG=schedtrace=1000`"
        explain: "Раз в секунду печатается сводка очередей планировщика — без стеков и без конкретных горутин, связанных с запросом."
