questions:
  - id: len-after-close
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	ch := make(chan int, 3)
      	ch <- 1
      	ch <- 2
      	close(ch)
      	n, c := len(ch), cap(ch)
      	v, ok := <-ch
      	fmt.Println(n, c, v, ok, len(ch))
      }
    options:
      - text: "2 3 1 true 1"
        correct: true
        explain: "`close` не трогает буфер: `qcount` = 2, `dataqsiz` = 3. Значения из буфера после закрытия выдаются как обычно, с `ok == true`, и `qcount` уменьшается."
      - text: "0 3 0 false 0"
        explain: "Закрытие не очищает буфер — получатели дочитывают оставшиеся значения."
      - text: "2 3 1 false 1"
        explain: "`ok == false` только когда канал закрыт **и** пуст. Здесь значение реальное."
      - text: "panic: receive from closed channel"
        explain: "Получение из закрытого канала никогда не паникует. Паникуют отправка в закрытый канал и повторный `close`."

  - id: timer-chan-len
    kind: output
    prompt: Что выведет программа на Go 1.27?
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	t := time.NewTimer(time.Millisecond)
      	time.Sleep(10 * time.Millisecond) // таймер уже сработал
      	fmt.Println(len(t.C), cap(t.C))
      	<-t.C
      }
    options:
      - text: "0 0"
        correct: true
        explain: "С Go 1.23 канал таймера выглядит небуферизованным: `len` и `cap` всегда 0, даже когда значение готово. Так `Stop` и `Reset` могут отменить сработавшее значение. В Go 1.27 настройку `asynctimerchan` со старым поведением удалили."
      - text: "1 1"
        explain: "Так было до Go 1.23, когда канал таймера был буферизованным на одно значение."
      - text: "0 1"
        explain: "`cap` канала таймера с Go 1.23 тоже 0."

  - id: direct-handoff
    kind: single
    prompt: "Горутина G2 ждёт в `<-ch` на пустом канале `make(chan int, 4)`. Горутина G1 выполняет `ch <- 7`. Что происходит внутри?"
    options:
      - text: "7 копируется прямо в переменную в стеке G2, буфер не меняется, G2 будится"
        correct: true
        explain: "`chansend` находит получателя в `recvq` и вызывает `sendDirect`: значение пишется по `sudog.elem` — в стек G2. `qcount` остаётся 0."
      - text: "7 записывается в `buf[sendx]`, а G2 потом читает его из буфера"
        explain: "Так было бы без ждущего получателя. Когда получатель уже ждёт, буфер пропускается — одной копией меньше."
      - text: "G1 блокируется, пока G2 не проснётся и не заберёт значение"
        explain: "G1 не ждёт: передача завершается под мьютексом канала, G2 лишь ставится в очередь планировщика."
      - text: "Рантайм создаёт новую горутину, которая переносит значение"
        explain: "Никаких промежуточных горутин: передача — копирование памяти и `goready` для получателя."

  - id: select-orders
    kind: single
    prompt: "`selectgo` строит два порядка веток: `pollorder` (случайная перестановка) и `lockorder` (по адресам каналов). Зачем нужен `lockorder`?"
    options:
      - text: "Чтобы все горутины захватывали мьютексы каналов в одном порядке и не устраивали взаимную блокировку"
        correct: true
        explain: "Две горутины с `select` по каналам a и b в разном порядке могли бы захватить a и b навстречу друг другу. Сортировка по адресу `hchan` делает порядок одинаковым для всех."
      - text: "Чтобы выбирать среди готовых веток равновероятно"
        explain: "За равновероятный выбор отвечает `pollorder` — случайная перестановка, в которой ищется первая готовая ветка."
      - text: "Чтобы ветки с меньшим адресом канала имели приоритет"
        explain: "Приоритета нет: порядок блокировки не влияет на то, какая ветка выполнится."
      - text: "Чтобы `default` проверялся последним"
        explain: "`default` вообще не канал и в `lockorder` не входит: он выполняется, если в проходе 1 не нашлось готовых веток."

  - id: close-effects
    kind: multiple
    prompt: "Что делает `close(ch)`, если в `recvq` ждут две горутины, а буфер пуст?"
    options:
      - text: "Ставит `closed = 1` под мьютексом канала"
        correct: true
        explain: "Флаг меняется под `hchan.lock`, поэтому отправка, начавшаяся позже, гарантированно увидит закрытие."
      - text: "Будит обоих получателей, каждый получает нулевое значение и `ok == false`"
        correct: true
        explain: "`closechan` снимает всех из `recvq`, обнуляет их `elem` и будит — закрытие широковещательное."
      - text: "Будит только первого получателя, как обычная отправка"
        explain: "Отправка будит одного; `close` — всех ждущих сразу."
      - text: "Освобождает память `hchan` и буфера"
        explain: "Память освобождает сборщик мусора, когда на канал не останется ссылок. Закрытый канал по-прежнему можно читать."
