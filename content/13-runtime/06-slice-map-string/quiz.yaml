questions:
  - id: append-five
    kind: output
    prompt: Что выведет программа (64-битная платформа)?
    code: |
      package main

      import "fmt"

      func main() {
      	s := append([]int(nil), 1, 2, 3, 4, 5)
      	fmt.Println(len(s), cap(s))
      }
    options:
      - text: "5 5"
        explain: "`nextslicecap` действительно просит ровно 5 элементов, но это 40 байт, а аллокатор выдаёт память классами размера. Ближайший класс — 48 байт, и рантайм отдаёт его целиком."
      - text: "5 6"
        correct: true
        explain: "Нужно больше, чем удвоение нулевой ёмкости, поэтому формула берёт 5 элементов = 40 байт. `roundupsize` округляет до класса 48 байт, и ёмкость пересчитывается: 48 / 8 = 6."
      - text: "5 8"
        explain: "Ёмкость не округляется до степени двойки — она округляется до класса размера аллокатора (8, 16, 24, 32, 48…)."
      - text: "5 10"
        explain: "Удвоение считается от старой ёмкости (0), а не от новой длины."

  - id: append-large
    kind: output
    prompt: Что выведет программа (64-битная платформа)?
    code: |
      package main

      import "fmt"

      func main() {
      	s := make([]int, 512)
      	s = append(s, 1)
      	fmt.Println(cap(s))
      }
    options:
      - text: "1024"
        explain: "Удвоение — только для ёмкости меньше 256. Дальше `nextslicecap` прибавляет `(cap + 768) / 4`."
      - text: "640"
        explain: "Это ровно ×1,25. Но формула `newcap += (newcap + 3*256) >> 2` даёт плавный переход: при 512 прибавка 320, а не 128."
      - text: "832"
        explain: "Формула действительно даёт 832, но 832 × 8 = 6656 байт округляются вверх до класса размера 6784 байта."
      - text: "848"
        correct: true
        explain: "512 + (512 + 768) / 4 = 832 элемента = 6656 байт; ближайший класс размера — 6784 байта, это 848 элементов."

  - id: string-copy
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	b := []byte("go")
      	s := string(b)
      	b[0] = 'n'
      	fmt.Println(s, string(b))
      }
    options:
      - text: "go no"
        correct: true
        explain: "`string(b)` копирует байты: строка неизменяема, и запись в срез не должна её менять. Компилятор убирает копию только там, где строка заведомо не переживёт изменения среза."
      - text: "no no"
        explain: "Так было бы, если бы строка разделяла память со срезом — как после `unsafe.String`. Обычная конвертация копирует."
      - text: "go go"
        explain: "Срез `b` изменился: `string(b)` во втором аргументе — новая копия текущих байтов."

  - id: no-copy-conversion
    kind: single
    prompt: В каком случае компилятор обходится без копирования байтов при `string(b)` (b — `[]byte` длиной 100 байт)?
    options:
      - text: "`v := m[string(b)]` — поиск в map"
        correct: true
        explain: "Строка нужна только на время поиска, поэтому компилятор использует байты среза напрямую (`slicebytetostringtmp`)."
      - text: "`m[string(b)] = 1` — запись в map"
        explain: "Ключ сохраняется в map и переживёт изменения `b`, поэтому байты обязательно копируются."
      - text: "`key := string(b); v := m[key]`"
        explain: "Отдельная переменная — уже обычная конвертация с копией: оптимизация срабатывает только на выражении прямо в индексе."
      - text: "`return string(b)`"
        explain: "Строка уходит из функции, а срез могут изменить позже — копия нужна."

  - id: tombstone
    kind: single
    prompt: Почему при удалении из полностью занятой группы Swiss table ставит надгробие (`0xFE`), а не «пусто» (`0x80`)?
    options:
      - text: "Пустой слот обрывает поиск, и ключи, которые при вставке ушли дальше по последовательности групп, перестали бы находиться"
        correct: true
        explain: "Поиск заканчивается на первой группе с пустым слотом. Пока группа была полной, вставки проходили через неё дальше — надгробие сохраняет эту цепочку."
      - text: "Чтобы освободить память под ключ и значение"
        explain: "Память не освобождается ни в одном из вариантов: слот остаётся в таблице, меняется только контрольный байт."
      - text: "Чтобы итерация `range` не вернула удалённый ключ"
        explain: "Итератор пропускает и пустые слоты, и надгробия одинаково: оба не считаются занятыми."
      - text: "Надгробие ставится всегда, а пустые слоты появляются только при росте таблицы"
        explain: "Нет: если в группе есть пустой слот, цепочка через неё не проходит, и рантайм сразу ставит «пусто»."
