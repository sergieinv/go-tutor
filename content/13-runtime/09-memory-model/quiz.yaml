questions:
  - id: buffered-swap
    kind: single
    prompt: "Горутина сначала пишет `a`, потом получает из канала; `main` отправляет в канал и печатает `a`. Гарантирует ли модель памяти, что программа напечатает `hello`?"
    code: |
      package main

      var c = make(chan int, 1)
      var a string

      func f() {
      	a = "hello"
      	<-c
      }

      func main() {
      	go f()
      	c <- 0
      	print(a)
      }
    options:
      - text: Нет — в канале есть буфер, и отправка не ждёт получения
        correct: true
        explain: "Отправка в канал с буфером 1 завершается сразу, ребра «получение → завершение отправки» нет, значит, запись `a` и `print(a)` не упорядочены: это гонка. С `make(chan int)` получение было бы synchronized before завершения отправки, и программа гарантированно печатала бы `hello`."
      - text: Да — любая операция с каналом синхронизирует горутины
        explain: "Синхронизирует пара «отправка → завершение получения». Здесь `main` только отправляет и ничего не получает, а отправка в буфер не ждёт `f`."
      - text: "Да — по правилу k-го получения при C = 1"
        explain: "Правило связывает k-е получение с завершением (k+C)-й отправки, то есть первое получение — со второй отправкой. А в программе отправка одна."
      - text: Нет — программа не скомпилируется
        explain: "Код корректен синтаксически и по типам; проблема только в отсутствии happens-before."

  - id: closed-receive
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func main() {
      	var msg string
      	done := make(chan struct{})
      	go func() {
      		msg = "готово"
      		close(done)
      	}()
      	<-done
      	v, ok := <-done
      	fmt.Println(msg, v, ok)
      }
    options:
      - text: "готово {} false"
        correct: true
        explain: "`close` synchronized before получения, которое вернуло нулевое значение из-за закрытия, — поэтому `msg` виден без гонки. Повторное получение из закрытого канала тоже сразу возвращает нулевое `struct{}{}` и `ok == false`."
      - text: " {} false"
        explain: "Пустую строку можно было бы увидеть без синхронизации. Здесь `msg` записан до `close`, а печать идёт после получения, увидевшего закрытие."
      - text: "готово {} true"
        explain: "`ok == true` бывает только для значения, которое реально отправили. Из закрытого канала приходит нулевое значение с `ok == false`."
      - text: Программа зависнет на втором получении
        explain: "Получение из закрытого канала никогда не блокируется."

  - id: dekker
    kind: output
    prompt: "Две горутины записывают свой атомик и читают чужой. Что напечатает программа?"
    code: |
      package main

      import (
      	"fmt"
      	"sync"
      	"sync/atomic"
      )

      func main() {
      	var x, y atomic.Int32
      	var r1, r2 int32
      	var wg sync.WaitGroup
      	wg.Go(func() {
      		x.Store(1)
      		r1 = y.Load()
      	})
      	wg.Go(func() {
      		y.Store(1)
      		r2 = x.Load()
      	})
      	wg.Wait()
      	fmt.Println(r1 == 0 && r2 == 0)
      }
    options:
      - text: "false"
        correct: true
        explain: "Атомики Go последовательно согласованы: все операции выстраиваются в один общий порядок. Какой `Store` ни окажется в нём первым, следующий за ним `Load` в другой горутине увидит 1, поэтому оба нуля невозможны. `r1` и `r2` читаются после `wg.Wait()`, так что гонки на них нет."
      - text: "true"
        explain: "Оба нуля означали бы, что каждое чтение обогнало запись своей же горутины. Для последовательно согласованных атомиков это запрещено."
      - text: "Бывает и `true`, и `false` — зависит от процессора"
        explain: "Так было бы с обычными переменными (это ещё и гонка) или с `Volatile.Read`/`Write` в C#: acquire/release разрешает чтению обогнать более раннюю запись в другую переменную. Атомики Go это запрещают."

  - id: sync-edges
    kind: multiple
    prompt: "Какие из этих пар связаны отношением happens-before (первое — до второго)?"
    options:
      - text: "`go f()` и первая инструкция `f`"
        correct: true
        explain: "Оператор `go` synchronized before начала выполнения горутины: всё, что записано до `go`, видно внутри."
      - text: "`wg.Done()` и возврат из `wg.Wait()`, который он разблокировал"
        correct: true
        explain: "Так документирован `WaitGroup`: результаты горутин можно читать после `Wait` без дополнительной синхронизации."
      - text: "Возврат из горутины и следующая строка в `main` после `time.Sleep`"
        explain: "Завершение горутины ни с чем не синхронизировано, а `Sleep` — не операция синхронизации. Сколько ни жди, гонка остаётся гонкой."
      - text: "`mu.Unlock()` и следующий успешный `mu.TryLock()`"
        correct: true
        explain: "Успешный `TryLock` эквивалентен `Lock`. А вот неудачный не синхронизирует ничего."
      - text: "Атомарный `ready.Store(true)` и обычное чтение `ready` в другой горутине"
        explain: "Если хоть один доступ к переменной не атомарный и они не упорядочены — это гонка. Атомарными должны быть все конкурентные обращения."

  - id: torn-interface
    kind: single
    prompt: "Одна горутина в цикле присваивает интерфейсной переменной `v` то `small{}`, то `big{}`, другая без синхронизации читает `v` и вызывает метод. Что допускает модель памяти?"
    options:
      - text: "Читатель может увидеть тип от одной записи и указатель на данные от другой — и упасть или испортить память"
        correct: true
        explain: "Интерфейс — два машинных слова. Значения шире слова при гонке разрешено читать пословно в любом порядке, поэтому пара «тип + данные» может не совпадать ни с одной записью. Метод `big` получит данные `small`."
      - text: Только старое или новое значение целиком
        explain: "Такая гарантия есть лишь для значений не шире машинного слова. Интерфейс, строка и срез в неё не попадают."
      - text: Поведение программы полностью не определено, как в C++
        explain: "Go строже C++: для однословных значений чтение обязано вернуть реально записанное значение. Но для многословных гонка всё равно может дать несогласованную пару — отсюда и порча памяти."
      - text: Рантайм всегда паникует при одновременном доступе к интерфейсу
        explain: "Без `-race` рантайм ничего не проверяет. Фатальную ошибку при одновременной записи даёт только map — и то не всегда."
