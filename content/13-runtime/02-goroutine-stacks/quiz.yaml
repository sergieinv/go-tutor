questions:
  - id: pointer-survives-growth
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import "fmt"

      func deep(n int) int {
      	if n == 0 {
      		return 0
      	}
      	return deep(n-1) + 1
      }

      func main() {
      	x := 1
      	p := &x
      	deep(100_000) // стек main вырастет и переедет
      	*p = 2
      	fmt.Println(x, deep(10))
      }
    options:
      - text: "2 10"
        correct: true
        explain: "Стек переехал, но `p` указывает на `x` в том же стеке, и рантайм при копировании исправил его на новый адрес. Код смены адреса не замечает."
      - text: "1 10"
        explain: "Так было бы, если бы `p` остался смотреть в старый стек. Рантайм исправляет все указатели внутрь стека, которые находит по картам стека."
      - text: "Программа упадёт: указатель на старый стек"
        explain: "Указатели внутрь стека при копировании исправляются. Устаревает только адрес, сохранённый в `uintptr`: это число, и рантайм его не трогает."

  - id: max-stack-default
    kind: output
    prompt: Что выведет программа на 64-битной системе?
    code: |
      package main

      import (
      	"fmt"
      	"runtime/debug"
      )

      func main() {
      	prev := debug.SetMaxStack(64 << 20)
      	fmt.Println(prev)
      }
    options:
      - text: "1000000000"
        correct: true
        explain: "`SetMaxStack` возвращает прежний лимит. По умолчанию на 64-битных системах это 10⁹ байт — «гигабайт» в десятичных единицах, так нагляднее в сообщении об ошибке."
      - text: "1073741824"
        explain: "Это 1 ГиБ (2³⁰). Рантайм нарочно задаёт лимит десятичным числом 1 000 000 000."
      - text: "67108864"
        explain: "Это новый лимит, 64 МиБ. Функция возвращает прежний."
      - text: "1048576"
        explain: "1 МиБ — порядок размера стека потока ОС, а не лимит стека горутины."

  - id: starting-size
    kind: single
    prompt: С каким стеком стартует новая горутина в только что запущенной программе на Linux, до первой сборки мусора?
    options:
      - text: "2 КБ"
        correct: true
        explain: "Минимальный стек — 2048 байт. После сборок мусора стартовый размер может вырасти до среднего размера стеков (адаптивный старт)."
      - text: "8 КБ"
        explain: "8 КБ — стартовый стек в Windows: туда добавляется 4 КБ на нужды системы, и размер округляется до степени двойки."
      - text: "1 МБ"
        explain: "Это порядок размера стека потока ОС. Горутины потому и дешёвые, что начинают с килобайт."
      - text: "64 КБ"
        explain: "Нет, стартовый стек — 2 КБ; 64 КБ получится только по ходу роста удвоением."

  - id: infinite-recursion
    kind: single
    prompt: "В обработчике HTTP бесконечная рекурсия, а в начале обработчика стоит `defer func() { recover() }()`. Что произойдёт?"
    options:
      - text: "Стек дорастёт до лимита, процесс завершится с fatal error: stack overflow и кодом 2"
        correct: true
        explain: "Переполнение стека — fatal error, а не паника: `recover` его не видит, отложенные функции не выполняются, падает весь сервер."
      - text: "recover перехватит панику, и обработчик вернёт 500"
        explain: "Паники нет: `newstack` вызывает `throw(\"stack overflow\")`, а не `panic`. Перехватить это нельзя."
      - text: "Горутина зависнет, остальные запросы продолжат обслуживаться"
        explain: "Рост стека не блокирует горутину — он кончается фатальной ошибкой процесса."
      - text: "Рантайм переключится на стек в куче и продолжит"
        explain: "Стек горутины и так в куче рантайма; предел — `maxstacksize` (по умолчанию 10⁹ байт)."

  - id: growth-facts
    kind: multiple
    prompt: Что верно о стеках горутин в современном Go?
    options:
      - text: "При нехватке места стек копируется в новый, вдвое больший"
        correct: true
        explain: "`newstack` удваивает размер и вызывает `copystack`."
      - text: "Указатели из кучи на переменные в стеке допустимы, рантайм их исправит"
        explain: "Таких указателей нет: escape analysis переносит в кучу всё, на что может сослаться куча. Поэтому рантайму достаточно исправить указатели внутри самого стека."
      - text: "Сборщик мусора может уменьшить стек горутины"
        correct: true
        explain: "Если горутина использует меньше четверти стека, при GC он ужимается вдвое, но не меньше 2 КБ."
      - text: "Стек растёт сегментами, связанными в список"
        explain: "Сегментированные стеки были до Go 1.3; их заменили непрерывные копируемые стеки из-за проблемы «hot split»."
