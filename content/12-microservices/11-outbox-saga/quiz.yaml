questions:
  - id: compensation-order
    kind: output
    prompt: "Что выведет программа?"
    code: |
      package main

      import (
      	"errors"
      	"fmt"
      	"slices"
      )

      type step struct {
      	name string
      	do   func() error
      }

      func main() {
      	ok := func() error { return nil }
      	steps := []step{{"reserve", ok}, {"order", ok}, {"pay", func() error { return errors.New("declined") }}, {"ship", ok}}
      	var done []string
      	for _, s := range steps {
      		if err := s.do(); err != nil {
      			for _, d := range slices.Backward(done) {
      				fmt.Print("undo:", d, " ")
      			}
      			break
      		}
      		done = append(done, s.name)
      	}
      	fmt.Println()
      }
    options:
      - text: "undo:order undo:reserve "
        correct: true
        explain: "Компенсируются только выполненные шаги и в обратном порядке. Упавший `pay` не выполнен, до `ship` дело не дошло."
      - text: "undo:reserve undo:order "
        explain: "`slices.Backward` идёт с конца: последний выполненный шаг откатывается первым."
      - text: "undo:pay undo:order undo:reserve "
        explain: "Упавший шаг в `done` не попал — его компенсировать нечего (его `Do` должен быть атомарным или идемпотентно безусловно компенсируемым)."

  - id: relay-partial
    kind: single
    prompt: "Relay отправил пачку событий с id 1, 2, 3 одним `ProduceSync`. Записи 1 и 3 подтверждены, запись 2 — ошибка. Что отметить опубликованным?"
    options:
      - text: "Только 1; события 2 и 3 уйдут в следующем проходе, 3 — повторно"
        correct: true
        explain: "Отмечаем по порядку id до первой неудачи. Повтор 3 — дубль, который потребитель отсечёт по `event-id`; зато порядок по ключу не нарушится, если 2 и 3 — события одного заказа."
      - text: "1 и 3: они же подтверждены"
        explain: "Тогда событие 3 может оказаться обработано раньше 2 того же заказа (2 уйдёт позже). Если порядок между ними неважен — допустимо, но общее правило — до первой неудачи."
      - text: "Ничего: пачка — всё или ничего"
        explain: "Без транзакции Kafka пачка не атомарна — 1 и 3 уже в топике. Не отметив 1, мы просто получим лишний дубль."

  - id: orchestration-vs-choreography
    kind: multiple
    prompt: "Что верно про хореографию и оркестрацию саг?"
    options:
      - text: "При оркестрации состояние саги хранится в одном месте, и его легко мониторить"
        correct: true
        explain: "Оркестратор знает, какие шаги выполнены, и может показать «зависшие» и `failed` саги."
      - text: "При хореографии сервисы реагируют на события друг друга без центрального координатора"
        correct: true
        explain: "Каждый слушает нужные события и публикует свои; ход процесса виден только по трассам."
      - text: "Оркестрация делает сагу атомарной, как транзакция"
        explain: "Ни один вариант не даёт изоляции: промежуточные состояния видны снаружи, а откат — это компенсирующие действия."
      - text: "Хореография исключает компенсации"
        explain: "Компенсации нужны в обоих вариантах; в хореографии их запускают сервисы по событиям вроде `payment.failed`."

  - id: idempotent-steps
    kind: single
    prompt: "Оркестратор выполнил шаг «резерв», упал до сохранения состояния и после перезапуска выполнил «резерв» снова. Как не зарезервировать товар дважды?"
    options:
      - text: "Шаг идемпотентен по id саги: повторный резерв с тем же id возвращает существующий резерв"
        correct: true
        explain: "Между шагом и сохранением всегда есть окно, поэтому повтор шага после сбоя неизбежен. Сервис склада хранит резерв по ключу саги (`INSERT ... ON CONFLICT DO NOTHING`)."
      - text: "Сохранять состояние до вызова шага"
        explain: "Тогда сбой после сохранения, но до шага, даст сагу, считающую шаг выполненным, — компенсация отменит несуществующий резерв, а продолжение пропустит нужный шаг."
      - text: "Идемпотентный продюсер Kafka решит это сам"
        explain: "Он отсекает только повторы сетевых запросов внутри одной сессии клиента, а не повтор бизнес-операции."

  - id: compensation-failed
    kind: single
    prompt: "Оплата отклонена, заказ отменён, но отмена резерва на складе падает каждый раз. Что должен сделать оркестратор?"
    options:
      - text: "Сохранить сагу в статусе failed с оставшимися компенсациями — и об этом должен узнать человек (метрика, алерт)"
        correct: true
        explain: "Полууспех автоматически не чинится. Состояние сохранено — после исправления склада сагу можно продолжить, и она дочистит оставшиеся компенсации."
      - text: "Повторять компенсацию в цикле без ограничений"
        explain: "Временные сбои стоит повторить пару раз с backoff, но бесконечный цикл скрывает проблему и держит ресурсы."
      - text: "Пометить сагу compensated — заказ же отменён"
        explain: "Резерв висит, товар недоступен для продажи. Скрытый полууспех хуже явного."
