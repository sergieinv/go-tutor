questions:
  - id: ldflags-x
    kind: single
    prompt: "В пакете `main` объявлены `var version = \"dev\"` и `const build = \"0\"`, а `main` печатает `fmt.Println(version, build)`. Программу собрали командой `go build -ldflags \"-X main.version=1.4.2 -X main.build=42\"`. Что она выведет?"
    options:
      - text: "1.4.2 0"
        correct: true
        explain: "`-X` подменяет только строковые **переменные** пакета (неинициализированные или инициализированные константной строкой). Константа встраивается компилятором, и линкер её не видит — флаг для неё молча игнорируется."
      - text: "1.4.2 42"
        explain: "`build` — константа: её значение подставлено при компиляции, линкеру подменять нечего."
      - text: "Сборка упадёт: main.build — константа"
        explain: "Линкер не проверяет, существует ли символ и можно ли его подменить: неподходящий `-X` просто игнорируется. Поэтому опечатку в пути (`main.Version` вместо `main.version`) легко не заметить."
  - id: liveness-db
    kind: single
    prompt: "Что проверять в liveness-пробе сервиса заказов с PostgreSQL?"
    options:
      - text: "Только то, что процесс отвечает: обработчик вернул 200"
        correct: true
        explain: "Провал liveness — перезапуск контейнера. Перезапуск помогает от зависшего процесса, но не от упавшей базы, поэтому зависимости в liveness не проверяют."
      - text: "`db.PingContext`: без базы сервис бесполезен"
        explain: "Тогда сбой базы перезапустит все поды по кругу — каскадный отказ. Зависимость, без которой нельзя обслужить запрос, проверяют в readiness: под выйдет из ротации, но не будет убит."
      - text: "Пинг базы, Redis и Kafka с таймаутом 10 секунд"
        explain: "Зависимости — в readiness, и только критичные. А таймаут пробы в 10 секунд значит, что под держит kubelet ожиданием дольше периода пробы."
  - id: shutdown-order
    kind: single
    prompt: "Под получил SIGTERM. В каком порядке действовать?"
    options:
      - text: "readiness → 503, пауза несколько секунд, `Shutdown` с таймаутом, затем закрыть БД и брокер"
        correct: true
        explain: "Балансировщики узнают об удалении пода с задержкой: пауза даёт им убрать под из ротации, пока он ещё обслуживает. `Shutdown` дожидается активных запросов, а зависимости закрываются последними — запросы ещё ими пользуются."
      - text: "Сразу `db.Close()`, потом `Shutdown`"
        explain: "Активные запросы получат ошибки «sql: database is closed» посреди работы."
      - text: "Сразу `Shutdown` — он сам дождётся запросов"
        explain: "`Shutdown` закрывает listener немедленно, а новые запросы ещё несколько секунд приходят от балансировщиков, не знающих об удалении пода, — они получат connection refused."
  - id: gomaxprocs-limit
    kind: single
    prompt: "Go 1.25 (в go.mod — `go 1.25`), Linux, узел на 32 ядра, у контейнера `requests.cpu: 1`, `limits.cpu: 3`, переменная `GOMAXPROCS` не задана. Чему будет равен `runtime.GOMAXPROCS(0)`?"
    options:
      - text: "3"
        correct: true
        explain: "С Go 1.25 рантайм учитывает лимит пропускной способности CPU в cgroup (его задаёт `limits.cpu`): меньшее из числа доступных CPU и лимита, округлённого вверх. Нужна строка `go 1.25`+ в go.mod: с более старой рантайм ведёт себя по-прежнему. Request на это не влияет."
      - text: "32"
        explain: "Так было до Go 1.25 (без `automaxprocs`) и так будет, если в go.mod версия ниже 1.25: рантайм видит все ядра узла и упирается в троттлинг CFS."
      - text: "1"
        explain: "Учитывается limit, а не request. К тому же нижняя граница по лимиту — 2."
  - id: secret-delivery
    kind: multiple
    prompt: "Как правильно доставить пароль БД сервису в Kubernetes?"
    options:
      - text: "Secret, смонтированный файлом в том, путь к файлу — в переменной окружения"
        correct: true
        explain: "Файл можно перечитать при ротации, он не виден в `/proc/<pid>/environ` и в выводе окружения."
      - text: "Secret через переменную окружения (`valueFrom.secretKeyRef`)"
        correct: true
        explain: "Тоже допустимо: секрета нет ни в образе, ни в манифесте. Минусы — смена требует перезапуска пода, а окружение легче случайно залогировать."
      - text: "`ENV DB_PASSWORD=...` в Dockerfile"
        explain: "Секрет навсегда в слое образа: виден через `docker history` и `docker inspect` всем, кто может скачать образ."
      - text: "`ARG DB_PASSWORD` и `--build-arg` при сборке"
        explain: "Аргументы сборки тоже попадают в метаданные образа и историю. Секреты нужны при запуске, а не при сборке."
