questions:
  - id: status-code-unwrap
    kind: output
    prompt: Что выведет программа?
    code: |
      package main

      import (
      	"context"
      	"fmt"

      	"google.golang.org/grpc/codes"
      	"google.golang.org/grpc/status"
      )

      func main() {
      	err := fmt.Errorf("reserve: %w", status.Error(codes.Unavailable, "down"))
      	fmt.Println(status.Code(err), status.Code(context.DeadlineExceeded), status.Code(nil))
      }
    options:
      - text: "Unavailable Unknown OK"
        correct: true
        explain: "`status.Code` находит статус и под обёрткой `%w`. Ошибка контекста — не gRPC-статус, поэтому `Unknown`: клиент gRPC сам превращает истёкший контекст вызова в `DeadlineExceeded`, но голый `context.DeadlineExceeded` из вашего кода так не классифицируется. Для `nil` — `OK`."
      - text: "Unknown DeadlineExceeded OK"
        explain: "Обёртка не мешает: `status.Code` ищет статус через `errors.As`. А `context.DeadlineExceeded` в код gRPC переводит `status.FromContextError`, не `status.Code`."
      - text: "Unavailable DeadlineExceeded Unknown"
        explain: "Для ошибки контекста `status.Code` возвращает `Unknown`, а для `nil` — `OK`, а не `Unknown`."

  - id: full-jitter-cap
    kind: output
    prompt: "Функция считает предел паузы для полного джиттера (сама пауза — `rand` × предел). Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func limit(base, maxDelay time.Duration, attempt int) time.Duration {
      	return min(base<<(attempt-1), maxDelay)
      }

      func main() {
      	for _, n := range []int{1, 3, 5, 64} {
      		fmt.Print(limit(100*time.Millisecond, time.Second, n), " ")
      	}
      	fmt.Println()
      }
    options:
      - text: "100ms 400ms 1s 0s "
        correct: true
        explain: "Пределы 100, 400 и 1600 мс → потолок 1 с. А на 64-й попытке сдвиг `<< 63` выталкивает все значащие биты: получается 0, и `min` выбирает его. Пауза ноль — повторы без ожидания, именно когда сосед лежит дольше всего. Удваивайте в цикле до потолка или ограничьте показатель."
      - text: "100ms 400ms 1s 1s "
        explain: "Так должно быть, но сдвиг `int64` на 63 разряда переполняется: `100ms << 63` — это 0, а `min(0, 1s)` — 0."
      - text: "100ms 300ms 500ms 6.4s "
        explain: "Предел растёт экспоненциально (удваивается), а не линейно, и не может быть больше `maxDelay`."

  - id: create-order-timeout
    kind: single
    prompt: "`CreateOrder` вернул `DeadlineExceeded`: таймаут истёк, пока ждали ответ. Ключа идемпотентности в контракте нет. Как поступить?"
    options:
      - text: "Не повторять автоматически: заказ мог быть создан, а ответ потерян. Нужен ключ идемпотентности"
        correct: true
        explain: "Таймаут на стороне клиента ничего не говорит о том, выполнил ли сервер работу. Без ключа повтор может создать второй заказ. С ключом (`idempotency-key` в metadata, один на все попытки) сервер вернёт уже созданный заказ."
      - text: "Повторить с тем же запросом: gRPC гарантирует, что после `DeadlineExceeded` сервер операцию откатил"
        explain: "Такой гарантии нет. Сервер получает отмену контекста, но мог уже зафиксировать транзакцию. Отмена — подсказка «можно бросить», а не откат."
      - text: "Повторить, но с вдвое большим таймаутом"
        explain: "Больший таймаут не решает проблему двойного создания. И у повтора есть потолок — дедлайн запроса пользователя."

  - id: storm
    kind: single
    prompt: "Цепочка из четырёх сервисов, каждый вызывает следующий и повторяет до 3 раз (всего 3 попытки). Последний сервис лежит. Сколько запросов он получит на один запрос пользователя?"
    options:
      - text: "27"
        correct: true
        explain: "Повторяют три клиента: первый, второй и третий сервис. 3 × 3 × 3 = 27. Каждый новый слой с повторами умножает нагрузку — поэтому повторяют в одном месте и держат бюджет повторов."
      - text: "81"
        explain: "Четыре сервиса — это три вызова между ними: четвёртый никого не вызывает, его повторы ни на что не влияют. 3³ = 27."
      - text: "9"
        explain: "Множитель каждого слоя — число попыток, а слоёв с повторами три: 3³."
      - text: "12"
        explain: "Повторы вложены друг в друга, поэтому попытки перемножаются, а не складываются."

  - id: what-limits
    kind: multiple
    prompt: "Что правильно в политике повторов вызова соседа?"
    options:
      - text: "Перед паузой проверить, что `now + пауза` не позже дедлайна контекста"
        correct: true
        explain: "Повтор после дедлайна никому не нужен: вызывающий уже получил ошибку. Лучше вернуть её сразу."
      - text: "Если сервер прислал `RetryInfo`, ждать столько, сколько он просит"
        correct: true
        explain: "Сервер знает о своей нагрузке больше клиента. Экспонента — запасной вариант, когда подсказки нет."
      - text: "Бюджет повторов: когда неудач много, повторы отключаются"
        correct: true
        explain: "Это защита от шторма: при лежащем соседе клиент делает по одной попытке на запрос, и нагрузка не умножается."
      - text: "Повторять и `InvalidArgument`: вдруг сервер обновился и теперь примет запрос"
        explain: "Ответ на тот же запрос не изменится. Повтор только задержит ошибку и добавит нагрузки."
      - text: "Пауза через `time.Sleep`: так проще тестировать"
        explain: "Наоборот: `time.Sleep` не прерывается отменой и не подменяется в тестах. Ждите через `select` с `ctx.Done()`, а функцию сна внедряйте."
