questions:
  - id: offsets-per-partition
    kind: output
    prompt: "Топик из трёх партиций, ключи `A-1`, `B-2`, `C-3` попадают в разные партиции. Что выведет программа?"
    code: |
      package main

      import (
      	"context"
      	"fmt"
      	"log"

      	"github.com/twmb/franz-go/pkg/kfake"
      	"github.com/twmb/franz-go/pkg/kgo"
      )

      func main() {
      	ctx := context.Background()
      	c, err := kfake.NewCluster(kfake.NumBrokers(1), kfake.SeedTopics(3, "t"))
      	if err != nil {
      		log.Fatal(err)
      	}
      	defer c.Close()
      	cl, err := kgo.NewClient(kgo.SeedBrokers(c.ListenAddrs()...))
      	if err != nil {
      		log.Fatal(err)
      	}
      	defer cl.Close()

      	for _, key := range []string{"A-1", "B-2", "A-1", "C-3", "A-1"} {
      		r, err := cl.ProduceSync(ctx, &kgo.Record{Topic: "t", Key: []byte(key)}).First()
      		if err != nil {
      			log.Fatal(err)
      		}
      		fmt.Print(r.Offset, " ")
      	}
      	fmt.Println()
      }
    options:
      - text: "0 0 1 0 2"
        correct: true
        explain: "Офсет — номер записи в своей партиции, а не в топике. Все записи `A-1` лежат в одной партиции и получают 0, 1, 2; первые записи `B-2` и `C-3` в своих партициях — по 0."
      - text: "0 1 2 3 4"
        explain: "Так было бы, если бы офсет был сквозным номером по топику. У каждой партиции своя последовательность офсетов."
      - text: "0 0 0 0 0"
        explain: "Записи с одним ключом попадают в одну партицию и дописываются в её конец — офсеты растут: 0, 1, 2."

  - id: add-partitions
    kind: single
    prompt: "В топике 3 партиции, события заказов идут с ключом — id заказа. Партиций стало 6. Что произойдёт с порядком событий заказа `A-1`, у которого уже есть события?"
    options:
      - text: "Новые события `A-1` могут попасть в другую партицию, и на стыке порядок не гарантирован"
        correct: true
        explain: "Партиция — `murmur2(key) % число_партиций`. При другом делителе ключ может перейти в новую партицию; потребитель этой партиции может обработать новые события раньше, чем старые из прежней. Поэтому число партиций выбирают с запасом сразу."
      - text: "Kafka перенесёт старые записи `A-1` в новую партицию"
        explain: "Записи в партиции неизменяемы и никуда не переезжают. Меняется только выбор партиции для новых записей."
      - text: "Ничего: ключ навсегда закреплён за партицией"
        explain: "Закрепления нет — партицию на каждую запись вычисляет продюсер по текущему числу партиций."

  - id: ordering-guarantee
    kind: multiple
    prompt: "Потребителю важно видеть события одного заказа в порядке записи. Что для этого нужно?"
    options:
      - text: "Ключ записи — id заказа"
        correct: true
        explain: "Одинаковый ключ — одна партиция, а внутри партиции порядок сохраняется."
      - text: "Записи одной партиции потребитель обрабатывает последовательно, в порядке офсетов"
        correct: true
        explain: "Каждую партицию в группе читает один участник, и клиент отдаёт её записи по возрастанию офсетов. Если же раскидать записи одной партиции по горутинам, порядок сломает сам потребитель (урок 9)."
      - text: "Тип события в качестве ключа, чтобы все `created` шли подряд"
        explain: "Тогда «создан» и «оплачен» одного заказа окажутся в разных партициях, и порядок между ними не гарантирован."
      - text: "Одна партиция на весь топик"
        explain: "Порядок будет, но ценой параллельности: одну партицию в группе читает один участник. Глобальный порядок почти никогда не нужен — нужен порядок по сущности."

  - id: produce-no-flush
    kind: single
    prompt: "Сервис отправляет события через `cl.Produce(ctx, rec, nil)` в цикле и сразу выходит из `main` с `defer cl.Close()`. Что не так?"
    options:
      - text: "Часть записей может не уйти, и об ошибках отправки никто не узнает"
        correct: true
        explain: "`Produce` кладёт запись в буфер и возвращается сразу. Без `cl.Flush(ctx)` перед закрытием недоотправленное пропадёт, а колбэк `nil` глотает ошибки. Нужны колбэк с обработкой ошибки и `Flush` при остановке — или `ProduceSync`."
      - text: "Ничего: `Produce` блокируется до подтверждения брокера"
        explain: "Блокируется `ProduceSync`. `Produce` асинхронный — он блокирует только когда буфер переполнен."
      - text: "Записи уйдут в случайные партиции"
        explain: "Партиция определяется ключом и не зависит от способа отправки."

  - id: mixed-partitioner
    kind: single
    prompt: "Сервис на C# с Confluent.Kafka по умолчанию и сервис на Go с franz-go пишут события одного заказа с одним и тем же ключом в один топик. Что может пойти не так?"
    options:
      - text: "События попадут в разные партиции: у librdkafka по умолчанию другой хеш ключа"
        correct: true
        explain: "Партиционер librdkafka по умолчанию — `consistent_random` (CRC32), а franz-go и Java-клиент используют `murmur2`. В C# ставят `Partitioner = Partitioner.Murmur2Random`, иначе порядок по заказу разъедется."
      - text: "Ничего: партицию выбирает брокер по ключу"
        explain: "Партицию выбирает клиент-продюсер, брокер лишь записывает в указанную. Поэтому хеш у всех продюсеров одного топика должен совпадать."
      - text: "Брокер отклонит записи от клиентов на разных языках"
        explain: "Протокол один, брокеру всё равно, на чём написан клиент."
