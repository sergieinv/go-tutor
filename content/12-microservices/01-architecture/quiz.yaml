questions:
  - id: status-code-wrapped
    kind: output
    prompt: "«Заказы» получили ошибку от «Склада» и решают, какой HTTP-статус вернуть. Что выведет программа?"
    code: |
      package main

      import (
      	"errors"
      	"fmt"

      	"google.golang.org/grpc/codes"
      	"google.golang.org/grpc/status"
      )

      func main() {
      	reserve := status.Error(codes.FailedPrecondition, "not enough tea")
      	wrapped := fmt.Errorf("place order: %w", reserve)
      	plain := errors.New("connection reset")
      	fmt.Println(status.Code(reserve), status.Code(wrapped), status.Code(plain), status.Code(nil))
      }
    options:
      - text: "FailedPrecondition FailedPrecondition Unknown OK"
        correct: true
        explain: "`status.Code` ищет статус через `errors.As` по цепочке обёрток, поэтому `%w` его не прячет. Ошибка без статуса — `Unknown`, `nil` — `OK`. Значит, переводить код в HTTP-статус можно и после того, как слой выше обернул ошибку."
      - text: "FailedPrecondition Unknown Unknown OK"
        explain: "Так было до grpc-go 1.55 (2023). Сейчас `status.FromError` и `status.Code` разворачивают обёртки `%w` и находят статус внутри."
      - text: "FailedPrecondition FailedPrecondition Internal OK"
        explain: "Ошибка, не созданная пакетом `status`, получает код `Unknown`, а не `Internal`."
      - text: "FailedPrecondition FailedPrecondition Unknown Unknown"
        explain: "Для `nil` `status.Code` возвращает `OK`: нет ошибки — успешный вызов."

  - id: data-ownership
    kind: single
    prompt: "Аналитику нужен отчёт «заказы с остатком товара на момент заказа». Как правильнее получить остаток в системе из этого урока?"
    options:
      - text: "«Склад» публикует события об изменении остатка, а отчётный сервис строит из них свою таблицу"
        correct: true
        explain: "Данные «Склада» меняет и читает только «Склад». Тем, кому нужен срез его данных, он отдаёт их через контракт: синхронным вызовом или событиями, из которых потребитель строит свою копию."
      - text: "Отчётный сервис читает таблицу `stock` из MySQL «Склада» напрямую — только чтение ничего не сломает"
        explain: "Чтение тоже делает схему общей: «Склад» больше не может переименовать колонку или разбить таблицу, не сломав чужой отчёт. Это распределённый монолит."
      - text: "«Заказы» при каждом заказе пишут остаток в свою базу и в базу «Склада»"
        explain: "Две записи в две базы без общей транзакции рано или поздно разойдутся, а «Заказы» начинают владеть чужими данными."
      - text: "Объединить базы «Заказов» и «Склада» в одну, чтобы делать JOIN"
        explain: "Так пропадает смысл деления: сервисы снова нельзя менять и разворачивать независимо."

  - id: sync-vs-async
    kind: multiple
    prompt: "Какие шаги создания заказа разумно делать синхронным вызовом, дожидаясь ответа, прежде чем ответить клиенту?"
    options:
      - text: "Резерв товара на «Складе»"
        correct: true
        explain: "Без резерва заказ создавать нельзя: от ответа зависит, что вернуть клиенту, — 201 или 409."
      - text: "Проверка, что покупатель существует и не заблокирован"
        correct: true
        explain: "Результат нужен до ответа: заказ заблокированного покупателя принимать нельзя."
      - text: "Письмо покупателю «заказ принят»"
        explain: "Ответ клиенту от письма не зависит. Синхронный вызов только свяжет доступность: лёг почтовый сервис — не создаются заказы. Это событие."
      - text: "Обновление витрины аналитики"
        explain: "Аналитике достаточно события; несколько секунд задержки ей не мешают, а лишний синхронный сосед снижает доступность заказов."

  - id: idempotent-reserve
    kind: single
    prompt: "«Заказы» вызвали `Reserve` с дедлайном 2 с и получили `DeadlineExceeded`. Почему `Reserve` принимает `order_id` и должен быть идемпотентным по нему?"
    options:
      - text: "Таймаут не значит отказ: склад мог успеть списать товар, и повторный вызов с тем же id не должен списать его второй раз"
        correct: true
        explain: "Клиент не знает, дошёл ли запрос: ответ мог потеряться по дороге. Повторять безопасно только идемпотентную операцию — поэтому резерв привязан к id заказа, а повтор с тем же id возвращает успех без нового списания."
      - text: "Чтобы склад мог отсортировать резервы по времени создания"
        explain: "Порядок резервов здесь ни при чём; id нужен, чтобы распознать повтор того же запроса."
      - text: "gRPC требует уникальный идентификатор в каждом сообщении"
        explain: "Такого требования нет: идентификатор — часть нашего контракта, а не протокола."
      - text: "Не нужен: после `DeadlineExceeded` склад гарантированно откатывает резерв"
        explain: "Дедлайн клиента не откатывает уже закоммиченное на сервере. Сервер увидит отмену контекста, только если ещё не закончил работу."
