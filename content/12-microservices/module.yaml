title: Микросервисы
summary: Сервис из модуля 10 становится системой из трёх — наблюдаемость (slog, OpenTelemetry, Prometheus), устойчивость (повторы, circuit breaker, дедлайны), Kafka на franz-go, outbox и saga, Docker и k8s.
goals:
  - "Видеть, что происходит в системе: структурные логи, трассировка через сервисы, метрики RED."
  - "Переживать сбои соседей: повторы с backoff, circuit breaker, проброс дедлайна, идемпотентность."
  - "Обмениваться событиями через Kafka: ключи и порядок, группы потребителей, at-least-once, DLQ, outbox."
  - "Собирать маленькие образы и запускать сервисы в Kubernetes с правильными пробами и остановкой."
