questions:
  - id: idempotent-default
    kind: output
    prompt: "Что выведет программа? Брокер не нужен: ошибку возвращает проверка конфигурации."
    code: |
      package main

      import (
      	"fmt"

      	"github.com/twmb/franz-go/pkg/kgo"
      )

      func main() {
      	_, err := kgo.NewClient(kgo.SeedBrokers("127.0.0.1:1"), kgo.RequiredAcks(kgo.LeaderAck()))
      	fmt.Println(err != nil)
      	cl, err := kgo.NewClient(kgo.SeedBrokers("127.0.0.1:1"), kgo.RequiredAcks(kgo.LeaderAck()), kgo.DisableIdempotentWrite())
      	fmt.Println(err != nil)
      	cl.Close()
      }
    options:
      - text: "true\nfalse"
        correct: true
        explain: "Продюсер kgo идемпотентен по умолчанию, а идемпотентность требует `acks=all` — первый клиент не создаётся (`idempotency requires acks=all`). С `DisableIdempotentWrite` клиент с `acks=1` допустим, но повтор после потерянного ответа запишет дубль, а запись, подтверждённая только лидером, пропадёт при его падении."
      - text: "false\nfalse"
        explain: "`acks=1` несовместим с идемпотентностью, которая в kgo включена, пока её явно не выключили."
      - text: "true\ntrue"
        explain: "Без идемпотентности `acks=1` разрешён — второй клиент создаётся."

  - id: lost-ack
    kind: single
    prompt: "Брокер записал пачку, но ответ продюсеру потерялся, и клиент повторил запрос. Сколько копий записи окажется в партиции у идемпотентного продюсера kgo?"
    options:
      - text: "Одна: брокер узнает повтор по id продюсера и номеру последовательности"
        correct: true
        explain: "Идемпотентный продюсер нумерует пачки в каждой партиции, брокер помнит последние номера и отбрасывает повтор, отвечая успехом. Пример урока воспроизводит это через `kfake.Fault` с `REQUEST_TIMED_OUT`."
      - text: "Две: повтор — новое сообщение"
        explain: "Так ведёт себя продюсер с `DisableIdempotentWrite` — пример урока показывает именно это."
      - text: "Ни одной: брокер откатит запись, раз ответ не дошёл"
        explain: "Брокер не знает, что ответ потерялся; записанное остаётся записанным."

  - id: app-level-retry
    kind: single
    prompt: "Relay outbox отправил событие, упал до отметки «опубликовано» и после перезапуска отправил его снова тем же идемпотентным продюсером kgo. Что увидит потребитель?"
    options:
      - text: "Событие дважды — дубль отсекает только сам потребитель по id события"
        correct: true
        explain: "Идемпотентность продюсера действует в пределах одной сессии клиента: новый процесс получает новый id продюсера, и для брокера повтор — новое сообщение. Поэтому у событий есть `event-id`, а у потребителя — таблица обработанных."
      - text: "Событие один раз: идемпотентный продюсер не пишет дубли"
        explain: "Он отсекает повторы, которые клиент делает сам при сбоях сети. Повтор из кода приложения после перезапуска для брокера неотличим от нового события."
      - text: "Ошибку `DUPLICATE_SEQUENCE_NUMBER`"
        explain: "У нового процесса свой id продюсера и своя нумерация — конфликта номеров нет."

  - id: poison-message
    kind: multiple
    prompt: "В партиции оказалось событие с битым JSON. Что из этого правильно?"
    options:
      - text: "Не повторять: ошибка данных постоянная — сразу в DLQ с причиной в заголовках"
        correct: true
        explain: "Повторы не починят данные, а бесконечные повторы остановят всю партицию."
      - text: "Коммитить исходную запись только после того, как DLQ подтвердил запись"
        correct: true
        explain: "Иначе при сбое отправки в DLQ сообщение пропадёт бесследно."
      - text: "Повторять, пока не получится, — at-least-once же"
        explain: "At-least-once — про то, что не теряем; бесконечный повтор ядовитого сообщения блокирует все события партиции за ним."
      - text: "Пропустить и закоммитить — одно событие погоды не делает"
        explain: "Это потеря события. Для разбора и переотправки его откладывают в DLQ."

  - id: dedup-key
    kind: single
    prompt: "Потребитель дедуплицирует события заказов. По какому значению?"
    options:
      - text: "По уникальному id события (заголовок `event-id`)"
        correct: true
        explain: "Id события одинаков у всех копий одного события и различается у разных событий одного заказа."
      - text: "По ключу записи — id заказа"
        explain: "У заказа много событий: «оплачен» после «создан» был бы отброшен как дубль."
      - text: "По паре партиция+офсет"
        explain: "Повторная отправка из outbox или продюсер без идемпотентности дадут ту же запись с другим офсетом — дубль пройдёт."
