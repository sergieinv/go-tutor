questions:
  - id: cells-touched
    kind: output
    prompt: "Сколько ячеек 16×16 смотрит запрос радиуса 16 и радиуса 8 из точки (0, 0)? Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"math"
      )

      func cells(x, z, r, size float64) int {
      	lo := int(math.Floor((x - r) / size))
      	hi := int(math.Floor((x + r) / size))
      	loZ := int(math.Floor((z - r) / size))
      	hiZ := int(math.Floor((z + r) / size))
      	return (hi - lo + 1) * (hiZ - loZ + 1)
      }

      func main() {
      	fmt.Println(cells(0, 0, 16, 16), cells(0, 0, 8, 16))
      }
    options:
      - text: "9 4"
        correct: true
        explain: "При r = 16 квадрат запроса — от −16 до 16: ячейки −1, 0 и 1 по каждой оси, 3×3. При r = 8 — от −8 до 8: ячейки −1 и 0, 2×2. Это не случайность точки: при включённых границах ячейка, равная радиусу, всегда даёт 3×3 = 9 ячеек, равная диаметру — всегда 2×2 = 4; ячейка больше диаметра — от 1 до 4."
      - text: "4 1"
        explain: "Точка (0, 0) лежит на углу четырёх ячеек: даже маленький запрос вокруг неё задевает ячейки −1 и 0 по обеим осям."
      - text: "9 9"
        explain: "При r = 8 квадрат запроса [−8, 8] не дотягивает до ячейки 1 (она начинается с 16): по каждой оси две ячейки."
      - text: "4 4"
        explain: "Граница x + r = 16 лежит ровно в начале ячейки 1, а `floor(16/16) = 1`: включённая граница добавляет ещё ряд ячеек."

  - id: swap-remove
    kind: output
    prompt: "Удаление из списка ячейки «поменять с последним». Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	list := []int{1, 2, 3, 4, 5}
      	i := 1 // удаляем элемент 2
      	list[i] = list[len(list)-1]
      	list = list[:len(list)-1]
      	fmt.Println(list)
      }
    options:
      - text: "[1 5 3 4]"
        correct: true
        explain: "На место удаляемого встаёт последний, срез укорачивается на один: O(1) вместо сдвига хвоста. Порядок в ячейке меняется — поэтому сущность хранит свою позицию в списке (`slot`), и у переехавшего последнего её надо обновить."
      - text: "[1 3 4 5]"
        explain: "Так работает `slices.Delete`: сдвигает хвост и сохраняет порядок, но за O(n). Здесь на место удалённого встал последний элемент."
      - text: "[1 5 3 4 5]"
        explain: "Срез укорочен `list[:len(list)-1]`, поэтому последний элемент (его копия уже на месте i) в длину не входит."
      - text: "[5 1 3 4]"
        explain: "Последний элемент переходит ровно на место удалённого (индекс 1), остальные не двигаются."

  - id: cell-size
    kind: single
    prompt: "Сервер чаще всего ищет сущности в радиусе 8 блоков. Какой размер ячейки разумен для начала?"
    options:
      - text: "Порядка радиуса или диаметра запроса — 8–16 блоков, дальше уточнить бенчмарком"
        correct: true
        explain: "Тогда запрос смотрит 4–9 ячеек, а лишних кандидатов немного. Точное значение зависит от плотности сущностей — его подбирают бенчмарком на реальном распределении."
      - text: "1 блок: чем мельче ячейки, тем точнее"
        explain: "Точность не меняется — результат и так точный после проверки расстояния. Зато запрос радиуса 8 обходит 17×17 = 289 ячеек, в основном пустых, и на каждую — поиск в map."
      - text: "256 блоков: меньше ячеек — меньше map"
        explain: "Запрос задевает 1–4 огромных ячейки, и в них — почти все сущности окрестности на сотни блоков: вернулись к полному перебору."
      - text: "Неважно, на результат размер не влияет"
        explain: "На результат — нет, на стоимость — сильно: слишком мелкие ячейки дают много пустых обращений к map, слишком крупные — много лишних проверок расстояния."

  - id: flat-vs-map
    kind: multiple
    prompt: "Что верно о плоской сетке (срезы `cellStart`/`items`, пересобираемые каждый тик) по сравнению с `map[cellKey][]int32`?"
    options:
      - text: "Плоской сетке нужен ограниченный мир: индекс ячейки — `z*W + x`"
        correct: true
        explain: "Срез индексируется номером ячейки, поэтому размеры сетки известны заранее. Бесконечный мир Minecraft так не ляжет целиком — плоскую сетку делают на чанк или на регион."
      - text: "В плоской сетке нет указателей: GC не сканирует её содержимое"
        correct: true
        explain: "Срезы `[]int32` без указателей GC не просматривает. У `map[cellKey][]int32` каждый список — заголовок среза с указателем, и сборщик просматривает их все при каждой маркировке (урок 14-highload/17)."
      - text: "Плоскую сетку нельзя обновлять при перемещении — только пересобирать"
        correct: true
        explain: "В варианте с `cellStart`/`items` (сортировка подсчётом) списки ячеек лежат вплотную, и вставить в середину нельзя. Пересборка — O(N) за тик и без аллокаций: два прохода по сущностям."
      - text: "map быстрее плоской сетки на любом запросе"
        explain: "Наоборот: индекс в срезе дешевле хеширования ключа, а данные плоской сетки лежат подряд. map выигрывает памятью на разреженном или бесконечном мире."
