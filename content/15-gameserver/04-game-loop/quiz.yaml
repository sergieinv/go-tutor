questions:
  - id: catch-up-schedule
    kind: output
    prompt: "Цикл с накопителем на фейковом времени: тик 2 длится 230 мс, остальные — по 10 мс, догонять не больше двух тиков. В какие моменты (мс) начинаются первые шесть тиков?"
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      func main() {
      	const interval = 50 * time.Millisecond
      	const maxCatchUp = 2
      	var now, next time.Duration
      	var starts []int64
      	for len(starts) < 6 {
      		due := 0
      		if now >= next {
      			due = int((now-next)/interval) + 1
      		}
      		if due > maxCatchUp {
      			next += time.Duration(due-maxCatchUp) * interval
      			due = maxCatchUp
      		}
      		for range due {
      			starts = append(starts, now.Milliseconds())
      			if len(starts) == 2 {
      				now += 230 * time.Millisecond
      			} else {
      				now += 10 * time.Millisecond
      			}
      			next += interval
      		}
      		if next > now {
      			now = next // сон до следующего тика
      		}
      	}
      	fmt.Println(starts)
      }
    options:
      - text: "[0 50 280 290 300 350]"
        correct: true
        explain: "Тик 2 закончился в 280. К этому моменту наступили тики 100, 150, 200 и 250 — `due = 4`. Догоняем два: самые старые (100 и 150) отброшены, тики 200 и 250 выполнены подряд в 280 и 290. После них `next = 300`, тик 290 закончился ровно в 300 — сна нет, тик по сетке в 300, затем в 350."
      - text: "[0 50 280 290 300 310]"
        explain: "Так было бы без лимита: все четыре наступивших тика подряд. `maxCatchUp = 2` отбрасывает два самых старых, поэтому после 280 и 290 цикл возвращается на сетку — 300 и 350."
      - text: "[0 50 280 300 350 400]"
        explain: "Это поведение `time.Ticker`: один тик ждёт в канале и выполняется в 280, остальные выброшены. Накопитель догоняет — здесь до двух тиков подряд."
      - text: "[0 50 280 330 380 430]"
        explain: "Так ведёт себя цикл, который планирует следующий тик от начала текущего (`next = start + interval`): после тяжёлого тика сетка уезжает на 30 мс и уже не возвращается, а пропущенные тики просто теряются. Накопитель держит сетку `start + k·interval`."

  - id: ticker-slow-receiver
    kind: single
    prompt: "Горутина мира читает `time.NewTicker(50 * time.Millisecond).C`, и один тик длился 180 мс. Что произойдёт с тиками, наступившими за это время?"
    options:
      - text: "В канале дождётся одно значение, остальные выброшены; следующие тики — по исходной сетке"
        correct: true
        explain: "Тикер хранит не больше одного наступившего тика: в `time/tick.go` внутренний буфер канала — одно значение (снаружи с Go 1.23 `cap(tk.C) == 0`, значение рантайм кладёт лениво при чтении), а в `runtime/time.go` следующее время срабатывания — `when + period·(1 + delay/period)`, то есть ближайшая точка той же сетки. Пропущенные тики не копятся и не догоняются."
      - text: "Все три пропущенных значения ждут в канале, и горутина получит их подряд"
        explain: "Тикер держит не больше одного значения (внутри `NewTicker` — `make(chan Time, 1)`; с Go 1.23 это скрыто: `cap(tk.C)` возвращает 0), лишние отправки уходят в `default` и теряются."
      - text: "Тикер сдвинет сетку: следующий тик придёт через 50 мс после того, как горутина прочитала канал"
        explain: "Сетка не сдвигается: следующее срабатывание считается от запланированного времени (`t.when`), а не от момента чтения."
      - text: "Отправка в канал заблокирует таймеры рантайма, пока горутина не прочитает значение"
        explain: "Таймеры рантайма никогда не блокируются на отправке: `sendTime` шлёт через `select` с `default`."

  - id: who-reply-buffer
    kind: single
    prompt: "Горутина мира отвечает на запрос `Who` так: `c.Reply <- names`. Почему канал `Reply` создают с буфером 1: `make(chan []string, 1)`?"
    options:
      - text: "Мир не должен ждать спросившего: с буфером отправка завершается сразу, даже если тот ещё не читает или уже ушёл"
        correct: true
        explain: "Без буфера отправка ждёт получателя. Соединение, которое закрылось, не дождавшись ответа, навсегда остановит горутину мира — а с ней весь сервер. Буфер 1 гарантирует, что ровно одна отправка не блокируется."
      - text: "Без буфера ответ может потеряться"
        explain: "Отправка в небуферизованный канал ничего не теряет — она ждёт получателя. Проблема как раз в ожидании."
      - text: "Буфер ускоряет передачу среза: он копируется в канал целиком"
        explain: "В канал копируется заголовок среза (три слова) в обоих случаях. Буфер нужен ради того, чтобы мир не блокировался."

  - id: world-goroutine-rules
    kind: multiple
    prompt: "Что можно делать в горутине мира внутри тика?"
    options:
      - text: "Вычерпать входной канал через `select` с `default`, не больше N команд"
        correct: true
        explain: "Ввод собирается без ожидания, а лимит не даёт потоку команд растянуть тик."
      - text: "Положить исходящий пакет в ограниченную очередь соединения через `select` с `default`"
        correct: true
        explain: "Неблокирующая отправка: медленный клиент переполнит свою очередь и будет отключён, а тик пойдёт дальше (урок 05)."
      - text: "Записать пакет прямо в `net.Conn` каждого игрока"
        explain: "`Write` блокируется, когда буфер сокета медленного клиента полон. Один игрок на плохом Wi-Fi остановит мир для всех."
      - text: "Синхронно сохранить мир на диск, раз в пять минут"
        explain: "Запись на диск длится сотни миллисекунд — это десяток пропущенных тиков. Снапшот снимают в тике дёшево, а пишут в другой горутине (урок 10)."
      - text: "Взять `sync.Mutex`, который держит горутина соединения на время чтения из сокета"
        explain: "Чтение из сокета ждёт клиента сколько угодно — значит, и мир будет ждать. Состояние мира принадлежит одной горутине, мьютексы с горутинами соединений не делят."

  - id: mspt-tps
    kind: single
    prompt: "Сервер с тиком 50 мс показывает MSPT 70 мс в среднем, а цикл догоняет без лимита. Что видят игроки?"
    options:
      - text: "Мир идёт медленнее: в лучшем случае около 14 тиков в секунду вместо 20, отставание растёт без предела"
        correct: true
        explain: "1000 / 70 ≈ 14,3 TPS — больше тиков в секунду при таком MSPT не выполнить. Догонять нечем: каждый тик дольше бюджета, отставание только растёт. Поэтому догоняние ограничивают и в какой-то момент отбрасывают накопленное, а причину ищут профилем тика (урок 06)."
      - text: "Ничего: цикл догоняет, и в среднем выходит 20 TPS"
        explain: "Догонять можно только за счёт запаса: тиков, которые короче бюджета. При MSPT больше 50 мс запаса нет."
      - text: "Сервер отключит игроков по таймауту keep-alive"
        explain: "Keep-alive в Minecraft считается в секундах: ванильный сервер шлёт его примерно раз в 15 секунд и ждёт ответа заметно дольше. Задержка тика на 20 мс его не задевает — игроки видят замедление мира, а не отключение."
