questions:
  - id: varint-bytes
    kind: output
    prompt: "Сколько байт займут числа в формате VarInt Minecraft? Что выведет программа?"
    code: |
      package main

      import "fmt"

      func appendVarInt(b []byte, v int32) []byte {
      	u := uint32(v)
      	for u >= 0x80 {
      		b = append(b, byte(u)|0x80)
      		u >>= 7
      	}
      	return append(b, byte(u))
      }

      func main() {
      	for _, v := range []int32{127, 128, 2097151, -1} {
      		fmt.Print(len(appendVarInt(nil, v)), " ")
      	}
      	fmt.Println()
      }
    options:
      - text: "1 2 3 5 "
        correct: true
        explain: "127 — 7 бит, один байт; 128 требует восьмого бита — два байта; 2097151 = 2²¹−1 — ровно три байта (это и есть предел длины пакета Minecraft). −1 кодируется как `uint32` `0xffffffff` — все 32 бита, пять байт."
      - text: "1 2 3 1 "
        explain: "VarInt Minecraft — не zigzag. Отрицательное `int32` превращается в `uint32` с установленным старшим битом и всегда занимает 5 байт."
      - text: "1 1 3 5 "
        explain: "В байте VarInt только 7 бит данных, восьмой — признак продолжения. 128 = 2⁷ в один байт не влезает."

  - id: uvarint-accepts
    kind: output
    prompt: "Длина кадра прочитана через `binary.Uvarint`. Что выведет программа?"
    code: |
      package main

      import (
      	"encoding/binary"
      	"fmt"
      )

      func main() {
      	wire := []byte{0xff, 0xff, 0xff, 0xff, 0xff, 0x01}
      	v, n := binary.Uvarint(wire)
      	fmt.Println(n, int32(v))
      }
    options:
      - text: "6 -1"
        correct: true
        explain: "`Uvarint` — формат `uint64` до 10 байт, шесть байт для него нормальны. Значение 2³⁶−1 после `int32(v)` обрезается до младших 32 бит — это −1. Декодер протокола должен был остановиться на пятом байте с ошибкой."
      - text: "-6 0"
        explain: "Отрицательное `n` `Uvarint` возвращает только при переполнении `uint64` (больше 10 байт). Здесь всего 36 бит."
      - text: "5 -1"
        explain: "`Uvarint` ничего не знает о лимите в 5 байт — он читает, пока не встретит байт без старшего бита, то есть все шесть."

  - id: read-once
    kind: output
    prompt: "Клиент отправил два кадра в двух вызовах `Write`, сервер прочитал их одним `Read` в буфер на 64 байта. Сколько байт вернул `Read` (на `bytes.Reader` поведение то же — он отдаёт всё, что есть)?"
    code: |
      package main

      import (
      	"bytes"
      	"fmt"
      )

      func main() {
      	var stream bytes.Buffer
      	stream.Write([]byte{0x03, 0x01, 'h', 'i'}) // кадр 1
      	stream.Write([]byte{0x02, 0x01, '!'})      // кадр 2
      	buf := make([]byte, 64)
      	n, _ := stream.Read(buf)
      	fmt.Println(n)
      }
    options:
      - text: "7"
        correct: true
        explain: "`Read` отдаёт всё, что уже есть, до размера буфера: оба кадра склеились. Так же ведёт себя TCP-сокет, только там ещё и граница может прийтись на середину кадра. Поэтому кадр читают по длине: `ReadVarInt` и `io.ReadFull`."
      - text: "4"
        explain: "У потока нет границ между `Write`. Границу знает только протокол — по префиксу длины."
      - text: "64"
        explain: "`Read` не ждёт, пока буфер заполнится, и не возвращает больше, чем есть данных."

  - id: limit-before-make
    kind: single
    prompt: "Почему длину кадра проверяют до `make([]byte, n)`, а не после чтения тела?"
    options:
      - text: "Иначе размер выделяемой памяти задаёт клиент: пять байт `ff ff ff ff 07` — и сервер просит 2 ГБ, а отрицательная длина вообще вызывает панику в `make`"
        correct: true
        explain: "Длина из сети — недоверенное число. Проверка до выделения стоит одно сравнение, а без неё один пакет кладёт процесс."
      - text: "`io.ReadFull` не умеет читать в буфер больше 64 КБ"
        explain: "`io.ReadFull` читает в буфер любого размера, вызывая `Read` много раз."
      - text: "Чтобы не прочитать из сокета байты следующего кадра"
        explain: "Лишнего `io.ReadFull` и так не прочитает — он читает ровно `len(buf)` байт. Дело в памяти, которую выделит `make`."
      - text: "Проверять можно и после — сборщик мусора всё равно освободит буфер"
        explain: "Освободит, но сначала его надо выделить: 2 ГБ на соединение — это падение по памяти задолго до сборки мусора."

  - id: non-canonical
    kind: multiple
    prompt: "Какие последовательности строгий декодер VarInt из урока отвергнет?"
    options:
      - text: "`80 00`"
        correct: true
        explain: "Ноль, записанный в двух байтах, — неканоническая форма. Сервер Minecraft её примет, но строгий декодер даёт свойство «у числа одна запись», которое проверяет фаззер."
      - text: "`ff ff ff ff 1f`"
        correct: true
        explain: "В пятом байте заняты биты старше четвёртого — число не помещается в 32 бита."
      - text: "`80 80 80 80 80 01`"
        correct: true
        explain: "У пятого байта установлен бит продолжения — VarInt длиннее 5 байт. Шестой байт декодер даже не читает."
      - text: "`ff ff ff ff 0f`"
        explain: "Это −1: пять байт, в пятом только 4 младших бита — корректная каноническая запись."
