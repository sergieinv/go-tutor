questions:
  - id: copy-stops-on-close
    kind: output
    prompt: "Как прокси останавливает копирующую горутину. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"io"
      	"net"
      )

      func main() {
      	backend, proxySide := net.Pipe()
      	done := make(chan int64)
      	go func() {
      		n, err := io.Copy(io.Discard, proxySide)
      		fmt.Println("err:", err)
      		done <- n
      	}()
      	backend.Write([]byte("chunk"))
      	backend.Close() // бэкенд закрыл соединение
      	fmt.Println("скопировано:", <-done)
      }
    options:
      - text: "err: <nil>\nскопировано: 5"
        correct: true
        explain: "`io.Copy` читает, пока источник не вернёт EOF; закрытие другой стороны и есть EOF. Удачный `Copy` возвращает `nil`, а не `io.EOF`. Так прокси и переключает бэкенд: закрыл соединение — копирующая горутина вышла."
      - text: "err: EOF\nскопировано: 5"
        explain: "`io.Copy` не считает EOF ошибкой: по документации удачное копирование возвращает `err == nil`."
      - text: "Программа зависнет"
        explain: "Закрытие `backend` даёт EOF на `proxySide`, и `io.Copy` возвращается. Зависнет копирование, у источника которого никто не закрывает соединение."

  - id: pick-tie
    kind: output
    prompt: "Выбор лобби: наименьшая нагрузка, при равенстве — первое. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	lobbies := []string{"a", "b", "c"}
      	load := map[string]int{"a": 2, "b": 1, "c": 1}
      	for range 3 {
      		best := lobbies[0]
      		for _, l := range lobbies[1:] {
      			if load[l] < load[best] {
      				best = l
      			}
      		}
      		load[best]++
      		fmt.Print(best, " ")
      	}
      	fmt.Println()
      }
    options:
      - text: "b c a "
        correct: true
        explain: "b и c по 1 — строгое `<` оставляет того, кто раньше: b. Затем b = 2, c = 1 — c. Теперь все по 2 — снова первый, a."
      - text: "b b c "
        explain: "После первого выбора у b нагрузка 2, а у c — 1: следующим выбирается c."
      - text: "c b a "
        explain: "Строгое сравнение `<` не заменяет b на c при равной нагрузке — при равенстве остаётся стоящий раньше."

  - id: exposed-backend
    kind: single
    prompt: "Бэкенды за прокси работают в offline-режиме. Почему их нельзя открывать наружу, даже если игроки ходят через прокси?"
    options:
      - text: "Бэкенд верит данным игрока, которые ему передали; подключившись мимо прокси, любой назовётся любым именем"
        correct: true
        explain: "Аккаунт проверяет прокси, а бэкенд видит только то, что ему прислали. Защита — внутренняя сеть плюс подписанный forwarding (HMAC общим секретом), который бэкенд проверяет."
      - text: "Иначе клиенты будут подключаться к бэкенду напрямую и прокси не увидит нагрузку"
        explain: "Это неудобство, но не главная проблема: опасна подделка личности игрока."
      - text: "В offline-режиме трафик не шифруется, и его прочитают"
        explain: "Шифрование — отдельный вопрос; даже с ним бэкенд без проверки подписи поверит поддельному имени."

  - id: one-world-one-process
    kind: single
    prompt: "Почему игровой мир обычно не делят между несколькими процессами, а масштабируют числом миров?"
    options:
      - text: "Взаимодействия через границу превращаются в сетевые вызовы с задержкой и спорами о том, чьё состояние верное, а мир меняется 20 раз в секунду"
        correct: true
        explain: "Одна горутина тика видит всё сразу и решает за наносекунды. Через границу процессов тот же удар по мобу — сообщение, ожидание и согласование; поэтому шардируют миры и инстансы."
      - text: "Go не умеет передавать структуры между процессами"
        explain: "Умеет (`encoding/binary`, gob, gRPC); дело в задержке и согласованности, а не в сериализации."
      - text: "Клиент Minecraft может быть подключён только к одному процессу"
        explain: "Прокси как раз переключает клиента между процессами. Проблема в том, что один мир требует общего состояния."

  - id: transfer-packet
    kind: single
    prompt: "Чем перенос пакетом Transfer (1.20.5+) отличается от переключения через прокси?"
    options:
      - text: "Клиент сам переподключается к новому адресу, поэтому целевой сервер должен быть доступен клиенту и разрешать transfer; данные с собой — в cookie, которую надо подписать"
        correct: true
        explain: "Transfer — переподключение клиента без посредника. Прокси же держит одно соединение клиента и прячет бэкенды. Cookie хранит клиент, поэтому без подписи ей верить нельзя."
      - text: "Ничем: Transfer — это команда для прокси"
        explain: "Пакет Transfer получает клиент, и подключается он уже сам, минуя прокси."
      - text: "Transfer переносит состояние игрока между серверами автоматически"
        explain: "Пакет передаёт только адрес. Состояние сохраняют и загружают серверы — через общее хранилище или подписанные cookie."
