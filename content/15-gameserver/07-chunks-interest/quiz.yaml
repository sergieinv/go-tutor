questions:
  - id: negative-chunk
    kind: output
    prompt: "Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"math"
      )

      func main() {
      	x := -0.5
      	b := -1
      	fmt.Println(int(x)/16, int(math.Floor(x/16)), b>>4, b/16)
      }
    options:
      - text: "0 -1 -1 0"
        correct: true
        explain: "Приведение `float64` к `int` и целочисленное деление округляют к нулю, поэтому `int(-0.5)/16` и `-1/16` — оба 0. `math.Floor` округляет вниз: чанк −1. Сдвиг `>>` знакового целого в Go арифметический — это деление на 16 с округлением вниз, `-1 >> 4 == -1`."
      - text: "-1 -1 -1 -1"
        explain: "Так было бы, если бы деление округляло вниз. В Go (как в C#) целочисленное деление и приведение к `int` округляют к нулю."
      - text: "0 -1 0 0"
        explain: "Сдвиг вправо у знаковых целых в Go арифметический: знаковый бит размножается, и `-1 >> 4` остаётся −1. Логический сдвиг дал бы огромное положительное число, а не 0."
      - text: "0 0 -1 0"
        explain: "`math.Floor(-0.5/16)` = `math.Floor(-0.03125)` = −1: округление вниз уводит отрицательную дробь к −1, а не к 0."

  - id: ring-cost
    kind: single
    prompt: "Дальность видимости 10, игрок шагнул через границу в соседний чанк по оси x. Сколько чанков нужно загрузить, если слать только разность квадратов?"
    options:
      - text: "21"
        correct: true
        explain: "Квадрат (2r+1)² = 21×21 сдвинулся на один столбец: новый столбец — 21 чанк, ещё 21 уходит на выгрузку. Остальные 420 у клиента уже есть."
      - text: "441"
        explain: "441 — весь квадрат 21×21. Столько шлёт сервер, который при каждом переходе отправляет зону заново, — в двадцать раз больше нужного."
      - text: "42"
        explain: "42 — сумма загрузки и выгрузки (21 + 21). Загрузить нужно только новый столбец."
      - text: "40"
        explain: "Сторона квадрата — 2r+1 = 21, а не 2r = 20: в квадрат входит и чанк самого игрока."

  - id: diagonal-diff
    kind: output
    prompt: "Сколько чанков загрузить при шаге по диагонали с дальностью 1? Что выведет программа?"
    code: |
      package main

      import "fmt"

      type C struct{ X, Z int }

      func in(c, center C, r int) bool {
      	return max(c.X-center.X, center.X-c.X) <= r && max(c.Z-center.Z, center.Z-c.Z) <= r
      }

      func main() {
      	old, now := C{0, 0}, C{1, 1}
      	load, unload := 0, 0
      	for x := -3; x <= 3; x++ {
      		for z := -3; z <= 3; z++ {
      			c := C{x, z}
      			if in(c, now, 1) && !in(c, old, 1) {
      				load++
      			}
      			if in(c, old, 1) && !in(c, now, 1) {
      				unload++
      			}
      		}
      	}
      	fmt.Println(load, unload)
      }
    options:
      - text: "5 5"
        correct: true
        explain: "Квадраты 3×3 с центрами (0,0) и (1,1) пересекаются по 2×2 = 4 чанкам, поэтому каждая сторона разности — 9 − 4 = 5: столбец и строка без общего угла."
      - text: "6 6"
        explain: "Это сложение столбца (3) и строки (3) без учёта общего угла: угловой чанк (2,2) входит в оба, а считается один раз."
      - text: "3 3"
        explain: "По 3 чанка — шаг вдоль одной оси. По диагонали меняются и столбец, и строка."
      - text: "9 9"
        explain: "Квадраты пересекаются (общие 4 чанка), так что заново грузить все 9 не нужно."

  - id: asymmetric-view
    kind: single
    prompt: "У A дальность 2, у B — 5. Чанк B отстоит от чанка A на 4 по оси x и на 0 по z. Кому сервер пошлёт «появилась сущность»?"
    options:
      - text: "Только B: чанк A в квадрате B, чанк B вне квадрата A"
        correct: true
        explain: "Видимость решает квадрат того, кто смотрит: |4| ≤ 5 — B видит A; |4| > 2 — A не видит B. С разными дальностями видимость бывает односторонней, поэтому «кто видит игрока» — это подписчики его чанка, а не те, чьи чанки он видит сам."
      - text: "Обоим: если один видит другого, видимость взаимна"
        explain: "Взаимна она только при равной дальности. Здесь квадрат A слишком мал, чтобы дотянуться до чанка B."
      - text: "Никому: нужно, чтобы оба были в зонах друг друга"
        explain: "Каждому игроку шлют то, что попадает в его собственную зону. B видит A — значит, B получает A."
      - text: "Только A"
        explain: "Наоборот: квадрат A покрывает чанки на расстоянии до 2, а B стоит в 4."

  - id: map-key
    kind: compile
    prompt: "Скомпилируется ли программа?"
    code: |
      package main

      import "fmt"

      type ChunkPos struct {
      	X, Z    int
      	Players []int
      }

      func main() {
      	subs := map[ChunkPos]int{}
      	subs[ChunkPos{X: 1, Z: 2}]++
      	fmt.Println(len(subs))
      }
    compiles: false
    explain: "Ключ map должен быть сравнимым типом, а структура со срезом — несравнима: `invalid map key type ChunkPos`. Ключ чанка — маленькая структура из целых (`struct{ X, Z int }`), а подписчики — значение: `map[ChunkPos]map[PlayerID]struct{}`."
