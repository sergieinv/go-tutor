questions:
  - id: seeded-generators
    kind: output
    prompt: "Три генератора math/rand/v2: два с одинаковым зерном, третий — с другим. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"math/rand/v2"
      )

      func main() {
      	a := rand.New(rand.NewPCG(1, 2))
      	b := rand.New(rand.NewPCG(1, 2))
      	c := rand.New(rand.NewPCG(1, 3))
      	same, differs := true, false
      	for range 1000 {
      		x, y, z := a.IntN(100), b.IntN(100), c.IntN(100)
      		same = same && x == y
      		differs = differs || x != z
      	}
      	fmt.Println(same, differs)
      }
    options:
      - text: "true true"
        correct: true
        explain: "Генератор с заданным зерном выдаёт один и тот же поток чисел на каждом запуске — на этом держится повтор симуляции. Другое зерно — другой поток. Зерно пишут в журнал вместе с вводом."
      - text: "false true"
        explain: "Случайно засевается только глобальный генератор. `rand.NewPCG(1, 2)` — детерминированный алгоритм: одинаковое зерно — одинаковые числа."
      - text: "true false"
        explain: "Зерно `(1, 3)` отличается от `(1, 2)`, и за тысячу чисел потоки обязательно где-то разойдутся."

  - id: canonical-order
    kind: output
    prompt: "Двое шагают в одну свободную клетку в одном тике. Ввод пришёл в разном порядке, тик сортирует его по id игрока. Что выведет программа?"
    code: |
      package main

      import (
      	"cmp"
      	"fmt"
      	"slices"
      )

      type move struct{ player, cell int }

      func winner(arrived []move) int {
      	slices.SortFunc(arrived, func(a, b move) int { return cmp.Compare(a.player, b.player) })
      	owner := map[int]int{}
      	for _, m := range arrived {
      		if _, busy := owner[m.cell]; !busy {
      			owner[m.cell] = m.player
      		}
      	}
      	return owner[5]
      }

      func main() {
      	fmt.Println(winner([]move{{2, 5}, {1, 5}}), winner([]move{{1, 5}, {2, 5}}))
      }
    options:
      - text: "1 1"
        correct: true
        explain: "После сортировки игрок 1 всегда применяется первым и занимает клетку — при любом порядке прихода. Тот же журнал при повторе даст тот же результат."
      - text: "2 1"
        explain: "Так было бы без сортировки: клетку получил бы тот, чей пакет пришёл первым. `slices.SortFunc` убирает эту зависимость."
      - text: "2 2"
        explain: "Сортировка по возрастанию id ставит игрока 1 первым, а клетка достаётся первому."

  - id: what-to-log
    kind: single
    prompt: "Что записать в журнал ввода, чтобы повтор дал тот же мир?"
    options:
      - text: "Зерно, начальное состояние и каждую применённую команду с номером тика, в который её применили"
        correct: true
        explain: "Номер тика фиксирует решение, которое приняла горутина мира. При повторе команды попадут в те же тики, и в каждом тике их упорядочит тот же канонический порядок."
      - text: "Команды с временем прихода пакета (`time.Now()`)"
        explain: "Повтор идёт с другой скоростью, и по времени нельзя восстановить, в какой тик попала команда: тик мог начаться чуть раньше или позже."
      - text: "Команды в порядке прихода, без тиков"
        explain: "Без тиков неизвестно, какие команды были в одном тике, а какие — в соседних: от этого зависит, кто занял клетку и сколько шагов успел сделать игрок."
      - text: "Достаточно зерна: мир детерминирован"
        explain: "Зерно задаёт только случайность сервера. Ввод игроков приходит снаружи, его нужно записать."

  - id: mspt-tail
    kind: single
    prompt: "Прогон с 500 ботами: TPS — 20,0, MSPT в среднем 10 мс, p99 — 70 мс. Что это значит?"
    options:
      - text: "Примерно раз в сотню тиков тик длиннее бюджета 50 мс — игроки видят рывки, хотя средние и TPS выглядят хорошо"
        correct: true
        explain: "Бюджет тика — 50 мс. p99 = 70 мс означает, что 1% тиков его срывает; цикл догоняет (урок 04), и TPS в среднем остаётся 20. Ищите, что делает эти тики длинными: паузы GC, вход игроков, сохранение."
      - text: "Всё хорошо: TPS ровно 20, а среднее далеко от 50 мс"
        explain: "Средние скрывают хвост. Игрок замечает именно редкие долгие тики."
      - text: "Сервер перегружен вчетверо"
        explain: "Средний тик занимает 10 мс из 50 — запас есть. Проблема в отдельных длинных тиках, а не в постоянной перегрузке."

  - id: fma
    kind: single
    prompt: "Симуляция с `float64` повторяется побайтно на amd64, но журнал, снятый там, на arm64 расходится через тысячу тиков. Какая вероятная причина?"
    options:
      - text: "Спецификация Go разрешает объединять `x*y + z` в одну FMA-инструкцию, и на разных архитектурах округление может отличаться"
        correct: true
        explain: "FMA округляет один раз вместо двух, и результат отличается в последнем бите; расхождение копится от тика к тику. Явное `float64(x*y) + z` запрещает слияние; другой путь — фиксированная точка в целых."
      - text: "`math/rand/v2` выдаёт разные числа на разных архитектурах"
        explain: "Генераторы `PCG` и `ChaCha8` — целочисленные алгоритмы с одинаковым выводом на любой архитектуре."
      - text: "Порядок обхода map зависит от архитектуры"
        explain: "Порядок обхода map случаен на любой архитектуре и от запуска к запуску — это сломало бы повтор и на amd64."
