questions:
  - id: shift-vs-divide
    kind: output
    prompt: "Чанк для координаты блока: деление или сдвиг. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	for _, x := range []int{-1, -16, -17} {
      		fmt.Print(x/16, " ", x>>4, "; ")
      	}
      	fmt.Println()
      }
    options:
      - text: "0 -1; -1 -1; -1 -2; "
        correct: true
        explain: "Деление в Go округляет к нулю: `-1/16 == 0`, `-17/16 == -1`. Арифметический сдвиг вправо — это floor: `-1>>4 == -1`, `-17>>4 == -2`. Блок `x = -1` лежит в чанке `-1`, а не `0`, поэтому для чанков нужен сдвиг (или `math.Floor` для `float64`)."
      - text: "-1 -1; -1 -1; -2 -2; "
        explain: "Деление целых в Go отбрасывает дробную часть (округление к нулю), а не округляет вниз: `-1/16 == 0`."
      - text: "0 0; -1 -1; -1 -1; "
        explain: "Сдвиг знакового числа вправо — арифметический: знак сохраняется, и результат округляется вниз. `-1>>4 == -1`."

  - id: cow-slice-field
    kind: output
    prompt: "Копия чанка перед записью: в первом типе блоки — массив, во втором — срез. Что выведет программа?"
    code: |
      package main

      import "fmt"

      type arrChunk struct{ blocks [4]uint16 }
      type sliceChunk struct{ blocks []uint16 }

      func main() {
      	a := &arrChunk{}
      	snapA := a // снапшот держит указатель
      	cpA := *a
      	cpA.blocks[0] = 7

      	s := &sliceChunk{blocks: make([]uint16, 4)}
      	snapS := s
      	cpS := *s
      	cpS.blocks[0] = 7

      	fmt.Println(snapA.blocks[0], snapS.blocks[0])
      }
    options:
      - text: "0 7"
        correct: true
        explain: "`*a` копирует структуру целиком, а массив — часть значения, так что копия независима. Срез в структуре — только заголовок (указатель, длина, ёмкость): `*s` копирует заголовок, и обе структуры смотрят в один массив. Copy-on-write с полем-срезом требует явного `slices.Clone`."
      - text: "0 0"
        explain: "Копия структуры со срезом копирует только заголовок среза — данные остались общими, снапшот увидит запись."
      - text: "7 7"
        explain: "Массив — значение: `cpA := *a` скопировал все четыре элемента, и снапшот их не видит."

  - id: save-slower-than-interval
    kind: single
    prompt: "Автосохранение раз в 5 минут, а запись снапшота под нагрузкой занимает 6. Что правильно сделать в момент очередного автосохранения?"
    options:
      - text: "Пропустить его, посчитать пропуск в метрике и попробовать в следующий интервал"
        correct: true
        explain: "Одно сохранение за раз: прошлое и так запишет почти свежий мир. Пропуск виден в метриках — сигнал, что диск не справляется или пора сохранять инкрементально."
      - text: "Запустить второе сохранение параллельно, чтобы не отстать"
        explain: "Два писателя одного файла переименовывают его в непредсказуемом порядке, а каждый снапшот держит свои копии изменённых чанков — память растёт с каждым интервалом."
      - text: "Остановить тик и дождаться конца прошлого сохранения"
        explain: "Именно этого и избегали: тик стоит, пока пишется диск, — игроки видят лаг на всё время записи."
      - text: "Поставить снапшот в очередь, чтобы записать его после текущего"
        explain: "Очередь снапшотов растёт без предела, если диск стабильно медленнее интервала, а записывать устаревший снапшот после более свежего бессмысленно."

  - id: temp-file-same-dir
    kind: single
    prompt: "Почему временный файл для атомарной записи создают в том же каталоге, что и `world.dat`, а не в `os.TempDir()`?"
    options:
      - text: "`os.Rename` атомарен только в пределах одной файловой системы, а временный каталог часто на другой (например, tmpfs)"
        correct: true
        explain: "Между файловыми системами `rename` не работает (`EXDEV`); пришлось бы копировать, и атомарность пропала бы. Рядом с целевым файлом — та же файловая система."
      - text: "Иначе `f.Sync()` не сбросит данные на диск"
        explain: "`Sync` работает для файла в любом каталоге. Дело в `Rename`."
      - text: "Так быстрее: временный каталог медленнее рабочего"
        explain: "Скорость тут ни при чём — важна атомарность замены."

  - id: shutdown-order
    kind: single
    prompt: "Сервер получил SIGTERM. В каком порядке правильно останавливаться?"
    options:
      - text: "Закрыть listener → дотикать и остановить цикл → отключить игроков → дождаться идущего сохранения и записать финальный снапшот → выйти"
        correct: true
        explain: "Сначала перестаём принимать новых, затем замораживаем мир (больше никто его не меняет), отключаем игроков — их состояние уже в мире, — и только потом пишем финальный снапшот: он увидит всё."
      - text: "Записать финальный снапшот → закрыть listener → отключить игроков"
        explain: "Пока игроки подключены и тик идёт, мир меняется: всё, что произошло после снапшота, потеряется."
      - text: "Вызвать os.Exit(0) из обработчика сигнала — мир сохранит автосохранение"
        explain: "`os.Exit` не выполняет `defer` и не ждёт горутин; изменения после последнего автосохранения пропадут."
