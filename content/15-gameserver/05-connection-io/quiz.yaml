questions:
  - id: queue-overflow
    kind: output
    prompt: "Писатель завис в `Write` и очередь не читает. Тик четыре раза вызывает `send`. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	out := make(chan string, 2)
      	closed := false
      	send := func(m string) bool {
      		if closed {
      			return false
      		}
      		select {
      		case out <- m:
      			return true
      		default:
      			closed = true // клиент отключён: медленный
      			return false
      		}
      	}
      	fmt.Println(send("a"), send("b"), send("c"), send("d"), len(out))
      }
    options:
      - text: "true true false false 2"
        correct: true
        explain: "Два кадра заняли очередь. Третий не поместился — `default`, клиент помечен отключённым. Четвёртый даже не пытается: клиент уже закрыт. В очереди остались два кадра — их никто не запишет."
      - text: "true true false true 2"
        explain: "Без флага `closed` так бы и было, если бы место освободилось, — но писатель стоит, места нет. А с флагом после первого переполнения `send` сразу возвращает `false`."
      - text: "true true true true 4"
        explain: "Буфер канала — 2 элемента. `select` с `default` не ждёт и не расширяет буфер: лишнее уходит в `default`."
      - text: "программа зависнет на третьем send"
        explain: "Зависла бы отправка без `select`: `out <- m`. С `default` отправка в полный канал не блокирует — для этого `default` и нужен в тике."

  - id: send-closed-select
    kind: output
    prompt: "`Close` закрыл канал очереди, а тик ещё раз вызывает `Send` с `select` и `default`. Что выведет программа?"
    code: |
      package main

      import "fmt"

      func main() {
      	defer func() { fmt.Println("recover:", recover()) }()
      	out := make(chan []byte, 8)
      	close(out) // Close «закрыл очередь»
      	select {
      	case out <- []byte("update"):
      		fmt.Println("отправлено")
      	default:
      		fmt.Println("очередь полна")
      	}
      }
    options:
      - text: "recover: send on closed channel"
        correct: true
        explain: "Отправка в закрытый канал паникует и внутри `select`, даже с `default`: случай отправки готов (закрытый канал не блокирует) — и его выполнение паникует. Поэтому канал очереди не закрывают из `Close`: закрытие сигналят отдельным каналом `done`, а очередь просто бросают."
      - text: "очередь полна"
        explain: "`default` выбирается, только если ни один случай не готов. Отправка в закрытый канал «готова» — и паникует."
      - text: "отправлено"
        explain: "В закрытый канал отправить нельзя никогда — это паника `send on closed channel`."
      - text: "recover: <nil>"
        explain: "Паника была, и `recover` её поймал: он возвращает значение паники — ошибку рантайма с текстом `send on closed channel`."

  - id: wake-blocked-read
    kind: multiple
    prompt: "Горутина чтения висит в `conn.Read` (клиент молчит). Что её разбудит?"
    options:
      - text: "`conn.Close()` из другой горутины"
        correct: true
        explain: "`Read` вернёт ошибку `net.ErrClosed` («use of closed network connection»). Это обычный способ остановить обе горутины соединения."
      - text: "`conn.SetReadDeadline(time.Now())` из другой горутины"
        correct: true
        explain: "Дедлайн можно двигать во время заблокированного `Read`: он вернёт ошибку с `os.ErrDeadlineExceeded` (`Timeout() == true`). Так будят читателя без закрытия соединения, например, чтобы дописать прощальный пакет."
      - text: "Отмена `context`, в котором соединение было принято"
        explain: "`net.Conn` о контексте не знает: `Read` контекст не слушает. Отмену переводят в `Close` или `SetReadDeadline` сами — например, через `context.AfterFunc(ctx, func() { conn.Close() })`."
      - text: "Возврат из функции, которая запустила горутину"
        explain: "Горутины не привязаны к вызвавшей функции: читатель так и останется висеть — это утечка горутины и соединения."

  - id: deadline-semantics
    kind: single
    prompt: "Сервер один раз при подключении вызвал `conn.SetReadDeadline(time.Now().Add(30 * time.Second))`. Игрок активно играет. Что будет через 30 секунд?"
    options:
      - text: "Очередной `Read` вернёт ошибку таймаута, хотя игрок слал данные: дедлайн — момент времени, а не таймаут простоя"
        correct: true
        explain: "Дедлайн абсолютный и сам не продлевается. Таймаут простоя делают, продлевая дедлайн перед каждым чтением: `conn.SetReadDeadline(time.Now().Add(idle))` в цикле читателя."
      - text: "Ничего: каждый успешный `Read` сдвигает дедлайн на 30 секунд вперёд"
        explain: "Так ведут себя таймауты простоя в некоторых библиотеках, но не `net.Conn`: дедлайн — `time.Time`, и его двигают только явным вызовом."
      - text: "Соединение закроется само"
        explain: "Дедлайн не закрывает соединение: `Read` и `Write` возвращают ошибку, пока дедлайн не сдвинут. Закрывать — решение сервера."

  - id: why-not-write-in-tick
    kind: single
    prompt: "Почему тик кладёт пакеты в очередь соединения, а не вызывает `conn.Write` сам?"
    options:
      - text: "`Write` блокируется, когда буфер сокета медленного клиента полон, — и вместе с ним встал бы весь мир"
        correct: true
        explain: "Буферы сокетов в ядре — от десятков килобайт до мегабайт. Клиент на плохой сети или нарочно не читающий бот заполнит их за секунды, и `Write` будет ждать, пока он прочитает. Очередь с неблокирующей отправкой ограничивает ущерб одним клиентом: переполнил — отключён."
      - text: "`net.Conn` нельзя вызывать из нескольких горутин"
        explain: "Можно: методы `net.Conn` безопасны для одновременного вызова. Проблема не в гонке, а в блокировке."
      - text: "Так быстрее: запись в канал дешевле системного вызова"
        explain: "Дешевле, но это не главное. Даже если `Write` дешёвый в среднем, один медленный клиент делает его бесконечно долгим."
