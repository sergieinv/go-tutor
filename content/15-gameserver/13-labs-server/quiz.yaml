questions:
  - id: catch-up
    kind: output
    prompt: "Функция `schedule` — та же, что в `labs/gameserver/internal/world/loop.go`. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"time"
      )

      const tick = 50 * time.Millisecond
      const maxCatchUp = 5 * tick

      // schedule — время следующего тика и число списанных тиков.
      func schedule(next, now time.Time) (time.Time, int) {
      	lag := now.Sub(next)
      	if lag <= maxCatchUp {
      		return next, 0
      	}
      	return now, int(lag / tick)
      }

      func main() {
      	start := time.Unix(0, 0)
      	n1, s1 := schedule(start, start.Add(120*time.Millisecond))
      	n2, s2 := schedule(start, start.Add(400*time.Millisecond))
      	fmt.Println(n1.Sub(start), s1, n2.Sub(start), s2)
      }
    options:
      - text: "0s 0 400ms 8"
        correct: true
        explain: "Отставание 120 мс меньше пяти тиков (250 мс): расписание не трогаем, следующий тик «в прошлом», и цикл догонит его сразу, тиками подряд. Отставание 400 мс больше предела: расписание сдвигается на «сейчас», а 400/50 = 8 тиков списываются — это метрика `gameserver_ticks_skipped_total`. Мир замедляется, а не крутит восемь тиков подряд."
      - text: "120ms 2 400ms 8"
        explain: "При небольшом отставании `schedule` ничего не списывает и не сдвигает: она возвращает прежнее `next`, а догоняет цикл, сразу начиная следующий тик (ожидание `next.Sub(end)` отрицательное)."
      - text: "0s 0 250ms 3"
        explain: "Предел догоняния — не новое расписание. Если отставание больше `maxCatchUp`, расписание переносится на `now`, а списываются все целые тики отставания: `int(400ms / 50ms) = 8`."
      - text: "0s 2 400ms 8"
        explain: "Списанные тики считаются только при сдвиге расписания. Пока отставание в пределах пяти тиков, второе значение — 0: эти тики не пропадут, а выполнятся подряд."

  - id: delta-limit
    kind: output
    prompt: "Кодировщик Minecraft выбирает между дельтой (Update Entity Position, `int16` в 1/4096 блока) и телепортом так же, как `appendMove` в `labs/gameserver/internal/mc/encoder.go`. Что выведет программа?"
    code: |
      package main

      import (
      	"fmt"
      	"math"
      )

      func fixed(v float64) int64 { return int64(math.Round(v * 4096)) }

      func fits(v int64) bool { return v >= math.MinInt16 && v <= math.MaxInt16 }

      func main() {
      	from := 100.0
      	for _, to := range []float64{107.99, 108, 92} {
      		fmt.Print(fits(fixed(to)-fixed(from)), " ")
      	}
      	d := fixed(108) - fixed(100)
      	fmt.Println(int16(d))
      }
    options:
      - text: "true false true -32768"
        correct: true
        explain: "8 блоков — это 8·4096 = 32768, на единицу больше `math.MaxInt16`: ровно 8 блоков вперёд дельтой уже не передать, нужен телепорт. Назад −32768 = `math.MinInt16` помещается — диапазон `int16` несимметричен. А преобразование `int16(32768)` в Go не паникует, а обрезает старшие биты: игрок на экранах остальных прыгнул бы на 8 блоков назад вместо 8 вперёд."
      - text: "true true true 32767"
        explain: "Преобразование целых в Go не насыщается: лишние старшие биты просто отбрасываются, и 32768 становится −32768. И 32768 больше `math.MaxInt16`, поэтому `fits` для 8 блоков — `false`."
      - text: "true false false -32768"
        explain: "Диапазон `int16` — от −32768 до 32767. Шаг на 8 блоков назад даёт ровно −32768 и помещается; вперёд — 32768 и не помещается."
      - text: "программа паникует: переполнение int16"
        explain: "Переполнение при преобразовании целых в Go не проверяется ни во время выполнения, ни (для переменных) при компиляции. Компилятор ругается только на константы, например `int16(32768)`."

  - id: slow-consumer
    kind: single
    prompt: "Клиент перестал читать сокет (вкладка браузера «уснула»). Что сделает сервер из labs, когда исходящая очередь клиента (64 пачки) заполнится?"
    options:
      - text: "Неблокирующая отправка не пройдёт, мир закроет `Peer` с причиной `slow_consumer`, а игрока уберёт в начале следующего тика; остальные игроки ничего не заметят"
        correct: true
        explain: "Тик никогда не ждёт клиента: `trySend` — `select` с `default`. При неудаче мир вызывает `peer.Close(ReasonSlowConsumer)` и кладёт игрока в `w.kicks`; в начале следующего тика `input` убирает его из мира. Горутина записи видит закрытый `Peer`, дописывает то, что уже в очереди, и закрывает соединение. Видно по `gameserver_disconnects_total{reason=\"slow_consumer\"}`."
      - text: "Тик подождёт, пока в очереди освободится место, — команды и события не теряются"
        explain: "Так один медленный клиент остановил бы мир для всех. Ждать (обратное давление) сервер готов только во входящем направлении: горутина чтения ждёт места в `inbox`."
      - text: "Сервер выбросит самую старую пачку и положит новую — клиент увидит рывок, но останется в игре"
        explain: "Пачка — это изменения (дельты, появления, чанки). Выброшенная пачка сломала бы картину клиента навсегда: он не узнает, что кто-то появился или что блок сломан. Отключение честнее."
      - text: "Мир сразу удалит игрока из всех структур посреди рассылки"
        explain: "Удалять игрока посреди обхода `w.list` опасно, поэтому мир только закрывает `Peer` и откладывает удаление до начала следующего тика."

  - id: inbox-full
    kind: single
    prompt: "Мир не успевает разбирать ввод, и входящий канал `inbox` (8192 команды) полон. Что происходит с горутиной чтения соединения, которая вызывает `World.Submit`?"
    options:
      - text: "Она ждёт места в канале: перестаёт читать сокет, клиент упирается в TCP-окно, а команды не теряются и память не растёт"
        correct: true
        explain: "`Submit` — `select` из трёх веток: отправка в `inbox`, отмена контекста и остановка мира. Это обратное давление: медленный мир замедляет всех писателей через TCP, а не копит команды в памяти. Сколько команд в очереди в начале тика, показывает `gameserver_inbox_length`."
      - text: "Команда выбрасывается, а счётчик `gameserver_rejected_input_total` растёт"
        explain: "`rejected_input` — это отказы проверки ввода (`too_fast`, `chat_rate`…), а не переполнение канала. Выброшенное перемещение или подтверждение телепорта сломало бы игру клиента."
      - text: "Соединение отключается с причиной `slow_consumer`"
        explain: "`slow_consumer` — про исходящую очередь: клиент не читает то, что шлёт ему мир. Здесь не успевает мир, а не клиент."
      - text: "Горутина чтения применяет команду к миру сама, под мьютексом"
        explain: "Мьютексов вокруг мира нет: состоянием владеет одна горутина тика, а соединения общаются с ней только сообщениями."

  - id: go-mc
    kind: multiple
    prompt: "Что сервер из labs берёт из go-mc? Отметьте все верные варианты."
    options:
      - text: "Номера пакетов протокола 767 (`data/packetid`)"
        correct: true
        explain: "Номера сгенерированы в go-mc из данных игры; `TestPacketIDs` сверяет ключевые с таблицей протокола 767, чтобы обновление go-mc не сломало клиента молча."
      - text: "Таблицу состояний блоков 1.21.1 (`level/block`) и реестр типов сущностей (`data/registryid`)"
        correct: true
        explain: "Писать руками тысячи состояний блоков бессмысленно, а ошибка в одном номере дала бы не тот блок у клиента."
      - text: "Бота `go-mc/bot` для сквозного теста совместимости"
        correct: true
        explain: "`internal/e2e` входит ботом go-mc, разбирает чанки парсером go-mc и проверяет, что бот и браузерный игрок видят друг друга. Это независимая реализация клиента — она ловит ошибки, которые свой бот повторил бы."
      - text: "Кадрирование, сжатие и состояния соединения"
        explain: "Это написано своё: `internal/mcproto` (VarInt, кадры, zlib с лимитами против zip-бомбы) и `internal/mc` (handshake → status | login → configuration → play). Именно здесь нужны свои лимиты и свой контроль над буферами."
      - text: "Фреймворк сервера `go-mc/server`"
        explain: "Он написан под протокол 764 и не используется: игровой цикл, владение миром и рассылка — главное, ради чего сервер существует, — свои."
