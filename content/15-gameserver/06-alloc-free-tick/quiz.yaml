questions:
  - id: reuse-vs-fresh
    kind: output
    prompt: "`testing.AllocsPerRun` вне тестов тоже работает. Что выведет программа?"
    code: |
      package main

      import (
      	"encoding/binary"
      	"fmt"
      	"math"
      	"testing"
      )

      var sink []byte // результат уходит наружу, как кадр в очередь

      func main() {
      	buf := make([]byte, 0, 64)
      	x := 12.5
      	reuse := testing.AllocsPerRun(100, func() {
      		buf = binary.BigEndian.AppendUint64(buf[:0], math.Float64bits(x))
      	})
      	fresh := testing.AllocsPerRun(100, func() {
      		sink = binary.BigEndian.AppendUint64(nil, math.Float64bits(x))
      	})
      	grow := testing.AllocsPerRun(100, func() {
      		var b []byte
      		for i := range 100 {
      			b = append(b, byte(i))
      		}
      		sink = b
      	})
      	fmt.Println(reuse, fresh, grow > fresh)
      }
    options:
      - text: "0 1 true"
        correct: true
        explain: "`buf[:0]` сохраняет ёмкость 64 байта — восемь байт числа помещаются, выделений нет. `AppendUint64(nil, …)` каждый раз выделяет новый массив, и он уходит в глобальную переменную — одно выделение на вызов. Срез, который растёт с нуля до 100 байт, перевыделяется при росте ёмкости: в Go 1.27 первые 32 байта компилятор держит во временном буфере на стеке, а дальше — 64 и 128 байт в куче, два выделения. Точное число зависит от версии Go, но больше одного."
      - text: "0 0 false"
        explain: "Результат второй функции попадает в глобальную `sink` — массив переживает вызов и выделяется в куче. Срезы `nil` бесплатны только пока в них ничего не дописывают."
      - text: "1 1 true"
        explain: "Первая функция не выделяет: `AllocsPerRun` сделал прогон для прогрева, а ёмкости `buf` хватает с самого начала — `append` пишет в существующий массив."
      - text: "0 1 false"
        explain: "`append` в пустой срез растит ёмкость ступенями. Первые 32 байта в Go 1.27 живут во временном буфере на стеке, но дальше — 64 и 128 байт в куче: два выделения против одного у `AppendUint64(nil, …)`."

  - id: pool-after-gc
    kind: single
    prompt: "Буферы тика лежат в `sync.Pool`. Что с ними будет после сборки мусора?"
    options:
      - text: "Переживут одну сборку в victim-кеше пула, после второй пропадут — их придётся выделить заново"
        correct: true
        explain: "В `sync/pool.go` при каждой сборке основной кеш переезжает в victim, а старый victim выбрасывается (`poolCleanup`). Пул — кеш, а не хранилище: на следующих тиках после пары сборок буферы выделяются снова. Для буферов тика, которые нужны постоянно, надёжнее своя очередь свободных (срез или канал) — её сборщик мусора не трогает."
      - text: "Ничего: объекты в пуле считаются живыми, пока пул доступен"
        explain: "Нет — пул специально отпускает объекты при сборке, чтобы не держать память, которая не нужна. Это часть контракта `sync.Pool`: «Any item stored in the Pool may be removed automatically at any time»."
      - text: "Пропадут сразу при первой сборке"
        explain: "Так было до Go 1.13. С 1.13 у пула есть victim-кеш: объект переживает одну сборку."

  - id: length-prefix
    kind: single
    prompt: "Кадр — `VarInt length`, потом тело. Сколько байт займёт длина, неизвестно, пока тело не записано. Как собрать кадр без выделений?"
    options:
      - text: "Писать тело в переиспользуемый черновик, потом в выходной буфер — длину и тело"
        correct: true
        explain: "Черновик и выходной буфер живут между тиками и обнуляются через `[:0]`. Лишнее копирование тела — сотни байт `memmove`, это дешевле любого выделения. Другой путь — сначала посчитать длину тела отдельным проходом, а потом писать сразу на место."
      - text: "`bytes.Buffer` на каждый кадр: он сам растёт как нужно"
        explain: "Новый `bytes.Buffer` на каждый кадр — новые выделения на каждый кадр каждого игрока. Переиспользовать его можно (`Reset`), но тогда это тот же черновик."
      - text: "Выделить кадр размером с максимальный (2 МБ) один раз на игрока"
        explain: "Выделений после этого не будет, но тысяча игроков — два гигабайта ради кадров по сотне байт. Буферы должны дорастать до нужного размера на прогреве, а не заранее до максимума."

  - id: gc-knobs
    kind: multiple
    prompt: "Сервер держит в куче 2 ГБ живого мира, а паузы на разметку портят хвост MSPT. Что из этого разумно?"
    options:
      - text: "Задать `GOMEMLIMIT` чуть ниже лимита контейнера и поднять `GOGC`, чтобы сборки шли реже"
        correct: true
        explain: "`GOGC` задаёт, насколько куча может вырасти над живой частью до следующей сборки; выше `GOGC` — реже сборки ценой памяти. `GOMEMLIMIT` не даёт этой куче упереться в лимит контейнера: ближе к нему сборщик работает чаще (урок 13/05)."
      - text: "Убрать выделения из тика: предвыделенные буферы, срезы с `[:0]`, без `fmt` и `binary.Write` в горячем пути"
        correct: true
        explain: "Нет выделений — сборщику нечего догонять: mark assist не тормозит горутину мира, а сборки идут реже. Это самое надёжное лекарство."
      - text: "Включить поколения сборщика или режим вроде Server GC в .NET"
        explain: "У сборщика Go нет поколений и нет режимов вроде Server/Workstation GC или `GCLatencyMode`. Настройки — `GOGC` и `GOMEMLIMIT`, остальное — меньше выделений и меньше указателей."
      - text: "Вызывать `runtime.GC()` в конце каждого тика, чтобы куча была маленькой"
        explain: "Полная сборка каждые 50 мс — это постоянная работа разметки по всей живой куче в 2 ГБ, и вызывающая горутина (мир) ждёт её завершения. Хуже, чем сборки по расписанию пейсера."
