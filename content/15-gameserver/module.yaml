title: "Кейс: игровой сервер"
summary: Сквозной кейс — игровой сервер на Go, совместимый с базовым протоколом Minecraft Java Edition. Свой бинарный протокол поверх TCP, игровой цикл с фиксированным тиком и одной горутиной-владельцем мира, медленные клиенты, чанки и зона видимости, тик без аллокаций, проверка ввода, снапшоты без остановки мира, детерминированная симуляция, боты и масштабирование.
goals:
  - "Писать бинарный протокол сам: кадрирование по длине, VarInt, encoding/binary, лимиты и fuzzing декодера."
  - "Строить сервер вокруг игрового цикла: фиксированный тик, одна горутина владеет миром, соединения общаются с ней через ограниченные каналы."
  - "Не давать медленному клиенту остановить мир: исходящая очередь, отключение, дедлайны."
  - "Отправлять каждому только нужное: чанки, дальность видимости, пространственный хеш, изменения вместо полного состояния."
  - "Держать 20 TPS: тик без аллокаций, MSPT, поведение при перегрузке, профиль тика."
  - "Не доверять клиенту и не терять мир: лимиты, проверка перемещений, снапшоты и graceful shutdown."
  - "Проверять сервер без людей: фейковые часы, детерминированная симуляция, боты; понимать, как масштабируют игровые серверы."
