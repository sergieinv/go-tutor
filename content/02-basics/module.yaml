title: Базовый синтаксис
summary: Циклы, ветвления, срезы, map, строки, указатели и функции — всё, без чего не написать ни одной программы.
goals:
  - Писать циклы, ветвления и функции с несколькими результатами.
  - Понимать устройство срезов и не попадать в ловушки общего массива.
  - Отличать строки Go (байты UTF-8) от строк C# (UTF-16).
