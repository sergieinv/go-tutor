syntax = "proto3";

package orders.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "lesson/proto;main";

// OrderService — API заказов: один контракт для gRPC и REST.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {get: "/v1/orders/{id}"};
  }
  // Заказы клиента потоком: по сообщению на заказ.
  rpc ListOrders(ListOrdersRequest) returns (stream ListOrdersResponse) {
    option (google.api.http) = {get: "/v1/customers/{customer_id}/orders"};
  }
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{id}:cancel"
      body: "*"
    };
  }
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_CANCELLED = 2;
}

message Order {
  string id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  int64 total_cents = 4;
  OrderStatus status = 5;
  google.protobuf.Timestamp create_time = 6;
}

message OrderItem {
  string sku = 1 [(buf.validate.field).string.pattern = "^[A-Z0-9-]{3,32}$"];
  int32 quantity = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 1000
  }];
  int64 price_cents = 3 [(buf.validate.field).int64.gte = 0];
}

message CreateOrderRequest {
  string customer_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  repeated OrderItem items = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string customer_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListOrdersResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CancelOrderResponse {
  Order order = 1;
}
