// Контракт примера: те же методы доступны по gRPC и по REST.
// Аннотации google.api.http задают HTTP-метод, путь и тело.
syntax = "proto3";

package shop.v1;

import "google/api/annotations.proto";

option go_package = "lesson/proto;main";

service OrderService {
  // POST /v1/orders, тело запроса — весь CreateOrderRequest.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }
  // GET /v1/orders/42: id берётся из пути.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {get: "/v1/orders/{id}"};
  }
  // Два маршрута на один метод: поля, которых нет в пути,
  // берутся из query (?status=...&customer_id=...).
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/orders"
      additional_bindings {get: "/v1/customers/{customer_id}/orders"}
    };
  }
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PAID = 2;
}

message Order {
  int64 id = 1;
  string customer_id = 2;
  int64 total_cents = 3;
  OrderStatus status = 4;
}

message CreateOrderRequest {
  string customer_id = 1;
  int64 total_cents = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  int64 id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  OrderStatus status = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}
