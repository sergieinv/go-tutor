// Контракт заказа: на нём пример показывает типы proto3,
// бинарное кодирование и JSON.
syntax = "proto3";

package shop.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "lesson/proto;main";

// Order — заказ интернет-магазина.
message Order {
  // Позиция заказа — вложенное сообщение, в Go это тип Order_Item.
  message Item {
    string sku = 1;
    uint32 quantity = 2;
    int64 price_cents = 3;
  }

  // Оплата картой: храним только последние цифры.
  message CardPayment {
    string last4 = 1;
  }

  int64 id = 1;
  string customer_email = 2;
  OrderStatus status = 3;
  repeated Item items = 4;
  map<string, string> labels = 5;

  // Ровно один способ оплаты (или ни одного).
  oneof payment {
    CardPayment card = 6;
    bool cash_on_delivery = 7;
  }

  // optional — у поля есть presence: «не задано» отличается от "".
  optional string comment = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Duration reserve_for = 10;
}

// OrderStatus — статус заказа. Нулевое значение — «не указан».
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_SHIPPED = 3;
}
