# Учебник целиком: docker compose up --build → http://localhost:8080
# С базами для модуля 10 и дальше и итоговым проектом модулей 11–12
# (labs/README.md): docker compose --profile labs up --build
services:
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    image: go-tutor/site:dev
    # Только localhost: через /api/ сайт проксирует runner, который
    # исполняет произвольный код, — из локальной сети он недоступен.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      runner:
        condition: service_healthy
    networks: [default, sandbox]

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: go-tutor/runner:dev
    # tini как PID 1 собирает зомби, оставшиеся от убитых программ.
    init: true
    environment:
      RUNNER_MODE: local
      RUNNER_SLOTS: "4"
      # Базы профиля labs: на каждый запуск урока runner создаёт отдельную
      # базу и пользователя. Без профиля имена не резолвятся, и урок
      # подсказывает, как его включить.
      # Роль runner — не суперпользователь (labs/initdb): программа ученика
      # работает в той же сети, и пароли из репозитория ей известны.
      RUNNER_LAB_POSTGRES: postgres://runner:labs-runner@postgres:5432/postgres?sslmode=disable
      RUNNER_LAB_MYSQL: runner:labs-runner@tcp(mysql:3306)/
      # Реплика PostgreSQL: урок с labs: [postgres] получает ещё и
      # POSTGRES_REPLICA_DSN — ту же базу, но на реплике (только чтение).
      RUNNER_LAB_POSTGRES_REPLICA: postgres-replica:5432
      # Valkey песочницы — отдельный экземпляр, не тот, что у сервисов: на
      # запуск runner создаёт ACL-пользователя, которому доступны только ключи
      # с его префиксом, и удаляет пользователя и ключи после запуска.
      RUNNER_LAB_VALKEY: valkey://default:labs-valkey@valkey-sandbox:6379
      # Kafka для песочницы выключена: у брокера нет аутентификации и ACL,
      # и программа ученика могла бы читать и удалять чужие топики (в том числе
      # orders.events сервисов), менять настройки брокера и уронить его.
      # Уроки работают на kfake. Включить на своей машине — раскомментировать
      # строку и добавить sandbox в networks сервиса kafka.
      # RUNNER_LAB_KAFKA: kafka:9092
    # Код учеников пишется только во временный каталог в памяти.
    tmpfs:
      - /tmp/runner:size=512m,mode=0711,exec,nosuid,nodev
    # Лимиты на весь runner: защита машины, если что-то пройдёт мимо rlimit'ов слотов.
    mem_limit: 2g
    pids_limit: 1024
    cpus: 2
    networks: [sandbox]

  # Профиль labs. Данные — в tmpfs: базы учебные, после перезапуска пустые.
  # Порты открыты только на localhost — для lessonlint и psql/mysql с машины.
  # Суперпользователям вход из сети песочницы закрыт (labs/initdb), память
  # и tmpfs ограничены: запрос ученика не съест память машины.
  postgres:
    image: postgres:18.4
    profiles: [labs]
    # wal_keep_size — запас WAL, чтобы реплика догоняла после паузы;
    # max_wal_size держит WAL в tmpfs (то есть в памяти) в узде.
    command: ["postgres", "-c", "wal_keep_size=128MB", "-c", "max_wal_size=256MB"]
    environment:
      POSTGRES_PASSWORD: labs
      # База сервиса «Заказы» (labs/orders); runner создаёт свои базы рядом.
      POSTGRES_DB: orders
    tmpfs:
      - /var/lib/postgresql:size=1g
    volumes:
      - ./labs/initdb/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [default, sandbox]

  # Потоковая реплика postgres (модуль 14): при старте снимает копию
  # pg_basebackup и дальше получает WAL. recovery_min_apply_delay
  # применяет транзакции с задержкой 200 мс — так задержка репликации
  # видна в уроках и в «Заказах», а не теряется в миллисекундах локальной
  # сети. Порт с машины — 55433. hot_standby_feedback выключен нарочно:
  # обратная связь (раз в 10 с) держала бы горизонт VACUUM основной базы,
  # и уроки модуля 10 про MVCC и VACUUM видели бы чужие «старые» снимки.
  postgres-replica:
    image: postgres:18.4
    profiles: [labs]
    entrypoint: ["/labs/start.sh"]
    command: ["postgres", "-c", "recovery_min_apply_delay=200ms", "-c", "max_wal_size=256MB"]
    environment:
      PGPASSWORD: labs-replicator
    tmpfs:
      - /var/lib/postgresql:size=1g
    volumes:
      - ./labs/replica/start.sh:/labs/start.sh:ro
    # Данные и WAL лежат в tmpfs и считаются в память контейнера: лимит
    # не меньше, чем у основной, иначе реплику убивает OOM.
    mem_limit: 1g
    ports:
      - "127.0.0.1:55433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [default, sandbox]

  # Второй шард «Заказов» (модуль 14, роутер по покупателю): первый шард —
  # база orders в postgres. Только для сервисов, из песочницы недоступен.
  postgres-shard1:
    image: postgres:18.4
    profiles: [labs]
    environment:
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: orders
    tmpfs:
      - /var/lib/postgresql:size=512m
    mem_limit: 512m
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [default]

  # Valkey (открытый форк Redis) для сервисов: кеш каталога «Заказов».
  # Без пароля, но только в сети default: из песочницы недоступен.
  valkey:
    image: valkey/valkey:9.1.2
    profiles: [labs]
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [default]

  # Valkey для песочницы: администратор — default с паролем, программы
  # ходят ACL-пользователями запусков (только свой префикс ключей, без
  # опасных команд). Пароль в репозитории, поэтому здесь нет ничего, кроме
  # временных ключей уроков. Порт с машины — 56380 (для lessonlint).
  valkey-sandbox:
    image: valkey/valkey:9.1.2
    profiles: [labs]
    command: ["valkey-server", "--requirepass", "labs-valkey", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 96m
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "labs-valkey", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    # default — ради порта на 127.0.0.1: у internal-сети публикации нет.
    networks: [default, sandbox]

  mysql:
    image: mysql:8.4.10
    profiles: [labs]
    environment:
      MYSQL_ROOT_PASSWORD: labs
    tmpfs:
      - /var/lib/mysql:size=1g
    volumes:
      - ./labs/initdb/mysql:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plabs"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [default, sandbox]

  # Kafka в режиме KRaft, один узел. Автосоздание топиков выключено: урок
  # создаёт их сам с префиксом KAFKA_TOPIC_PREFIX, который выдаёт runner.
  # Сервисам — kafka:9092, с машины — localhost:59092; из песочницы брокер
  # недоступен (см. RUNNER_LAB_KAFKA у runner).
  kafka:
    image: apache/kafka:4.3.1
    profiles: [labs]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Контроллер принимает admin-запросы — только внутри контейнера.
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:59092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    tmpfs:
      - /tmp/kraft-combined-logs:size=1g
    mem_limit: 1g
    ports:
      - "127.0.0.1:59092:59092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [default]

  # Итоговый проект модулей 11–12 (labs/README.md): «Заказы», «Склад»,
  # «Уведомления», Jaeger и Prometheus. Образы собираются из каталога labs/
  # (модули ссылаются на labs/api и labs/platform). Порты — только на
  # 127.0.0.1; в сеть sandbox сервисы не входят: программам песочницы до
  # них дела нет.

  # «Заказы» (labs/orders): REST http://127.0.0.1:8090, gRPC 127.0.0.1:50051,
  # метрики и пробы — 127.0.0.1:8190. Миграции и топик orders.events —
  # при старте. DSN — учебный суперпользователь (см. labs/orders/README.md).
  # Модуль 14: кеш каталога в valkey, история с postgres-replica, load
  # shedding на CreateOrder, переключатели /admin/features на служебном
  # порту (для loadgen analyze). Шарды — docker-compose.shards.yml.
  orders:
    build:
      context: ./labs
      dockerfile: orders/Dockerfile
    image: go-tutor/orders:dev
    profiles: [labs]
    environment:
      ORDERS_DB: postgres
      # pool_max_conns — маленький пул нарочно: под нагрузкой видно, как
      # запросы ждут соединения, и что кеш и реплика его разгружают.
      ORDERS_DSN: postgres://postgres:labs@postgres:5432/orders?sslmode=disable&pool_max_conns=8
      ORDERS_WAREHOUSE_ADDR: dns:///warehouse:9090
      ORDERS_KAFKA_BROKERS: kafka:9092
      ORDERS_OTLP_ENDPOINT: jaeger:4317
      ORDERS_GRPC_REFLECTION: "true"
      ORDERS_VALKEY_ADDR: valkey:6379
      # Реплика только читает; суперпользователь на hot standby не может
      # ничего изменить, но в проде здесь была бы роль только с SELECT.
      ORDERS_REPLICA_DSN: postgres://postgres:labs@postgres-replica:5432/orders?sslmode=disable&pool_max_conns=8
      ORDERS_CREATE_MAX_IN_FLIGHT: "16"
      ORDERS_CREATE_MAX_QUEUE: "16"
      ORDERS_CREATE_QUEUE_TIMEOUT: 50ms
      # Служебный /admin/features (кеш и реплика вкл/выкл без перезапуска):
      # порт 8081 опубликован только на 127.0.0.1, в сеть sandbox сервис не
      # входит.
      ORDERS_ADMIN_FEATURES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      # Реплика и valkey необязательны: без них «Заказы» работают (история
      # с основной базы, каталог без кеша) — поэтому service_started.
      postgres-replica:
        condition: service_started
      valkey:
        condition: service_started
      kafka:
        condition: service_healthy
      warehouse:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:50051:9090"
      - "127.0.0.1:8190:8081"
    read_only: true
    mem_limit: 256m
    networks: [default]

  # «Склад» (labs/warehouse): MySQL, база и пользователь warehouse —
  # labs/initdb/mysql/20-warehouse.sql. REST (только GetStock)
  # http://127.0.0.1:8091, gRPC 127.0.0.1:50052, служебный — 127.0.0.1:8191.
  warehouse:
    build:
      context: ./labs
      dockerfile: warehouse/Dockerfile
    image: go-tutor/warehouse:dev
    profiles: [labs]
    environment:
      WAREHOUSE_MYSQL_DSN: warehouse:labs-warehouse@tcp(mysql:3306)/warehouse
      WAREHOUSE_OTLP_ENDPOINT: jaeger:4317
      WAREHOUSE_GRPC_REFLECTION: "true"
    depends_on:
      mysql:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:8091:8080"
      - "127.0.0.1:50052:9090"
      - "127.0.0.1:8191:8081"
    read_only: true
    mem_limit: 256m
    networks: [default]

  # «Уведомления» (labs/notifications): консьюмер orders.events, DLQ —
  # notifications.dlq, обработанные события — SQLite в tmpfs. Только
  # служебный порт 127.0.0.1:8192.
  notifications:
    build:
      context: ./labs
      dockerfile: notifications/Dockerfile
    image: go-tutor/notifications:dev
    profiles: [labs]
    environment:
      NOTIFICATIONS_KAFKA_BROKERS: kafka:9092
      NOTIFICATIONS_OTLP_ENDPOINT: jaeger:4317
      NOTIFICATIONS_DB_PATH: /data/notifications.db
    tmpfs:
      - /data:size=64m,uid=65532,gid=65532,mode=0700
    depends_on:
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:8192:8081"
    read_only: true
    mem_limit: 256m
    networks: [default]

  # Генератор нагрузки (labs/loadgen, модуль 14). Свой профиль loadtest:
  # «docker compose --profile labs up» его не запускает, а
  # «docker compose --profile labs run --rm loadgen analyze» включает
  # профиль сам. depends_on нет нарочно: run не трогает уже запущенные
  # базы, а loadgen сам ждёт готовности «Заказов». Ходит только по HTTP в
  # orders внутри сети default; портов не публикует, в sandbox не входит.
  loadgen:
    build:
      context: ./labs
      dockerfile: loadgen/Dockerfile
    image: go-tutor/loadgen:dev
    profiles: [loadtest]
    environment:
      LOADGEN_TARGET: http://orders:8080
      LOADGEN_OPS: http://orders:8081
    command: ["analyze"]
    read_only: true
    mem_limit: 256m
    networks: [default]

  # Jaeger v2 (all-in-one, хранилище в памяти): приём OTLP/gRPC на 4317
  # из docker-сети, UI — http://127.0.0.1:16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [labs]
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 512m
    networks: [default]

  # Prometheus: скрейпит служебные порты трёх сервисов (labs/prometheus),
  # UI — http://127.0.0.1:9091.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [labs]
    volumes:
      - ./labs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:size=256m,uid=65534,gid=65534
    ports:
      - "127.0.0.1:9091:9090"
    mem_limit: 512m
    networks: [default]

networks:
  # internal: у runner нет выхода в интернет, но site до него достаёт.
  sandbox:
    internal: true
    # Подсеть фиксирована: по ней базы labs не пускают суперпользователей
    # из песочницы (labs/initdb).
    ipam:
      config:
        - subnet: 172.29.99.0/24
